","A client contract","No document needed"],1],["What complements motorized equipment for one-off tasks?",["Hand tools","The auto-scrubber","The extractor","The floor machine"],0]]},{"num":5,"title":"Professional Cleaning Techniques","duree":"4 hours","objectifs":["Apply the correct cleaning techniques for each type of surface","Adapt your method to the environment","Carry out a complete cleaning assignment to professional standards"],"chapters":[{"title":"Dusting","content":["Dusting consists of removing dust from horizontal and vertical surfaces using a dry or slightly damp cloth, working from top to bottom to avoid re-soiling surfaces that have already been cleaned."]},{"title":"Vacuuming","content":["Vacuuming removes dry dirt and debris from floors and carpets. The power and attachment must be adapted to the surface, and the work must be done methodically so nothing is missed."]},{"title":"Wet Cleaning","content":["Wet cleaning uses a cleaning solution to remove ingrained dirt from a surface. You must use the correct dilution, rinse if necessary and dry thoroughly to avoid streaks."]},{"title":"Washrooms","content":["Washroom cleaning follows a strict protocol: disinfection of toilets, sinks, mirrors and dispensers, respecting the contact time of disinfectants and working from cleanest to dirtiest."]},{"title":"Kitchens","content":["Kitchen maintenance requires particular attention to food hygiene: degreasing cooking surfaces, disinfecting counters and properly managing food waste."]},{"title":"Glass and Windows","content":["Cleaning windows and mirrors without streaks requires a precise technique: uniform application of the product, squeegeeing in a single continuous motion, then wiping the edges with a dry cloth."]},{"title":"Stairs","content":["Stair maintenance combines dusting of steps and handrails, with particular attention to safety (slippery surfaces, signage during washing)."]},{"title":"Elevators","content":["Elevators, being high-traffic areas, require frequent cleaning of walls, buttons and mirrors, as well as the floor — often several times a day in large buildings."]},{"title":"Entrances","content":["Main entrances are a building's first impression: they require frequent maintenance of windows, mats and floors to manage dirt brought in from outside."]},{"title":"Meeting Rooms","content":["Meeting room maintenance includes cleaning tables, chairs and audiovisual equipment, and tidying up the space between uses."]},{"title":"Floors","content":["Each type of floor (ceramic, vinyl, wood, carpet) requires a specific method and products; using the wrong method can permanently damage the surface."]},{"title":"Sensitive Surfaces","content":["Some surfaces (varnished wood, stainless steel, glass, marble) are sensitive to scratches or to certain chemical products and require special precautions and suitable products."]}],"activity":{"label":"Lab","title":"Complete Practice","steps":["Set-up of a space simulating several real environments (office, washroom, kitchen, meeting room).","Participants, in rotation, perform a complete cleaning of each station applying the module's techniques.","The trainer observes and corrects movements in real time, then leads a group debrief on strengths and areas for improvement."]},"quiz":[["In what order should a room be dusted?",["Bottom to top","Top to bottom","Randomly","It does not matter"],1],["What must be adapted to the surface when vacuuming?",["Nothing","The power and the attachment","Only the machine's colour","The product's price"],1],["Which step is essential after wet cleaning to avoid streaks?",["Air-dry without wiping","Dry the surface thoroughly","Do nothing","Add more water"],1],["In what order should washrooms be cleaned?",["From dirtiest to cleanest","From cleanest to dirtiest","Randomly","It does not matter"],1],["What is a particular priority when maintaining a kitchen?",["Food hygiene","Decoration","Noise","No particular priority"],0],["Which technique cleans a window without streaks?",["Rub in all directions","Uniform application then squeegeeing in one continuous motion","Use an excess of undiluted product","Never wipe the edges"],1],["What particular attention is required when maintaining stairs?",["None","Safety (slippery surfaces, signage)","Decoration","Speed only"],1],["Why do elevators require frequent cleaning?",["They are rarely used","They are high-traffic areas","They never get dirty","No reason"],1],["Why is the maintenance of main entrances important?",["They are a building's first impression","It is not important","They never get dirty","No reason"],0],["What must be done between two uses of a meeting room?",["Nothing","Clean and tidy up the space","Close the room permanently","No action required"],1],["Why does each type of floor require a specific method?",["To complicate the task","To avoid damaging the surface","It is not necessary","No reason"],1],["Which surfaces are considered sensitive?",["Raw concrete","Varnished wood, stainless steel, glass, marble","Warehouse floors","No surface is sensitive"],1],["What is the main objective of the \"Complete Practice\" lab?",["Memorize theory only","Perform a complete cleaning applying the techniques learned","Watch a video","No particular objective"],1],["Which work method should be favoured to be efficient and thorough?",["Work at random","Follow a systematic, structured method","Improvise on each assignment","No method needed"],1],["What should a professional do when unsure of the appropriate method for a surface?",["Use any product","Check the recommendations or ask their supervisor","Ignore the surface","Always use a stripper"],1]]},{"num":6,"title":"Customer Service","duree":"1 hour","objectifs":["Adopt a professional attitude with clients","Communicate effectively in all situations","Handle complaints professionally"],"chapters":[{"title":"Communication","content":["Clear, polite and respectful communication with the client avoids misunderstandings and builds a lasting relationship of trust."]},{"title":"Attitude","content":["A positive, proactive attitude, even with unexpected requests, contributes directly to client satisfaction and to the company's reputation."]},{"title":"Punctuality","content":["Respecting agreed schedules demonstrates the worker's seriousness and professionalism; any delay must be communicated as early as possible."]},{"title":"Confidentiality","content":["Strict respect for the confidentiality of the premises, information and occupants is an essential condition of the client's trust."]},{"title":"Professionalism","content":["Professionalism shows in every action: quality of work, respect for the premises, discretion and consistency from one assignment to the next."]},{"title":"Handling Complaints","content":["When facing a complaint, you must listen actively, acknowledge the problem without excessive self-justification, and pass the information on to your supervisor to find a quick solution."]},{"title":"Personal Image","content":["Personal image (attire, hygiene, language) directly reflects the company's image to the client and must always remain neat and professional."]}],"activity":{"label":"Role Play","title":"Client Scenarios","steps":["Participants are paired in teams of two: one plays the client, the other the cleaning professional.","Several scenarios are proposed: dissatisfied client, last-minute request, unexpected delay.","Each team presents its scenario to the group, followed by constructive feedback from the trainer."]},"quiz":[["Why is communication with the client important?",["It is not","To avoid misunderstandings and build trust","Only for appearances","No reason"],1],["What should you do in case of a delay?",["Say nothing","Communicate the delay as early as possible","Ignore the schedule","Cancel without notice"],1],["What does confidentiality represent in the client relationship?",["An essential condition of trust","An optional extra","An unimportant detail","A useless constraint"],0],["How should you react to a client's complaint?",["Justify yourself excessively","Listen actively and pass the information to the supervisor","Ignore the complaint","Respond impatiently"],1],["What is professionalism in this trade?",["A one-time effort","Consistency in quality, respect and discretion","A vague concept with no application","Of no importance"],1],["An employee's personal image reflects:",["Only their personality","The company's image to the client","Nothing in particular","No link with the company"],1],["Which attitude promotes client satisfaction?",["A negative attitude","A positive, proactive attitude","Indifference","Disinterest"],1],["What is the objective of the role plays in this module?",["Entertainment only","Practising real client communication situations","Replacing theory","No particular objective"],1]]},{"num":7,"title":"Quality and Inspections","duree":"2 hours","objectifs":["Understand the importance of quality control","Use an inspection checklist effectively","Identify and correct frequent errors"],"chapters":[{"title":"Why Inspect?","content":["Inspection makes it possible to verify that the work performed meets the client's expectations before leaving the premises, rather than waiting for a complaint to correct an error."]},{"title":"Checklists","content":["A checklist structures the inspection by systematically listing every zone and every task to verify, ensuring that no important element is forgotten."]},{"title":"Quality Control","content":["Quality control is a continuous process that compares the result obtained against established standards, and allows the work method to be adjusted quickly if necessary."]},{"title":"Frequent Errors","content":["Some errors come up often: overlooked low-visibility areas, unwiped product residue, incorrect dilution or unrespected contact time. Recognizing them helps avoid them."]},{"title":"Reports","content":["An inspection report documents the results observed and the corrections made, and serves as proof of the quality of the work for both the client and the employer."]},{"title":"Continuous Improvement","content":["Continuous improvement means using inspection results to adjust your methods and constantly progress in the quality of your work."]}],"activity":{"label":"Exercise","title":"Real Inspection","steps":["Participants perform a complete inspection of a previously cleaned space, using a standardized checklist.","They identify non-conformities and propose the appropriate corrections.","An inspection report is written and presented to the trainer."]},"quiz":[["Why perform an inspection before leaving an assignment?",["It is not necessary","To verify that the work meets the client's expectations","To waste time","No reason"],1],["What does an inspection checklist make possible?",["Nothing in particular","Structuring the inspection and avoiding omissions","Replacing the work","Decorating the report"],1],["What is quality control?",["A continuous process of comparison against established standards","An optional task","A one-time action with no follow-up","No particular process"],0],["Which of these errors is frequent during cleaning?",["Cleaning too well","Overlooking low-visibility areas","Too much rigour","No error possible"],1],["What is an inspection report for?",["Documenting the results and corrections","Nothing in particular","Replacing the checklist","Decorating the client file"],0],["What does continuous improvement mean?",["Never changing your method","Adjusting your methods based on inspection results","Ignoring feedback","No link with quality"],1],["What is a possible consequence of not respecting a disinfectant's contact time?",["No consequence","Incomplete disinfection","Better effectiveness","A faster result"],1],["What must be done if a non-conformity is identified during an inspection?",["Ignore it","Propose and apply a correction","Report nothing","Wait for the client's complaint"],1],["What is the link between quality and client satisfaction?",["No link","Consistent quality promotes client satisfaction and loyalty","Quality harms satisfaction","No possible connection"],1],["Which tool ensures that no zone is forgotten during an inspection?",["A checklist","An invoice","A contract","No tool needed"],0]]},{"num":8,"title":"Preparing for the Job Market","duree":"1 hour","objectifs":["Prepare an effective resume and interview","Understand the expectations of employers in the sector","Plan your career development in the industry"],"chapters":[{"title":"Creating a Resume","content":["An effective resume for the cleaning sector highlights practical skills, reliability, relevant experience and, where applicable, the certificate obtained at the end of the training."]},{"title":"Preparing for an Interview","content":["Preparing for an interview means knowing the company, preparing concrete examples of your experience and presenting yourself with professional attire and attitude."]},{"title":"How to Answer Questions","content":["Answers to interview questions must be clear, honest and structured, emphasizing your strengths, motivation and reliability."]},{"title":"Employer Expectations","content":["Employers in the sector look above all for punctuality, reliability, attention to detail and a good ability to work independently or as part of a team."]},{"title":"Professional Image","content":["From the very first contact with a potential employer, professional image (attire, punctuality, communication) strongly influences the first impression."]},{"title":"Career Development","content":["Once employed, it is possible to progress to a supervisor or contract manager role, or to move toward entrepreneurship by continuing your journey in the next levels of ESSOR Cleaning Academy™."]}],"activity":{"label":"Simulation","title":"Interview","steps":["Each participant performs a job interview simulation with the trainer or a peer, based on typical questions from the sector.","Individual feedback on preparation, posture and the answers given.","Distribution of a memory aid of frequent interview questions in the cleaning sector."]},"quiz":[["What should a resume highlight in the cleaning sector?",["Education only","Practical skills, reliability and the certificate obtained","Nothing in particular","Hobbies only"],1],["How should you prepare before an interview?",["Prepare nothing","Know the company and prepare concrete examples","Improvise completely","Arrive late"],1],["Which qualities do employers look for most in this sector?",["Punctuality and reliability","No particular quality","Experience only","Diploma only"],0],["What is the impact of professional image on a first contact with an employer?",["No impact","It strongly influences the first impression","It is unimportant","It only matters after hiring"],1],["What is a possible path of progression after this program?",["No progression possible","Supervisor, contract manager or entrepreneurship","Only remaining a cleaner forever","Changing sectors completely"],1],["How should you answer interview questions?",["Vaguely","Clearly, honestly and in a structured way","By avoiding answering","By improvising without thinking"],1],["What is the objective of the interview simulation?",["No objective","Practising and receiving feedback before a real interview","Replacing the resume","Decorating the program"],1],["What does a memory aid of frequent interview questions provide?",["Nothing in particular","Better preparation for future interviews","A replacement for the resume","A way to avoid any preparation"],1]]}]},{"id":"cleaning-p2","lang":"fr","badge":"ESSOR Cleaning Academy™ · Français · Niveau 2","title":"Programme 2 — Techniques avancées et spécialisation","desc":"Le niveau 2 pour aller plus loin : planchers durs, tapis, désinfection avancée, nettoyage de chantier, productivité, supervision et soumissions. Prérequis : certificat du Programme 1.","duration":"24 heures","level":"Intermédiaire","modules":[{"num":1,"title":"Entretien avancé des planchers durs","duree":"4 heures","objectifs":["Identifier les types de planchers durs et leurs finis","Maîtriser le décapage complet et l'application d'un fini","Réaliser un polissage haute vitesse sécuritaire","Planifier l'entretien périodique d'un plancher"],"chapters":[{"title":"Types de planchers et finis","content":[["Les planchers résilients","Le vinyle (VCT, LVT), le linoléum et le caoutchouc sont les planchers commerciaux les plus courants. Le VCT exige un fini protecteur (cire) renouvelé périodiquement, tandis que le LVT moderne n'en demande généralement pas — appliquer un fini sur un LVT peut même annuler la garantie du fabricant."],["Les planchers minéraux","La céramique, le terrazzo, le béton poli et la pierre naturelle (marbre, granit) ont chacun leurs exigences : le marbre ne tolère aucun produit acide, le béton poli se nettoie à l'autolaveuse avec un produit neutre, et les joints de céramique demandent un entretien spécifique."],["Reconnaître le fini existant","Avant toute intervention, il faut identifier le fini en place : un test discret dans un coin (goutte de décapant ou grattage léger) révèle le type et l'épaisseur des couches accumulées, ce qui détermine la méthode et les produits à utiliser."]]},{"title":"Le décapage : préparation","content":["Le décapage retire toutes les couches de fini accumulées pour repartir à neuf. La préparation représente la moitié du succès : dégager complètement la zone, dépoussiérer, protéger les plinthes et les seuils, afficher la signalisation, préparer la solution décapante selon la dilution du fabricant et prévoir la ventilation. On planifie toujours le travail par sections pour garder un chemin de sortie sec."]},{"title":"Le décapage : exécution","content":["La solution décapante est appliquée généreusement à la vadrouille et doit agir le temps recommandé (généralement 5 à 10 minutes) sans jamais sécher sur le plancher. On frotte ensuite à la polisseuse basse vitesse munie d'un tampon noir ou d'une brosse à décaper, on récupère la solution souillée à l'aspirateur à liquides, puis on rince au moins deux fois à l'eau claire — un rinçage insuffisant est la première cause d'échec du fini qui suivra."]},{"title":"L'application du fini","content":["Le fini s'applique uniquement sur un plancher parfaitement propre, rincé et sec, avec une vadrouille à fini propre (ou un applicateur dédié), en couches minces et uniformes. On respecte le temps de séchage entre chaque couche (30 à 60 minutes selon l'humidité) et on applique généralement 3 à 5 couches. Les premières couches peuvent s'arrêter à quelques centimètres des plinthes ; les dernières couvrent toute la surface."]},{"title":"Le polissage haute vitesse","content":["Le polissage (burnishing) à haute vitesse (1500 à 3000 tr/min) redonne la brillance entre deux décapages en refermant la surface du fini. Il exige un plancher dépoussiéré, un tampon adapté (souvent beige ou champagne), des passes régulières qui se chevauchent, et une attention constante au fil électrique et aux personnes à proximité. Un aspirateur intégré ou un dépoussiérage après polissage retire les résidus fins produits."]},{"title":"Restauration et entretien périodique","content":["Entre le simple lavage quotidien et le décapage complet existe une gamme d'interventions : le nettoyage en profondeur (scrub and recoat) retire la couche superficielle usée et rajoute une ou deux couches de fini sans tout décaper. Un bon calendrier d'entretien — quotidien, hebdomadaire, mensuel, annuel — prolonge la vie du fini, réduit les coûts et maintient l'apparence en tout temps."]},{"title":"Sécurité des travaux de planchers","content":["Les travaux de planchers combinent plusieurs risques majeurs : plancher extrêmement glissant pendant le décapage, produits très alcalins (décapants) exigeant gants et lunettes, équipement lourd à fil, et circulation des occupants. La zone doit être complètement fermée à la circulation, la signalisation posée à toutes les entrées, et les chaussures antidérapantes (idéalement avec couvre-chaussures à crampons pour le décapage) sont obligatoires."]}],"activity":{"label":"Laboratoire","title":"Décapage et finition d'une section de plancher","steps":["En équipes, les participants préparent la zone : dégagement, signalisation, protection des plinthes et préparation de la solution.","Décapage complet d'une section de VCT : application, temps de contact, frottage mécanique, récupération et double rinçage.","Application de trois couches de fini en respectant les temps de séchage, puis inspection croisée entre les équipes.","Le formateur évalue la technique, la sécurité et le résultat final de chaque équipe."]},"quiz":[["Quel type de plancher moderne ne demande généralement PAS de fini protecteur ?",["Le VCT","Le LVT","Le terrazzo","Le linoléum"],1],["Quel produit ne doit JAMAIS être utilisé sur du marbre ?",["Un produit neutre","Un produit acide","De l'eau tiède","Un nettoyant doux"],1],["Que faut-il faire avant de choisir la méthode de décapage ?",["Rien de particulier","Identifier le fini en place par un test discret","Appliquer directement le fini","Polir le plancher"],1],["Pendant le temps de contact, la solution décapante ne doit jamais :",["Rester humide","Sécher sur le plancher","Être frottée","Être récupérée"],1],["Quelle est la première cause d'échec d'un nouveau fini ?",["Trop de couches","Un rinçage insuffisant après le décapage","Un tampon trop doux","Une vadrouille neuve"],1],["Combien de couches de fini applique-t-on généralement ?",["1","2","3 à 5","10"],2],["Le fini s'applique en couches :",["Épaisses et rapides","Minces et uniformes","Croisées sans séchage","Une seule couche épaisse"],1],["À quelle vitesse tourne une polisseuse haute vitesse (burnisher) ?",["100 à 300 tr/min","500 à 800 tr/min","1500 à 3000 tr/min","10 000 tr/min"],2],["Que permet le « scrub and recoat » ?",["Décaper entièrement le plancher","Rafraîchir le fini sans décapage complet","Remplacer le plancher","Éliminer le polissage à vie"],1],["Pourquoi travaille-t-on par sections lors d'un décapage ?",["Pour aller plus vite","Pour garder un chemin de sortie sec et sécuritaire","Pour économiser du produit","Aucune raison"],1],["Quel tampon utilise-t-on généralement pour décaper ?",["Blanc","Beige","Noir","Rose"],2],["Quel équipement récupère la solution décapante souillée ?",["La vadrouille sèche","L'aspirateur à liquides","Le balai","Le chiffon microfibre"],1],["Avant d'appliquer le fini, le plancher doit être :",["Légèrement humide","Propre, rincé et parfaitement sec","Encore couvert de décapant","Chaud"],1],["Quel ÉPI est spécifiquement recommandé pendant le décapage ?",["Sandales","Couvre-chaussures antidérapants à crampons","Gants de laine","Casque d'écoute"],1],["Quel est l'objectif d'un calendrier d'entretien périodique ?",["Compliquer le travail","Prolonger la vie du fini et réduire les coûts","Éviter le nettoyage quotidien","Décaper plus souvent"],1]]},{"num":2,"title":"Entretien spécialisé des tapis et tissus","duree":"3 heures","objectifs":["Identifier les fibres et adapter la méthode de nettoyage","Maîtriser l'extraction à eau chaude et le détachage","Prévenir les moisissures et prolonger la vie des tapis"],"chapters":[{"title":"Les fibres et leur comportement","content":["Le nylon domine les tapis commerciaux pour sa résistance ; l'oléfine résiste bien à l'humidité mais aime la graisse ; la laine, luxueuse, ne tolère ni forte chaleur ni produits alcalins puissants. Identifier la fibre (étiquette, test de combustion réalisé par un spécialiste, ou documentation du client) détermine la température, les produits et la méthode admissibles."]},{"title":"L'extraction à eau chaude","content":["L'extraction à eau chaude est la méthode de nettoyage en profondeur de référence : pré-aspiration minutieuse, application d'un pré-traitement sur les zones de passage, temps de contact, puis passes d'extraction lentes qui injectent la solution et la récupèrent immédiatement. On termine par des passes de récupération à sec pour retirer un maximum d'humidité."]},{"title":"Le détachage","content":["La règle d'or du détachage : agir vite, absorber sans frotter, travailler du bord de la tache vers le centre, et tester le produit dans un endroit discret. Chaque famille de tache a son traitement — protéiques (sang, nourriture) à l'eau froide et détachant enzymatique, grasses au solvant approprié, tanins (café, vin) au détachant acide doux. Frotter une tache l'étend et endommage la fibre."]},{"title":"Méthodes à faible humidité","content":["Le nettoyage par encapsulation (produit cristallisant appliqué à la brosse mécanique puis aspiré) et le bonnet permettent un entretien intermédiaire rapide avec un séchage en moins d'une heure — idéal pour les espaces qui ne peuvent pas fermer longtemps. Ces méthodes complètent l'extraction sans la remplacer."]},{"title":"L'entretien préventif","content":["80 % de la saleté d'un tapis entre par les 3 premiers mètres : des tapis d'entrée bien dimensionnés et entretenus, une aspiration quotidienne des zones de passage et un programme d'entretien planifié (encapsulation mensuelle, extraction semestrielle) prolongent la vie du tapis de plusieurs années et réduisent les coûts totaux."]},{"title":"Séchage et prévention des moisissures","content":["Un tapis qui reste humide plus de 24 à 48 heures devient un terrain de moisissures et d'odeurs. Après toute extraction : maximiser la ventilation, utiliser des ventilateurs de séchage, éviter de remettre le mobilier avant séchage complet et protéger les pieds de meubles avec des cales. En cas de dégât d'eau important, l'extraction rapide et la déshumidification sont urgentes."]}],"activity":{"label":"Laboratoire","title":"Clinique de détachage","steps":["Le formateur prépare des échantillons de tapis avec des taches types : café, encre, graisse, boisson sucrée.","Chaque participant identifie la tache, choisit le détachant approprié et applique la technique (absorber, travailler vers le centre, rincer).","Comparaison des résultats et discussion : quelles taches exigent un spécialiste ?"]},"quiz":[["Quelle fibre domine les tapis commerciaux ?",["La laine","Le nylon","Le coton","La soie"],1],["Quelle fibre ne tolère pas les produits alcalins puissants ?",["Le nylon","L'oléfine","La laine","Le polyester"],2],["Quelle est la première étape d'une extraction à eau chaude ?",["L'application du fini","La pré-aspiration minutieuse","Le polissage","Le séchage"],1],["Comment traite-t-on une tache : on travaille toujours…",["Du centre vers le bord","Du bord vers le centre","En frottant fort","Avec de l'eau très chaude"],1],["Pourquoi ne faut-il jamais frotter une tache ?",["Cela prend trop de temps","Cela étend la tache et endommage la fibre","Cela use le chiffon","Aucune raison"],1],["Quel type de détachant convient aux taches protéiques (sang, nourriture) ?",["Solvant à sec","Eau froide et détachant enzymatique","Eau bouillante","Décapant à plancher"],1],["Quel est l'avantage principal de l'encapsulation ?",["Un nettoyage plus profond que l'extraction","Un séchage en moins d'une heure","Aucun équipement requis","Un parfum durable"],1],["Par où entre environ 80 % de la saleté d'un tapis ?",["Les fenêtres","Les 3 premiers mètres (entrées)","La ventilation","Le plafond"],1],["Au-delà de combien de temps un tapis humide risque-t-il la moisissure ?",["2 heures","24 à 48 heures","1 semaine","Jamais"],1],["Que fait-on immédiatement après une extraction pour accélérer le séchage ?",["On ferme toutes les portes","On maximise la ventilation et on utilise des ventilateurs","On remet le mobilier","On arrose le tapis"],1]]},{"num":3,"title":"Désinfection avancée et contrôle des infections","duree":"3 heures","objectifs":["Comprendre la chaîne de transmission des infections","Appliquer les protocoles de désinfection de niveau santé","Réagir efficacement lors d'une éclosion"],"chapters":[{"title":"La chaîne de transmission","content":["Une infection se propage lorsque la chaîne est complète : un agent pathogène, un réservoir (surface, personne), une porte de sortie, un mode de transmission (mains, gouttelettes, surfaces), une porte d'entrée et un hôte réceptif. Le nettoyage et la désinfection brisent cette chaîne au maillon des surfaces — c'est le rôle direct du professionnel de l'hygiène."]},{"title":"Nettoyer avant de désinfecter","content":["Un désinfectant appliqué sur une surface sale est largement inefficace : la matière organique le neutralise. La règle professionnelle est toujours en deux temps — nettoyer d'abord (retirer la saleté), désinfecter ensuite (éliminer les micro-organismes) — sauf avec certains produits « nettoyants-désinfectants » homologués une étape, utilisés selon leur étiquette."]},{"title":"Les niveaux de désinfection","content":["On distingue l'assainissement (réduction du nombre de microbes, ex. surfaces alimentaires), la désinfection de bas niveau (bactéries courantes, certains virus) et la désinfection de haut niveau réservée au matériel médical. Le choix du produit se fait selon son numéro d'homologation (DIN au Canada), le micro-organisme visé et le temps de contact indiqué sur l'étiquette."]},{"title":"Protocoles en milieu de santé","content":["En clinique, en résidence ou en milieu hospitalier, le travail suit des protocoles stricts : ordre de nettoyage du plus propre au plus contaminé, changement de chiffons et de gants entre les chambres, produits homologués contre les pathogènes ciblés, respect scrupuleux des temps de contact, et signalement immédiat de toute situation anormale au responsable de la prévention des infections."]},{"title":"Points de contact et zones à haut risque","content":["Les points de contact fréquents — poignées, interrupteurs, rampes, boutons d'ascenseur, robinets, claviers partagés — accumulent et transmettent les microbes bien plus que les planchers. Un programme de désinfection efficace les cible à haute fréquence (plusieurs fois par jour dans les zones à risque) avec une liste de contrôle précise par pièce."]},{"title":"Éclosion : protocole renforcé","content":["Lors d'une éclosion (gastro-entérite, influenza, COVID ou autre), le protocole s'intensifie : produit homologué contre le pathogène en cause, fréquences doublées sur les points de contact, ÉPI renforcé (gants, masque, parfois blouse), gestion stricte des déchets et des chiffons contaminés, et coordination étroite avec le client et la santé publique le cas échéant."]},{"title":"Documentation et registres","content":["En désinfection de niveau santé, ce qui n'est pas documenté n'existe pas : registres de passage signés et horodatés, fiches de dilution des produits, listes de contrôle par zone et rapports d'incident constituent la preuve du travail réalisé — une exigence croissante des clients institutionnels et un argument commercial majeur."]}],"activity":{"label":"Simulation","title":"Gérer une éclosion de gastro-entérite","steps":["Scénario : une éclosion est déclarée dans une résidence pour aînés ; l'équipe doit adapter son protocole en 30 minutes.","En sous-groupes : choisir le produit approprié, redéfinir les fréquences, lister l'ÉPI requis et rédiger la liste de contrôle des points de contact.","Présentation des plans au groupe et rétroaction du formateur sur les oublis critiques."]},"quiz":[["Que brise le nettoyage-désinfection dans la chaîne de transmission ?",["La porte d'entrée","Le maillon des surfaces (réservoir/transmission)","L'hôte réceptif","Rien"],1],["Pourquoi faut-il nettoyer AVANT de désinfecter ?",["Pour l'odeur","La matière organique neutralise le désinfectant","Pour économiser l'eau","Ce n'est pas nécessaire"],1],["Que signifie le numéro DIN sur un désinfectant au Canada ?",["Le prix suggéré","L'homologation officielle du produit","La date de péremption","Le niveau de danger"],1],["Dans quel ordre nettoie-t-on en milieu de santé ?",["Du plus contaminé au plus propre","Du plus propre au plus contaminé","Au hasard","Selon la superficie"],1],["Que fait-on des chiffons entre deux chambres en milieu de santé ?",["On les réutilise tels quels","On les change","On les rince à l'eau froide seulement","On les sèche"],1],["Lesquels accumulent le plus de microbes ?",["Les plafonds","Les points de contact fréquents","Les planchers","Les fenêtres"],1],["Donnez un exemple de point de contact :",["Une poignée de porte","Un mur","Un plafond","Une fenêtre fixe"],0],["Lors d'une éclosion, les fréquences de désinfection des points de contact sont :",["Réduites","Inchangées","Augmentées (souvent doublées)","Supprimées"],2],["Quel élément s'ajoute souvent à l'ÉPI lors d'une éclosion ?",["Des sandales","Un masque (et parfois une blouse)","Un casque de chantier","Rien"],1],["À quoi servent les registres de passage signés ?",["À décorer les murs","À prouver le travail réalisé","À remplacer le nettoyage","À rien"],1],["Le temps de contact d'un désinfectant est indiqué :",["Sur l'étiquette du produit","Nulle part","Par le client","Sur la facture"],0],["La désinfection de haut niveau est réservée :",["Aux planchers","Au matériel médical","Aux vitres","Aux tapis"],1]]},{"num":4,"title":"Nettoyage après construction et remises en état","duree":"3 heures","objectifs":["Planifier les trois phases d'un nettoyage de chantier","Traiter les poussières fines et les résidus de construction","Travailler en sécurité dans un environnement de chantier"],"chapters":[{"title":"Les trois phases du nettoyage de chantier","content":[["Phase 1 — Gros nettoyage (rough clean)","Pendant ou juste après les travaux : retrait des débris, balayage industriel, nettoyage des fenêtres de leurs autocollants et retrait des protections. L'objectif est de rendre le chantier circulable."],["Phase 2 — Nettoyage détaillé (final clean)","Le cœur du mandat : dépoussiérage complet de toutes les surfaces (incluant conduits apparents, luminaires, tablettes), lavage des vitres, nettoyage des salles de bain et cuisines neuves, planchers en finition."],["Phase 3 — Retouches (touch-up clean)","Après le passage des derniers corps de métier et avant la livraison au client : reprise des traces, dépoussiérage final et inspection complète avec la liste de contrôle de livraison."]]},{"title":"Les poussières fines","content":["La poussière de gypse et de béton s'infiltre partout et se redépose pendant des jours : il faut aspirer avec des filtres HEPA plutôt que balayer, essuyer les surfaces à l'humide en rinçant souvent, traiter du haut vers le bas, et prévoir plusieurs passes. Balayer à sec de la poussière fine la remet simplement en suspension."]},{"title":"Résidus, adhésifs et taches de chantier","content":["Autocollants de fenêtres, résidus de ruban, éclaboussures de peinture, de joint ou de béton exigent des techniques ciblées : grattoir à lame sur le verre (mouillé, à angle faible), solvants adaptés testés discrètement, et patience — forcer un résidu sec raye la surface neuve, la pire erreur possible sur un chantier de finition."]},{"title":"Vitres et surfaces neuves","content":["Les surfaces neuves sont paradoxalement les plus fragiles : verre neuf facilement rayé par les débris pris dans le chiffon, acier inoxydable qui marque, robinetterie qui s'égratigne. On rince abondamment avant d'essuyer, on change les chiffons très souvent et on proscrit tout tampon abrasif sur les surfaces de finition."]},{"title":"Sécurité sur un chantier","content":["Le chantier impose ses règles : casque, bottes de sécurité et dossard là où le port en est exigé, respect du plan de circulation, attention aux travaux en hauteur des autres corps de métier, vérification que l'électricité et l'eau sont fonctionnelles et sécuritaires, et coordination systématique avec le surintendant de chantier avant d'entrer dans une zone."]},{"title":"Coordination avec l'entrepreneur","content":["Le nettoyage de chantier est un maillon d'un échéancier serré : confirmer les dates et les zones prêtes, documenter l'état à l'arrivée (photos), signaler immédiatement tout dommage constaté avant de commencer, et faire signer la liste de vérification de livraison protège l'entreprise de nettoyage et bâtit sa réputation auprès des entrepreneurs généraux."]}],"activity":{"label":"Étude de cas","title":"Planifier un nettoyage de fin de chantier","steps":["Cas fourni : un étage de bureaux de 8 000 pi² livré dans 5 jours, avec plan et photos du chantier.","En équipes : établir la séquence des 3 phases, la liste d'équipement (incluant filtres HEPA), l'effectif requis et les points de vigilance sécurité.","Chaque équipe présente son plan ; le formateur compare avec un plan réel de l'industrie."]},"quiz":[["Combien de phases compte un nettoyage de chantier complet ?",["Une","Deux","Trois","Cinq"],2],["Quel est l'objectif de la phase 1 (rough clean) ?",["La livraison finale","Rendre le chantier circulable","Le polissage des planchers","L'inspection"],1],["Pourquoi aspire-t-on la poussière fine avec un filtre HEPA au lieu de balayer ?",["C'est plus rapide","Balayer remet la poussière en suspension","C'est moins cher","Aucune raison"],1],["Comment retire-t-on un autocollant sur du verre neuf ?",["Tampon abrasif à sec","Grattoir à lame sur surface mouillée, à angle faible","Décapant à plancher","Brosse métallique"],1],["Quelle est la pire erreur sur des surfaces de finition neuves ?",["Trop rincer","Les rayer en forçant un résidu sec","Changer de chiffon","Travailler lentement"],1],["Pourquoi change-t-on très souvent de chiffon sur un chantier ?",["Par habitude","Les débris pris dans le chiffon rayent les surfaces neuves","Pour la couleur","Aucune raison"],1],["Quels ÉPI un chantier peut-il exiger en plus ?",["Casque, bottes de sécurité, dossard","Sandales et casquette","Aucun","Gants de cuisine"],0],["Que fait-on avant de commencer dans une zone de chantier ?",["On entre sans avertir","On se coordonne avec le surintendant","On attend le client final","On commence par les vitres"],1],["Pourquoi documente-t-on l'état des lieux à l'arrivée (photos) ?",["Pour les réseaux sociaux","Pour se protéger en cas de dommage préexistant","Ce n'est pas utile","Pour la décoration"],1],["Quel document clôt la phase 3 avant la livraison ?",["Une facture verbale","La liste de vérification de livraison signée","Un texto","Aucun document"],1]]},{"num":5,"title":"Nettoyage écologique et certifications vertes","duree":"2 heures","objectifs":["Comprendre les principes du nettoyage écologique","Connaître les certifications reconnues et leurs exigences","Présenter la valeur du nettoyage vert à un client"],"chapters":[{"title":"Pourquoi le nettoyage écologique","content":["Le nettoyage écologique réduit l'exposition des occupants et des travailleurs aux substances irritantes, améliore la qualité de l'air intérieur, diminue l'impact environnemental (eau, emballages, rejets) et répond à une demande croissante des clients — il est passé d'un argument marketing à une exigence contractuelle dans de nombreux immeubles."]},{"title":"Les certifications de produits","content":["EcoLogo (UL 2792) et Green Seal certifient qu'un produit respecte des critères stricts d'impact environnemental et de performance. Sur l'étiquette, on cherche le logo officiel de certification par une tierce partie — à distinguer des mentions vagues (« naturel », « vert ») sans vérification indépendante, une pratique appelée écoblanchiment (greenwashing)."]},{"title":"Produits et équipements écologiques","content":["Au-delà des produits certifiés : les concentrés à dilution contrôlée réduisent les emballages et le gaspillage, la microfibre de qualité nettoie avec moins de produit et d'eau, les aspirateurs à filtration HEPA protègent l'air intérieur, et les autolaveuses modernes réduisent la consommation d'eau. Le programme vert est un système complet, pas seulement une liste de produits."]},{"title":"Les attentes LEED des immeubles","content":["Les immeubles certifiés LEED (volet exploitation et entretien) exigent de leurs fournisseurs de nettoyage des pratiques documentées : pourcentage de produits certifiés, équipement conforme, formation du personnel et registres à l'appui. Pour une entreprise de nettoyage, savoir répondre à ces exigences ouvre l'accès aux immeubles de catégorie A."]},{"title":"Vendre le vert au client","content":["L'argumentaire vert efficace parle le langage du client : moins de plaintes d'odeurs et d'irritations des occupants, meilleure image corporative, contribution à ses propres objectifs environnementaux, et coûts maîtrisés grâce aux concentrés. Un programme vert documenté différencie l'entreprise dans les appels d'offres."]}],"activity":{"label":"Atelier","title":"Mini-audit vert","steps":["À partir d'une liste de produits et d'équipements d'une entreprise fictive, les participants identifient ce qui est certifié, ce qui relève de l'écoblanchiment et ce qui devrait être remplacé.","Chaque équipe propose un plan de transition vert en trois étapes avec ses arguments client.","Mise en commun et rétroaction du formateur."]},"quiz":[["Quel est un bénéfice direct du nettoyage écologique pour les occupants ?",["Plus de parfum","Une meilleure qualité de l'air intérieur","Des planchers plus brillants","Aucun"],1],["Que garantissent EcoLogo et Green Seal ?",["Un prix plus bas","Une certification indépendante d'impact et de performance","Une odeur agréable","Rien"],1],["Qu'est-ce que l'écoblanchiment (greenwashing) ?",["Un lavage à l'eau froide","Des prétentions vertes sans vérification indépendante","Une certification officielle","Un type de savon"],1],["Quel équipement protège la qualité de l'air intérieur ?",["Un balai","Un aspirateur à filtration HEPA","Un séchoir","Un ventilateur"],1],["Pourquoi les concentrés sont-ils plus écologiques ?",["Ils sentent plus fort","Moins d'emballages et de gaspillage","Ils sont plus colorés","Aucune raison"],1],["Qu'exigent les immeubles LEED de leurs fournisseurs de nettoyage ?",["Rien","Des pratiques vertes documentées","Un logo vert sur le chariot","Des prix plus bas"],1],["Quel argument vert parle le plus au client ?",["La couleur des produits","Moins de plaintes d'occupants et meilleure image","La mode","Aucun argument"],1],["Un programme vert crédible repose sur :",["Une simple liste de produits","Un système complet documenté (produits, équipement, formation, registres)","Un slogan","Le hasard"],1]]},{"num":6,"title":"Gestion du temps et productivité","duree":"2 heures","objectifs":["Utiliser les standards de temps de l'industrie","Structurer une séquence de travail efficace","Mesurer et améliorer sa productivité"],"chapters":[{"title":"Les standards de temps","content":["L'industrie dispose de standards de temps par tâche et par superficie (notamment les référentiels ISSA) : par exemple, l'entretien courant d'un bureau standard se mesure en minutes par 1 000 pi². Ces standards servent à planifier les routes de travail, à établir les prix et à évaluer équitablement la charge de chaque employé."]},{"title":"Les cadences par type de local","content":["Chaque type de local a sa cadence : un corridor dégagé se nettoie vite, une salle de bain demande un temps fixe incompressible, un bureau encombré ralentit tout. Connaître ses cadences réelles — en les chronométrant — permet de bâtir des routes réalistes et de repérer les locaux qui consomment un temps anormal."]},{"title":"La séquence de travail optimale","content":["La productivité vient de la méthode : préparer tout le matériel avant de commencer, suivre le même circuit logique dans chaque pièce (une seule fois le tour, du haut vers le bas, du fond vers la sortie), regrouper les tâches par type, et éviter les allers-retours au local d'entretien — chaque déplacement inutile est du temps perdu multiplié par des centaines de fois par année."]},{"title":"Le chariot bien préparé","content":["Un chariot complet et organisé est le meilleur outil de productivité : produits pré-dilués en quantité suffisante, chiffons propres en réserve selon le code couleur, sacs, consommables de remplacement (papier, savon) et outils — tout vérifié en début de quart à l'aide d'une liste standard."]},{"title":"Mesurer et s'améliorer","content":["Ce qui se mesure s'améliore : temps réel par zone comparé au standard, nombre de plaintes et de reprises, consommation de produits. L'objectif n'est pas la vitesse à tout prix — un travail bâclé se paie en reprises et en plaintes — mais la constance : la bonne qualité, dans le temps prévu, chaque fois."]}],"activity":{"label":"Exercice","title":"Chronométrage et analyse d'une routine","steps":["Chaque participant exécute une routine de nettoyage standard (bureau type) pendant qu'un pair chronomètre chaque étape.","Comparaison avec les standards fournis et identification des pertes de temps (déplacements, matériel manquant, séquence).","Deuxième passage avec la séquence optimisée : mesure de l'amélioration."]},"quiz":[["À quoi servent les standards de temps de l'industrie ?",["À rien","À planifier les routes, établir les prix et équilibrer les charges","À punir les employés","À remplacer la formation"],1],["Comment connaît-on ses cadences réelles ?",["En devinant","En chronométrant ses tâches","En copiant un concurrent","C'est impossible"],1],["Quelle est la séquence optimale dans une pièce ?",["Plusieurs tours rapides","Un seul tour logique, du haut vers le bas, vers la sortie","Commencer par le plancher","Au hasard"],1],["Pourquoi évite-t-on les allers-retours au local d'entretien ?",["Le local est loin","Chaque déplacement inutile est du temps perdu répété","Le local est fermé","Aucune raison"],1],["Quel est le meilleur outil de productivité au quotidien ?",["Un chariot complet et organisé","Un téléphone","Un deuxième seau","La course"],0],["Que vérifie-t-on en début de quart ?",["Rien","Le chariot avec une liste standard","Les courriels","La météo"],1],["Quel est le vrai objectif de la mesure de productivité ?",["La vitesse à tout prix","La constance : bonne qualité dans le temps prévu","Faire mieux que les collègues","Réduire les pauses"],1],["Un travail bâclé se paie en :",["Prime","Reprises et plaintes","Vacances","Rien"],1]]},{"num":7,"title":"Introduction à la supervision","duree":"4 heures","objectifs":["Comprendre le rôle et les responsabilités du superviseur","Planifier le travail d'une équipe et former les nouveaux","Mener des inspections et donner une rétroaction constructive"],"chapters":[{"title":"Le rôle du superviseur","content":["Le superviseur est le pont entre l'équipe, l'entreprise et le client : il organise le travail, s'assure de la qualité, forme et soutient son équipe, gère les imprévus et représente l'entreprise au quotidien. Le passage de nettoyeur à superviseur est un changement de métier — on est désormais évalué sur les résultats de l'équipe, pas seulement sur les siens."]},{"title":"Planifier horaires et routes de travail","content":["La planification traduit le contrat en action : découper l'édifice en routes équilibrées à l'aide des standards de temps, bâtir les horaires en respectant les disponibilités et les règles de travail, prévoir les remplacements (vacances, maladies) et ajuster les routes quand le contrat change. Une route déséquilibrée démotive les uns et épuise les autres."]},{"title":"Accueillir et former un nouvel employé","content":["Les premiers jours déterminent la rétention : accueil structuré, présentation du site et des règles de sécurité, jumelage avec un employé expérimenté, formation par démonstration (montrer, faire faire, corriger, refaire) et suivi rapproché la première semaine. Un employé bien intégré reste ; un employé lancé seul sans soutien démissionne."]},{"title":"L'inspection formelle","content":["L'inspection du superviseur va plus loin que l'auto-vérification du Programme 1 : grille standardisée par type de local, cotation objective (conforme / à corriger / non conforme), photos à l'appui, tournée en présence de l'employé quand c'est possible, et suivi documenté des correctifs. L'inspection sert à améliorer, pas à piéger."]},{"title":"La rétroaction constructive","content":["Une rétroaction efficace est précise, rapide et respectueuse : décrire le fait observé (pas la personne), expliquer l'impact, écouter la version de l'employé, convenir d'une action et reconnaître les progrès ensuite. La reconnaissance sincère des bons coups est l'outil de motivation le plus puissant — et le plus économique — du superviseur."]},{"title":"La gestion des conflits","content":["Les conflits d'équipe non traités empoisonnent le climat et font fuir les bons employés : intervenir tôt, rencontrer les personnes séparément puis ensemble, se concentrer sur les faits et les comportements, chercher une entente concrète et faire un suivi. Les situations graves (harcèlement, violence, facultés affaiblies) doivent être remontées immédiatement selon la politique de l'entreprise."]},{"title":"La relation client au niveau superviseur","content":["Le superviseur devient l'interlocuteur du client : tournées conjointes planifiées, réponse rapide et documentée aux demandes et aux plaintes, gestion des demandes hors contrat (à consigner et transmettre plutôt qu'accepter sur-le-champ) et communication proactive — informer le client d'un problème avant qu'il le découvre bâtit une confiance durable."]}],"activity":{"label":"Jeux de rôle","title":"Inspection et rétroaction","steps":["Mise en situation 1 : mener une inspection formelle d'un local préparé avec des non-conformités volontaires, grille en main.","Mise en situation 2 : donner une rétroaction constructive à un « employé » (joué par un pair) sur les écarts constatés.","Mise en situation 3 : annoncer à un « client » un problème détecté avant qu'il ne s'en plaigne.","Rétroaction du formateur sur chaque exercice."]},"quiz":[["Sur quoi le superviseur est-il désormais évalué ?",["Ses résultats personnels seulement","Les résultats de son équipe","Sa vitesse de nettoyage","Son ancienneté"],1],["Que provoque une route de travail déséquilibrée ?",["Rien","Démotivation des uns, épuisement des autres","Plus de qualité","Des économies"],1],["Quelle est la méthode de formation recommandée ?",["Lancer l'employé seul","Montrer, faire faire, corriger, refaire","Donner un manuel sans suivi","Aucune méthode"],1],["Quel est le plus grand risque d'un accueil bâclé ?",["Aucun","La démission rapide du nouvel employé","Trop de questions","Un meilleur rendement"],1],["À quoi sert l'inspection formelle ?",["À piéger les employés","À améliorer la qualité de façon documentée","À remplir du papier","À rien"],1],["Une bonne rétroaction décrit :",["La personnalité de l'employé","Le fait observé et son impact","Des rumeurs","Des généralités"],1],["Quel est l'outil de motivation le plus puissant du superviseur ?",["Les menaces","La reconnaissance sincère des bons coups","Les primes seulement","Le silence"],1],["Face à un conflit d'équipe, il faut :",["Attendre qu'il passe","Intervenir tôt et se concentrer sur les faits","Prendre parti publiquement","Muter tout le monde"],1],["Quelles situations doivent être remontées immédiatement ?",["Les retards occasionnels","Harcèlement, violence, facultés affaiblies","Les pauses café","Aucune"],1],["Que fait-on d'une demande client hors contrat ?",["On l'accepte sur-le-champ","On la consigne et on la transmet","On l'ignore","On la refuse impoliment"],1],["Qu'est-ce que la communication proactive avec le client ?",["Attendre ses plaintes","L'informer d'un problème avant qu'il le découvre","L'appeler tous les jours sans raison","Ne rien dire"],1],["Lors d'une inspection, la présence de l'employé est :",["À éviter absolument","Souhaitable quand c'est possible","Interdite","Sans importance"],1]]},{"num":8,"title":"Estimation et soumissions","duree":"3 heures","objectifs":["Mener une visite d'évaluation professionnelle","Calculer un prix juste et rentable","Rédiger et présenter une soumission convaincante"],"chapters":[{"title":"La visite d'évaluation","content":["Tout prix sérieux commence par une visite : mesurer ou confirmer les superficies par type de local, noter les types de planchers et leur état, compter les sanitaires et les points d'eau, identifier les contraintes (horaires d'accès, sécurité, stationnement) et écouter les insatisfactions envers le fournisseur actuel — elles révèlent ce qui compte vraiment pour ce client."]},{"title":"Le calcul des coûts","content":["Le coût d'un contrat se construit de bas en haut : heures requises selon les standards de temps et les fréquences demandées, multipliées par le coût réel de la main-d'œuvre (salaire + charges sociales + avantages), plus les produits et consommables, l'équipement amorti, la supervision et les frais généraux de l'entreprise. Oublier un poste de coût, c'est travailler à perte en le découvrant trop tard."]},{"title":"Le prix au pied carré","content":["Le marché s'exprime souvent en prix au pied carré par mois : ce repère permet de comparer et de valider son calcul détaillé, mais ne le remplace jamais — deux immeubles de même superficie peuvent exiger des efforts très différents selon la densité d'occupation, les fréquences et les exigences. On calcule d'abord, on compare ensuite."]},{"title":"La marge et la rentabilité","content":["La marge n'est pas un luxe : elle finance les imprévus, les remplacements, l'équipement et la croissance. Une soumission gagnée à prix perdant est une double défaite — on travaille et on s'appauvrit. Il faut connaître son seuil plancher et savoir se retirer d'un appel d'offres dont le prix attendu est insoutenable."]},{"title":"Rédiger la soumission","content":["Une soumission professionnelle contient : la présentation de l'entreprise, la description précise des services et fréquences par type de local, les exclusions et les travaux à la demande avec leurs taux, le prix et les modalités, les preuves de sérieux (assurances, références, certifications) et les conditions (durée, indexation, résiliation). La clarté prévient les litiges — tout ce qui est flou se retournera contre le fournisseur."]},{"title":"Présenter et défendre son prix","content":["Présenter sa soumission en personne quand c'est possible change tout : on explique la valeur derrière le prix (fiabilité, supervision, qualité documentée), on répond aux objections avec les faits de la visite, et face au « concurrent moins cher », on fait préciser ce que son prix inclut réellement. Baisser son prix sans retirer du service détruit sa crédibilité et sa marge."]}],"activity":{"label":"Simulation","title":"Soumission complète de A à Z","steps":["Cas fourni : plan et données d'un immeuble de bureaux avec exigences du client (fréquences, horaires, attentes).","En équipes : réaliser l'estimation complète (heures, coûts, marge) et rédiger la soumission d'une page.","Chaque équipe présente et défend son prix devant le « client » joué par le formateur, qui négocie.","Comparaison des prix obtenus entre les équipes et retour sur les écarts."]},"quiz":[["Par quoi commence toute soumission sérieuse ?",["Un prix au hasard","Une visite d'évaluation","Une copie du concurrent","Un rabais"],1],["Que révèlent les insatisfactions du client envers son fournisseur actuel ?",["Rien","Ce qui compte vraiment pour lui","Son budget exact","Sa naïveté"],1],["Le coût réel de la main-d'œuvre comprend :",["Le salaire seulement","Salaire + charges sociales + avantages","Le salaire moins les taxes","Un montant fixe universel"],1],["Quel est le risque d'oublier un poste de coût ?",["Aucun","Travailler à perte","Un meilleur prix","Plus de clients"],1],["Le prix au pied carré sert à :",["Remplacer le calcul détaillé","Comparer et valider son calcul","Fixer le salaire","Rien"],1],["Pourquoi la marge est-elle essentielle ?",["Pour le luxe","Elle finance imprévus, équipement et croissance","Elle est illégale","Elle fait fuir les clients"],1],["Qu'est-ce qu'une soumission gagnée à prix perdant ?",["Une victoire","Une double défaite : on travaille et on s'appauvrit","Une bonne stratégie","Un investissement sûr"],1],["Que doit préciser une soumission professionnelle ?",["Le prix seulement","Services, fréquences, exclusions, prix et conditions","Des généralités","Le minimum possible"],1],["Face à un « concurrent moins cher », on doit :",["Baisser son prix immédiatement","Faire préciser ce que ce prix inclut réellement","Abandonner","Insulter le concurrent"],1],["Que détruit une baisse de prix sans retrait de service ?",["Rien","Sa crédibilité et sa marge","La concurrence","Le contrat"],1]]}]},{"id":"cleaning-p2-en","lang":"en","badge":"ESSOR Cleaning Academy™ · English · Level 2","title":"Program 2 — Advanced Techniques and Specialization","desc":"Level 2 to go further: hard floors, carpets, advanced disinfection, post-construction cleaning, productivity, supervision and bidding. Prerequisite: Program 1 certificate.","duration":"24 hours","level":"Intermediate","modules":[{"num":1,"title":"Advanced Hard Floor Care","duree":"4 hours","objectifs":["Identify hard floor types and their finishes","Master complete stripping and finish application","Perform safe high-speed burnishing","Plan a floor's periodic maintenance program"],"chapters":[{"title":"Floor Types and Finishes","content":[["Resilient floors","Vinyl (VCT, LVT), linoleum and rubber are the most common commercial floors. VCT requires a protective finish (wax) renewed periodically, while modern LVT generally does not — applying a finish to LVT can even void the manufacturer's warranty."],["Mineral floors","Ceramic, terrazzo, polished concrete and natural stone (marble, granite) each have their own requirements: marble tolerates no acidic product, polished concrete is cleaned with an auto-scrubber and a neutral product, and ceramic grout requires specific care."],["Recognizing the existing finish","Before any intervention, the finish in place must be identified: a discreet test in a corner (a drop of stripper or light scraping) reveals the type and thickness of the accumulated layers, which determines the method and products to use."]]},{"title":"Stripping: Preparation","content":["Stripping removes all accumulated layers of finish to start fresh. Preparation is half the success: completely clear the area, dust-mop, protect baseboards and thresholds, post signage, prepare the stripping solution according to the manufacturer's dilution and plan for ventilation. Always plan the work in sections to keep a dry exit path."]},{"title":"Stripping: Execution","content":["The stripping solution is applied generously with a mop and must dwell for the recommended time (generally 5 to 10 minutes) without ever drying on the floor. It is then agitated with a low-speed floor machine fitted with a black pad or stripping brush, the soiled solution is recovered with a wet vacuum, and the floor is rinsed at least twice with clean water — insufficient rinsing is the leading cause of failure of the finish that follows."]},{"title":"Applying the Finish","content":["Finish is applied only to a perfectly clean, rinsed and dry floor, with a clean finish mop (or dedicated applicator), in thin, uniform coats. Respect the drying time between each coat (30 to 60 minutes depending on humidity) and generally apply 3 to 5 coats. The first coats can stop a few centimetres from the baseboards; the final coats cover the entire surface."]},{"title":"High-Speed Burnishing","content":["High-speed burnishing (1500 to 3000 RPM) restores gloss between two strippings by re-closing the surface of the finish. It requires a dust-mopped floor, an appropriate pad (often beige or champagne), regular overlapping passes, and constant attention to the power cord and nearby people. An integrated vacuum or dust-mopping after burnishing removes the fine residue produced."]},{"title":"Restoration and Periodic Maintenance","content":["Between simple daily cleaning and complete stripping lies a range of interventions: deep scrubbing (scrub and recoat) removes the worn surface layer and adds one or two coats of finish without stripping everything. A good maintenance schedule — daily, weekly, monthly, yearly — extends the life of the finish, reduces costs and maintains appearance at all times."]},{"title":"Floor Work Safety","content":["Floor work combines several major risks: an extremely slippery floor during stripping, highly alkaline products (strippers) requiring gloves and goggles, heavy corded equipment, and occupant traffic. The area must be completely closed to traffic, signage posted at every entrance, and non-slip footwear (ideally with spiked stripping overshoes) is mandatory."]}],"activity":{"label":"Lab","title":"Stripping and Refinishing a Floor Section","steps":["In teams, participants prepare the area: clearing, signage, baseboard protection and solution preparation.","Complete stripping of a VCT section: application, dwell time, mechanical agitation, recovery and double rinsing.","Application of three coats of finish respecting drying times, followed by cross-inspection between teams.","The trainer evaluates each team's technique, safety and final result."]},"quiz":[["Which modern floor type generally does NOT require a protective finish?",["VCT","LVT","Terrazzo","Linoleum"],1],["Which product must NEVER be used on marble?",["A neutral product","An acidic product","Warm water","A mild cleaner"],1],["What must be done before choosing the stripping method?",["Nothing in particular","Identify the existing finish with a discreet test","Apply the finish directly","Burnish the floor"],1],["During dwell time, the stripping solution must never:",["Stay wet","Dry on the floor","Be agitated","Be recovered"],1],["What is the leading cause of failure of a new finish?",["Too many coats","Insufficient rinsing after stripping","Too soft a pad","A new mop"],1],["How many coats of finish are generally applied?",["1","2","3 to 5","10"],2],["Finish is applied in coats that are:",["Thick and fast","Thin and uniform","Criss-crossed without drying","A single thick coat"],1],["At what speed does a high-speed burnisher run?",["100 to 300 RPM","500 to 800 RPM","1500 to 3000 RPM","10,000 RPM"],2],["What does \"scrub and recoat\" make possible?",["Stripping the floor entirely","Refreshing the finish without complete stripping","Replacing the floor","Eliminating burnishing forever"],1],["Why is stripping done in sections?",["To go faster","To keep a dry, safe exit path","To save product","No reason"],1],["Which pad is generally used for stripping?",["White","Beige","Black","Pink"],2],["Which equipment recovers the soiled stripping solution?",["The dry mop","The wet vacuum","The broom","The microfibre cloth"],1],["Before applying finish, the floor must be:",["Slightly damp","Clean, rinsed and perfectly dry","Still covered with stripper","Warm"],1],["Which PPE is specifically recommended during stripping?",["Sandals","Spiked non-slip overshoes","Wool gloves","Headphones"],1],["What is the goal of a periodic maintenance schedule?",["Complicating the work","Extending the finish's life and reducing costs","Avoiding daily cleaning","Stripping more often"],1]]},{"num":2,"title":"Specialized Carpet and Fabric Care","duree":"3 hours","objectifs":["Identify fibres and adapt the cleaning method","Master hot water extraction and spot removal","Prevent mould and extend carpet life"],"chapters":[{"title":"Fibres and Their Behaviour","content":["Nylon dominates commercial carpets for its resilience; olefin resists moisture well but attracts grease; wool, luxurious, tolerates neither high heat nor strong alkaline products. Identifying the fibre (label, burn test performed by a specialist, or client documentation) determines the admissible temperature, products and method."]},{"title":"Hot Water Extraction","content":["Hot water extraction is the reference deep-cleaning method: thorough pre-vacuuming, application of a pre-treatment on traffic lanes, dwell time, then slow extraction passes that inject the solution and recover it immediately. Finish with dry recovery passes to remove as much moisture as possible."]},{"title":"Spot Removal","content":["The golden rule of spot removal: act fast, blot without rubbing, work from the edge of the stain toward the centre, and test the product in a discreet spot. Each stain family has its treatment — protein stains (blood, food) with cold water and an enzymatic spotter, greasy stains with the appropriate solvent, tannins (coffee, wine) with a mild acidic spotter. Rubbing a stain spreads it and damages the fibre."]},{"title":"Low-Moisture Methods","content":["Encapsulation cleaning (a crystallizing product applied with a mechanical brush then vacuumed) and bonnet cleaning allow fast interim maintenance with drying in under an hour — ideal for spaces that cannot close for long. These methods complement extraction without replacing it."]},{"title":"Preventive Maintenance","content":["80% of a carpet's soil enters through the first 3 metres: well-sized and well-maintained entrance mats, daily vacuuming of traffic lanes and a planned maintenance program (monthly encapsulation, semi-annual extraction) extend the carpet's life by several years and reduce total costs."]},{"title":"Drying and Mould Prevention","content":["A carpet that stays wet for more than 24 to 48 hours becomes a breeding ground for mould and odours. After any extraction: maximize ventilation, use drying fans, avoid replacing furniture before complete drying and protect furniture legs with blocks. In the event of major water damage, rapid extraction and dehumidification are urgent."]}],"activity":{"label":"Lab","title":"Spot Removal Clinic","steps":["The trainer prepares carpet samples with typical stains: coffee, ink, grease, sugary drink.","Each participant identifies the stain, chooses the appropriate spotter and applies the technique (blot, work toward the centre, rinse).","Comparison of results and discussion: which stains require a specialist?"]},"quiz":[["Which fibre dominates commercial carpets?",["Wool","Nylon","Cotton","Silk"],1],["Which fibre does not tolerate strong alkaline products?",["Nylon","Olefin","Wool","Polyester"],2],["What is the first step of hot water extraction?",["Applying finish","Thorough pre-vacuuming","Burnishing","Drying"],1],["When treating a stain, you always work…",["From the centre to the edge","From the edge to the centre","By rubbing hard","With very hot water"],1],["Why must you never rub a stain?",["It takes too long","It spreads the stain and damages the fibre","It wears out the cloth","No reason"],1],["Which type of spotter suits protein stains (blood, food)?",["Dry solvent","Cold water and an enzymatic spotter","Boiling water","Floor stripper"],1],["What is the main advantage of encapsulation?",["Deeper cleaning than extraction","Drying in under an hour","No equipment required","A lasting fragrance"],1],["Where does about 80% of a carpet's soil enter?",["The windows","The first 3 metres (entrances)","The ventilation","The ceiling"],1],["Beyond how long does a wet carpet risk mould?",["2 hours","24 to 48 hours","1 week","Never"],1],["What is done immediately after extraction to speed up drying?",["Close all doors","Maximize ventilation and use fans","Replace the furniture","Wet the carpet"],1]]},{"num":3,"title":"Advanced Disinfection and Infection Control","duree":"3 hours","objectifs":["Understand the chain of infection transmission","Apply healthcare-level disinfection protocols","Respond effectively during an outbreak"],"chapters":[{"title":"The Chain of Transmission","content":["An infection spreads when the chain is complete: a pathogen, a reservoir (surface, person), an exit door, a mode of transmission (hands, droplets, surfaces), an entry door and a susceptible host. Cleaning and disinfection break this chain at the surface link — that is the direct role of the hygiene professional."]},{"title":"Clean Before Disinfecting","content":["A disinfectant applied to a dirty surface is largely ineffective: organic matter neutralizes it. The professional rule is always two steps — clean first (remove the soil), disinfect second (eliminate micro-organisms) — except with certain approved one-step \"cleaner-disinfectants\", used according to their label."]},{"title":"Levels of Disinfection","content":["We distinguish sanitizing (reducing microbe counts, e.g. food surfaces), low-level disinfection (common bacteria, some viruses) and high-level disinfection reserved for medical equipment. Product choice is based on its registration number (DIN in Canada), the targeted micro-organism and the contact time indicated on the label."]},{"title":"Healthcare Protocols","content":["In clinics, residences or hospital settings, work follows strict protocols: cleaning order from cleanest to most contaminated, changing cloths and gloves between rooms, products approved against the targeted pathogens, scrupulous respect of contact times, and immediate reporting of any abnormal situation to the infection prevention lead."]},{"title":"Touch Points and High-Risk Zones","content":["High-frequency touch points — handles, switches, railings, elevator buttons, faucets, shared keyboards — accumulate and transmit microbes far more than floors. An effective disinfection program targets them at high frequency (several times a day in high-risk zones) with a precise checklist per room."]},{"title":"Outbreak: Enhanced Protocol","content":["During an outbreak (gastroenteritis, influenza, COVID or other), the protocol intensifies: a product approved against the pathogen in question, doubled frequencies on touch points, enhanced PPE (gloves, mask, sometimes gown), strict management of contaminated waste and cloths, and close coordination with the client and public health where applicable."]},{"title":"Documentation and Logs","content":["In healthcare-level disinfection, what is not documented does not exist: signed and time-stamped service logs, product dilution sheets, zone checklists and incident reports constitute proof of the work performed — a growing requirement of institutional clients and a major commercial argument."]}],"activity":{"label":"Simulation","title":"Managing a Gastroenteritis Outbreak","steps":["Scenario: an outbreak is declared in a seniors' residence; the team must adapt its protocol in 30 minutes.","In small groups: choose the appropriate product, redefine frequencies, list the required PPE and write the touch-point checklist.","Plans are presented to the group with trainer feedback on critical omissions."]},"quiz":[["What does cleaning-disinfection break in the chain of transmission?",["The entry door","The surface link (reservoir/transmission)","The susceptible host","Nothing"],1],["Why must you clean BEFORE disinfecting?",["For the smell","Organic matter neutralizes the disinfectant","To save water","It is not necessary"],1],["What does the DIN number on a disinfectant mean in Canada?",["The suggested price","The product's official registration","The expiry date","The hazard level"],1],["In what order do you clean in a healthcare setting?",["From most contaminated to cleanest","From cleanest to most contaminated","Randomly","By surface area"],1],["What is done with cloths between two rooms in a healthcare setting?",["Reuse them as is","Change them","Rinse them in cold water only","Dry them"],1],["Which accumulate the most microbes?",["Ceilings","High-frequency touch points","Floors","Windows"],1],["Give an example of a touch point:",["A door handle","A wall","A ceiling","A fixed window"],0],["During an outbreak, touch-point disinfection frequencies are:",["Reduced","Unchanged","Increased (often doubled)","Eliminated"],2],["Which item is often added to PPE during an outbreak?",["Sandals","A mask (and sometimes a gown)","A hard hat","Nothing"],1],["What are signed service logs for?",["Decorating walls","Proving the work performed","Replacing cleaning","Nothing"],1],["A disinfectant's contact time is indicated:",["On the product label","Nowhere","By the client","On the invoice"],0],["High-level disinfection is reserved for:",["Floors","Medical equipment","Windows","Carpets"],1]]},{"num":4,"title":"Post-Construction Cleaning and Restorations","duree":"3 hours","objectifs":["Plan the three phases of a construction clean","Handle fine dust and construction residue","Work safely in a construction site environment"],"chapters":[{"title":"The Three Phases of Construction Cleaning","content":[["Phase 1 — Rough clean","During or just after the work: debris removal, industrial sweeping, removing stickers from windows and removing protections. The goal is to make the site walkable."],["Phase 2 — Final clean","The heart of the assignment: complete dusting of all surfaces (including exposed ducts, light fixtures, shelves), window washing, cleaning of new bathrooms and kitchens, floors brought to finish."],["Phase 3 — Touch-up clean","After the last trades have passed and before delivery to the client: re-doing marks, final dusting and complete inspection with the delivery checklist."]]},{"title":"Fine Dust","content":["Drywall and concrete dust infiltrates everywhere and resettles for days: vacuum with HEPA filters rather than sweeping, damp-wipe surfaces rinsing often, work from top to bottom, and plan several passes. Dry-sweeping fine dust simply puts it back in suspension."]},{"title":"Residue, Adhesives and Site Stains","content":["Window stickers, tape residue, splashes of paint, compound or concrete require targeted techniques: a blade scraper on glass (wet, at a low angle), appropriate solvents tested discreetly, and patience — forcing dry residue scratches the new surface, the worst possible error on a finishing site."]},{"title":"Glass and New Surfaces","content":["New surfaces are paradoxically the most fragile: new glass easily scratched by debris caught in the cloth, stainless steel that marks, faucets that scratch. Rinse abundantly before wiping, change cloths very often and prohibit any abrasive pad on finished surfaces."]},{"title":"Construction Site Safety","content":["The site imposes its rules: hard hat, safety boots and vest where required, respect of the traffic plan, attention to other trades working at height, verification that electricity and water are functional and safe, and systematic coordination with the site superintendent before entering a zone."]},{"title":"Coordinating with the Contractor","content":["Construction cleaning is one link in a tight schedule: confirm the dates and zones that are ready, document the condition on arrival (photos), immediately report any damage observed before starting, and have the delivery checklist signed — this protects the cleaning company and builds its reputation with general contractors."]}],"activity":{"label":"Case Study","title":"Planning an End-of-Construction Clean","steps":["Case provided: an 8,000 sq. ft. office floor to be delivered in 5 days, with site plan and photos.","In teams: establish the 3-phase sequence, the equipment list (including HEPA filters), the required staffing and the safety watch points.","Each team presents its plan; the trainer compares it with a real industry plan."]},"quiz":[["How many phases does a complete construction clean have?",["One","Two","Three","Five"],2],["What is the goal of phase 1 (rough clean)?",["Final delivery","Making the site walkable","Floor burnishing","Inspection"],1],["Why vacuum fine dust with a HEPA filter instead of sweeping?",["It is faster","Sweeping puts the dust back in suspension","It is cheaper","No reason"],1],["How do you remove a sticker from new glass?",["Dry abrasive pad","Blade scraper on a wet surface, at a low angle","Floor stripper","Wire brush"],1],["What is the worst error on new finished surfaces?",["Rinsing too much","Scratching them by forcing dry residue","Changing cloths","Working slowly"],1],["Why are cloths changed very often on a site?",["Out of habit","Debris caught in the cloth scratches new surfaces","For the colour","No reason"],1],["What additional PPE can a construction site require?",["Hard hat, safety boots, vest","Sandals and a cap","None","Kitchen gloves"],0],["What do you do before starting in a site zone?",["Enter without notice","Coordinate with the superintendent","Wait for the end client","Start with the windows"],1],["Why document the site's condition on arrival (photos)?",["For social media","To protect yourself against pre-existing damage","It is not useful","For decoration"],1],["Which document closes phase 3 before delivery?",["A verbal invoice","The signed delivery checklist","A text message","No document"],1]]},{"num":5,"title":"Green Cleaning and Environmental Certifications","duree":"2 hours","objectifs":["Understand the principles of green cleaning","Know the recognized certifications and their requirements","Present the value of green cleaning to a client"],"chapters":[{"title":"Why Green Cleaning","content":["Green cleaning reduces occupants' and workers' exposure to irritating substances, improves indoor air quality, reduces environmental impact (water, packaging, discharges) and responds to growing client demand — it has moved from a marketing argument to a contractual requirement in many buildings."]},{"title":"Product Certifications","content":["EcoLogo (UL 2792) and Green Seal certify that a product meets strict environmental impact and performance criteria. On the label, look for the official third-party certification logo — to be distinguished from vague claims (\"natural\", \"green\") without independent verification, a practice called greenwashing."]},{"title":"Green Products and Equipment","content":["Beyond certified products: controlled-dilution concentrates reduce packaging and waste, quality microfibre cleans with less product and water, HEPA-filtration vacuums protect indoor air, and modern auto-scrubbers reduce water consumption. A green program is a complete system, not just a product list."]},{"title":"LEED Building Expectations","content":["LEED-certified buildings (operations and maintenance stream) require documented practices from their cleaning suppliers: percentage of certified products, compliant equipment, staff training and supporting records. For a cleaning company, knowing how to meet these requirements opens access to Class A buildings."]},{"title":"Selling Green to the Client","content":["An effective green pitch speaks the client's language: fewer occupant complaints about odours and irritation, better corporate image, contribution to their own environmental goals, and controlled costs thanks to concentrates. A documented green program differentiates the company in tenders."]}],"activity":{"label":"Workshop","title":"Mini Green Audit","steps":["From a fictional company's list of products and equipment, participants identify what is certified, what is greenwashing and what should be replaced.","Each team proposes a three-step green transition plan with its client arguments.","Group sharing and trainer feedback."]},"quiz":[["What is a direct benefit of green cleaning for occupants?",["More fragrance","Better indoor air quality","Shinier floors","None"],1],["What do EcoLogo and Green Seal guarantee?",["A lower price","Independent certification of impact and performance","A pleasant smell","Nothing"],1],["What is greenwashing?",["Washing with cold water","Green claims without independent verification","An official certification","A type of soap"],1],["Which equipment protects indoor air quality?",["A broom","A HEPA-filtration vacuum","A dryer","A fan"],1],["Why are concentrates more environmentally friendly?",["They smell stronger","Less packaging and waste","They are more colourful","No reason"],1],["What do LEED buildings require from their cleaning suppliers?",["Nothing","Documented green practices","A green logo on the cart","Lower prices"],1],["Which green argument speaks most to the client?",["Product colours","Fewer occupant complaints and a better image","Fashion","No argument"],1],["A credible green program is based on:",["A simple product list","A complete documented system
