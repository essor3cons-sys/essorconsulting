(products, equipment, training, records)","A slogan","Chance"],1]]},{"num":6,"title":"Time Management and Productivity","duree":"2 hours","objectifs":["Use industry time standards","Structure an efficient work sequence","Measure and improve your productivity"],"chapters":[{"title":"Time Standards","content":["The industry has time standards per task and per surface area (notably the ISSA references): for example, routine maintenance of a standard office is measured in minutes per 1,000 sq. ft. These standards are used to plan work routes, set prices and fairly assess each employee's workload."]},{"title":"Rates by Type of Space","content":["Each type of space has its pace: a clear corridor cleans quickly, a washroom requires a fixed, incompressible time, a cluttered office slows everything down. Knowing your real rates — by timing them — allows you to build realistic routes and spot spaces consuming abnormal time."]},{"title":"The Optimal Work Sequence","content":["Productivity comes from method: prepare all materials before starting, follow the same logical circuit in each room (around once, top to bottom, from the back toward the exit), group tasks by type, and avoid trips back to the janitor closet — every unnecessary trip is wasted time multiplied hundreds of times per year."]},{"title":"The Well-Prepared Cart","content":["A complete, organized cart is the best productivity tool: pre-diluted products in sufficient quantity, clean cloths in reserve according to the colour code, bags, replacement consumables (paper, soap) and tools — everything checked at the start of the shift with a standard list."]},{"title":"Measure and Improve","content":["What gets measured gets improved: actual time per zone compared to the standard, number of complaints and re-dos, product consumption. The goal is not speed at all costs — sloppy work is paid for in re-dos and complaints — but consistency: good quality, within the planned time, every time."]}],"activity":{"label":"Exercise","title":"Timing and Analyzing a Routine","steps":["Each participant performs a standard cleaning routine (typical office) while a peer times each step.","Comparison with the provided standards and identification of time losses (trips, missing materials, sequence).","Second run with the optimized sequence: measuring the improvement."]},"quiz":[["What are industry time standards for?",["Nothing","Planning routes, setting prices and balancing workloads","Punishing employees","Replacing training"],1],["How do you learn your real rates?",["By guessing","By timing your tasks","By copying a competitor","It is impossible"],1],["What is the optimal sequence in a room?",["Several quick laps","One logical lap, top to bottom, toward the exit","Starting with the floor","Random"],1],["Why avoid trips back to the janitor closet?",["The closet is far","Every unnecessary trip is wasted time, repeated","The closet is locked","No reason"],1],["What is the best daily productivity tool?",["A complete, organized cart","A phone","A second bucket","Running"],0],["What is checked at the start of the shift?",["Nothing","The cart, with a standard list","Emails","The weather"],1],["What is the true goal of productivity measurement?",["Speed at all costs","Consistency: good quality within the planned time","Beating colleagues","Reducing breaks"],1],["Sloppy work is paid for in:",["Bonuses","Re-dos and complaints","Vacation","Nothing"],1]]},{"num":7,"title":"Introduction to Supervision","duree":"4 hours","objectifs":["Understand the supervisor's role and responsibilities","Plan a team's work and train new employees","Conduct inspections and give constructive feedback"],"chapters":[{"title":"The Supervisor's Role","content":["The supervisor is the bridge between the team, the company and the client: they organize the work, ensure quality, train and support their team, manage the unexpected and represent the company daily. Moving from cleaner to supervisor is a change of trade — you are now evaluated on the team's results, not just your own."]},{"title":"Planning Schedules and Work Routes","content":["Planning translates the contract into action: divide the building into balanced routes using time standards, build schedules respecting availabilities and labour rules, plan for replacements (vacations, illness) and adjust routes when the contract changes. An unbalanced route demotivates some and exhausts others."]},{"title":"Onboarding and Training a New Employee","content":["The first days determine retention: a structured welcome, presentation of the site and safety rules, pairing with an experienced employee, training by demonstration (show, have them do it, correct, repeat) and close follow-up during the first week. A well-integrated employee stays; an employee left alone without support resigns."]},{"title":"The Formal Inspection","content":["The supervisor's inspection goes further than Program 1's self-check: a standardized grid by type of space, objective scoring (compliant / to correct / non-compliant), supporting photos, a walk-through with the employee present when possible, and documented follow-up of corrections. Inspection is for improving, not for trapping."]},{"title":"Constructive Feedback","content":["Effective feedback is precise, prompt and respectful: describe the observed fact (not the person), explain the impact, listen to the employee's version, agree on an action and recognize progress afterward. Sincere recognition of good work is the supervisor's most powerful — and most economical — motivational tool."]},{"title":"Managing Conflicts","content":["Untreated team conflicts poison the climate and drive good employees away: intervene early, meet the people separately then together, focus on facts and behaviours, seek a concrete agreement and follow up. Serious situations (harassment, violence, impairment) must be escalated immediately according to company policy."]},{"title":"The Client Relationship at Supervisor Level","content":["The supervisor becomes the client's contact: planned joint walk-throughs, fast and documented responses to requests and complaints, management of out-of-contract requests (to record and pass on rather than accept on the spot) and proactive communication — informing the client of a problem before they discover it builds lasting trust."]}],"activity":{"label":"Role Play","title":"Inspection and Feedback","steps":["Scenario 1: conduct a formal inspection of a room prepared with deliberate non-conformities, grid in hand.","Scenario 2: give constructive feedback to an \"employee\" (played by a peer) on the observed gaps.","Scenario 3: inform a \"client\" of a detected problem before they complain about it.","Trainer feedback on each exercise."]},"quiz":[["What is the supervisor now evaluated on?",["Their personal results only","The team's results","Their cleaning speed","Their seniority"],1],["What does an unbalanced work route cause?",["Nothing","Demotivation for some, exhaustion for others","More quality","Savings"],1],["What is the recommended training method?",["Leaving the employee alone","Show, have them do it, correct, repeat","Handing over a manual without follow-up","No method"],1],["What is the biggest risk of a botched onboarding?",["None","The new employee's quick resignation","Too many questions","Better performance"],1],["What is the formal inspection for?",["Trapping employees","Improving quality in a documented way","Filling out paper","Nothing"],1],["Good feedback describes:",["The employee's personality","The observed fact and its impact","Rumours","Generalities"],1],["What is the supervisor's most powerful motivational tool?",["Threats","Sincere recognition of good work","Bonuses only","Silence"],1],["Faced with a team conflict, you must:",["Wait for it to pass","Intervene early and focus on the facts","Take sides publicly","Transfer everyone"],1],["Which situations must be escalated immediately?",["Occasional lateness","Harassment, violence, impairment","Coffee breaks","None"],1],["What do you do with an out-of-contract client request?",["Accept it on the spot","Record it and pass it on","Ignore it","Refuse it rudely"],1],["What is proactive client communication?",["Waiting for complaints","Informing them of a problem before they discover it","Calling them daily for no reason","Saying nothing"],1],["During an inspection, the employee's presence is:",["To be absolutely avoided","Desirable when possible","Forbidden","Unimportant"],1]]},{"num":8,"title":"Estimating and Bidding","duree":"3 hours","objectifs":["Conduct a professional site assessment visit","Calculate a fair and profitable price","Write and present a convincing bid"],"chapters":[{"title":"The Assessment Visit","content":["Every serious price starts with a visit: measure or confirm surface areas by type of space, note floor types and their condition, count washrooms and water points, identify constraints (access hours, security, parking) and listen to dissatisfactions with the current supplier — they reveal what truly matters to this client."]},{"title":"Calculating Costs","content":["A contract's cost is built from the bottom up: hours required according to time standards and requested frequencies, multiplied by the real cost of labour (wages + payroll charges + benefits), plus products and consumables, amortized equipment, supervision and the company's overhead. Forgetting a cost item means working at a loss and discovering it too late."]},{"title":"Price per Square Foot","content":["The market often speaks in price per square foot per month: this benchmark allows you to compare and validate your detailed calculation, but never replaces it — two buildings of the same size can require very different effort depending on occupancy density, frequencies and requirements. Calculate first, compare second."]},{"title":"Margin and Profitability","content":["Margin is not a luxury: it funds the unexpected, replacements, equipment and growth. A bid won at a losing price is a double defeat — you work and you grow poorer. You must know your floor price and know how to walk away from a tender whose expected price is unsustainable."]},{"title":"Writing the Bid","content":["A professional bid contains: the company presentation, the precise description of services and frequencies by type of space, exclusions and on-demand work with their rates, the price and terms, proofs of seriousness (insurance, references, certifications) and conditions (duration, indexation, termination). Clarity prevents disputes — anything vague will turn against the supplier."]},{"title":"Presenting and Defending Your Price","content":["Presenting your bid in person when possible changes everything: you explain the value behind the price (reliability, supervision, documented quality), you answer objections with facts from the visit, and faced with the \"cheaper competitor\", you have them specify what that price actually includes. Lowering your price without removing service destroys your credibility and your margin."]}],"activity":{"label":"Simulation","title":"A Complete Bid from A to Z","steps":["Case provided: plan and data of an office building with the client's requirements (frequencies, schedules, expectations).","In teams: perform the complete estimate (hours, costs, margin) and write the one-page bid.","Each team presents and defends its price before the \"client\" played by the trainer, who negotiates.","Comparison of the prices obtained between teams and review of the gaps."]},"quiz":[["What does every serious bid start with?",["A random price","An assessment visit","A copy of the competitor","A discount"],1],["What do the client's dissatisfactions with their current supplier reveal?",["Nothing","What truly matters to them","Their exact budget","Their naivety"],1],["The real cost of labour includes:",["Wages only","Wages + payroll charges + benefits","Wages minus taxes","A universal fixed amount"],1],["What is the risk of forgetting a cost item?",["None","Working at a loss","A better price","More clients"],1],["The price per square foot is used to:",["Replace the detailed calculation","Compare and validate your calculation","Set wages","Nothing"],1],["Why is margin essential?",["For luxury","It funds the unexpected, equipment and growth","It is illegal","It scares clients away"],1],["What is a bid won at a losing price?",["A victory","A double defeat: you work and you grow poorer","A good strategy","A safe investment"],1],["What must a professional bid specify?",["The price only","Services, frequencies, exclusions, price and conditions","Generalities","As little as possible"],1],["Faced with a \"cheaper competitor\", you must:",["Lower your price immediately","Have them specify what that price actually includes","Give up","Insult the competitor"],1],["What does lowering your price without removing service destroy?",["Nothing","Your credibility and your margin","The competition","The contract"],1]]}]},{"id":"cleaning-p3","lang":"fr","badge":"ESSOR Cleaning Academy™ · Français · Filière 2","title":"Programme 3 — Démarrer son entreprise de nettoyage","desc":"La filière Entrepreneuriat : modèle d'affaires, structure légale en Ontario, plan d'affaires, ventes, contrats, embauche et croissance. Prérequis : certificat du Programme 1.","duration":"24 heures","level":"Entrepreneuriat","modules":[{"num":1,"title":"L'entrepreneuriat en nettoyage : choisir son modèle d'affaires","duree":"2 heures","objectifs":["Comprendre le marché du nettoyage et ses segments","Comparer les modèles d'affaires possibles","Évaluer honnêtement son profil d'entrepreneur"],"chapters":[{"title":"Le marché du nettoyage : une opportunité réelle","content":["Le nettoyage est l'un des secteurs les plus accessibles pour se lancer en affaires : faible investissement de départ, demande constante et récurrente, revenus mensuels prévisibles par contrat, et croissance possible à son propre rythme. Mais l'accessibilité attire aussi beaucoup de concurrence — ce qui distingue les entreprises qui durent, c'est le professionnalisme, la fiabilité et la gestion rigoureuse, exactement ce que forme le parcours ESSOR."]},{"title":"Résidentiel ou commercial ?","content":[["Le résidentiel","Démarrage rapide et facturation immédiate, mais clientèle plus volatile, revenus moins prévisibles et forte sensibilité au prix. Idéal pour générer ses premiers revenus rapidement."],["Le commercial","Contrats récurrents (bureaux, commerces, immeubles), revenus mensuels stables et relations d'affaires durables, mais cycle de vente plus long et exigences plus élevées (assurances, preuves de sérieux). C'est le cœur de la formation ESSOR et le chemin le plus solide vers une entreprise durable."],["La stratégie mixte","Beaucoup d'entrepreneurs démarrent en résidentiel pour financer leur transition vers le commercial : les deux ne s'excluent pas, mais exigent des approches de vente différentes."]]},{"title":"Les modèles d'affaires","content":[["Solo (travailleur autonome)","Vous exécutez tout vous-même : revenus limités par vos heures, mais frais minimes et contrôle total. Le point de départ de la majorité."],["Petite équipe","Vous exécutez et supervisez avec 2 à 5 employés : le modèle qui permet de dépasser le plafond de ses propres heures — et celui qui exige les compétences du Programme 2 (supervision)."],["Sous-traitance","Vous décrochez les contrats et confiez l'exécution à des sous-traitants : croissance rapide possible, mais marges plus minces et contrôle qualité plus difficile."],["Franchise","Vous achetez une marque et un système existants : encadrement fourni, mais redevances permanentes et liberté réduite. À comparer sérieusement avec le démarrage indépendant."]]},{"title":"Le profil de l'entrepreneur","content":["Être excellent nettoyeur ne suffit pas pour réussir en affaires : il faut aussi accepter de vendre, de gérer des chiffres, de vivre avec l'incertitude des débuts et de faire des semaines inégales. L'auto-évaluation honnête — mes forces, mes lacunes, mon coussin financier, le soutien de mes proches — est la première décision d'affaires intelligente. Les lacunes ne sont pas des barrières : elles indiquent ce qu'il faudra apprendre ou déléguer."]}],"activity":{"label":"Atelier","title":"Mon modèle et mon plan de match personnel","steps":["Chaque participant remplit une grille d'auto-évaluation : compétences techniques, aisance en vente, tolérance au risque, situation financière, temps disponible.","Choix argumenté d'un modèle d'affaires de départ (solo, équipe, mixte) et d'un segment (résidentiel, commercial, mixte).","Partage en binômes et rétroaction du formateur sur le réalisme de chaque plan."]},"quiz":[["Pourquoi le nettoyage est-il un secteur accessible pour se lancer ?",["Il n'y a aucune concurrence","Faible investissement de départ et demande récurrente","Les contrats sont garantis par le gouvernement","Aucune compétence n'est requise"],1],["Qu'est-ce qui distingue les entreprises de nettoyage qui durent ?",["Le prix le plus bas","Le professionnalisme, la fiabilité et la gestion rigoureuse","La chance","La taille du véhicule"],1],["Quel est l'avantage principal du marché commercial ?",["Aucune exigence","Des contrats récurrents et des revenus stables","Un cycle de vente plus court","Pas besoin d'assurance"],1],["Quel est le principal inconvénient du modèle solo ?",["Trop de frais","Les revenus sont limités par ses propres heures","Trop d'employés","Aucun contrôle"],1],["Quel modèle exige surtout les compétences de supervision du Programme 2 ?",["Solo","La petite équipe","La franchise","Aucun"],1],["Quel est le compromis principal de la franchise ?",["Encadrement fourni contre redevances et liberté réduite","Aucun compromis","Prix plus bas garanti","Croissance impossible"],0],["Pourquoi beaucoup démarrent-ils en résidentiel ?",["C'est plus prestigieux","Pour générer des revenus rapidement en préparant le commercial","Le commercial est interdit aux débutants","Aucune raison"],1],["Quelle est la première décision d'affaires intelligente ?",["Acheter un véhicule neuf","Une auto-évaluation honnête de son profil","Imprimer des cartes d'affaires","Baisser ses prix"],1]]},{"num":2,"title":"Structure légale, enregistrement et protections (Ontario)","duree":"3 heures","objectifs":["Choisir entre entreprise individuelle et société par actions","Enregistrer son entreprise et respecter ses obligations fiscales","Se protéger avec les bonnes assurances"],"chapters":[{"title":"Entreprise individuelle ou société par actions","content":[["L'entreprise individuelle","La forme la plus simple et la moins chère : vous et l'entreprise ne faites qu'un. Revers de la simplicité : responsabilité personnelle illimitée — vos biens personnels peuvent répondre des dettes et poursuites de l'entreprise."],["La société par actions (incorporation)","Une personne morale distincte : responsabilité limitée, avantages fiscaux possibles à partir d'un certain niveau de revenus, crédibilité accrue auprès des clients commerciaux — mais coûts de constitution et obligations comptables plus élevés."],["Quand incorporer ?","Beaucoup démarrent en entreprise individuelle et s'incorporent quand les revenus, les risques ou les exigences des clients le justifient. La décision mérite l'avis d'un comptable — le contenu de ce module est informatif et ne remplace pas un conseil professionnel."]]},{"title":"Enregistrer son entreprise en Ontario","content":["En Ontario, exploiter une entreprise sous un nom autre que son nom personnel exige l'enregistrement du nom commercial au Registre des entreprises de l'Ontario (en vertu de la Loi sur les noms commerciaux). L'enregistrement se fait en ligne, doit être renouvelé périodiquement, et ne protège pas le nom comme une marque de commerce — il rend simplement son utilisation légale et transparente."]},{"title":"Les taxes : TVH et obligations fiscales","content":["Dès que les revenus dépassent le seuil de petit fournisseur (30 000 $ sur quatre trimestres civils consécutifs), l'inscription à la TVH devient obligatoire : on facture la taxe, on la remet, et on récupère celle payée sur ses achats (crédits de taxe sur intrants). Il faut aussi déclarer tous ses revenus d'entreprise, conserver ses pièces justificatives et prévoir de l'argent pour les impôts — la discipline fiscale dès le premier contrat évite les mauvaises surprises."]},{"title":"Les assurances indispensables","content":[["Responsabilité civile générale","LA protection de base du nettoyage commercial : elle couvre les dommages causés chez le client (bris, dégât d'eau, blessure d'un tiers). La plupart des clients commerciaux exigent une preuve d'assurance (souvent 2 M$) avant même de signer."],["Le cautionnement (bonding)","Protège le client contre le vol commis par un employé : un argument de confiance devenu standard dans l'industrie."],["Autres protections","Assurance des équipements, assurance automobile commerciale pour le véhicule de travail, et couverture de la WSIB dès l'embauche d'employés (voir module 7)."]]},{"title":"Comptes et image professionnelle","content":["Séparer les finances dès le premier jour : compte bancaire d'entreprise distinct, carte dédiée aux dépenses d'affaires, et facturation professionnelle (numérotée, avec nom commercial, coordonnées et numéro de TVH le cas échéant). Cette séparation simplifie la comptabilité, protège en cas de vérification fiscale et projette le sérieux que les clients commerciaux recherchent."]}],"activity":{"label":"Atelier","title":"Ma checklist de démarrage légal","steps":["À partir d'un gabarit fourni, chaque participant bâtit sa checklist personnalisée : structure choisie, enregistrement du nom, TVH, assurances requises, compte bancaire.","Recherche guidée : repérer les sites officiels (Registre des entreprises de l'Ontario, ARC) et le coût réel de chaque étape.","Mise en commun : construire la checklist collective de la cohorte avec échéancier type."]},"quiz":[["Quel est le principal risque de l'entreprise individuelle ?",["Des coûts trop élevés","La responsabilité personnelle illimitée","Trop de paperasse","L'impossibilité d'avoir des clients"],1],["Quel est un avantage clé de l'incorporation ?",["Aucune obligation comptable","La responsabilité limitée","L'exemption de taxes à vie","Un nom protégé mondialement"],1],["Quand faut-il enregistrer un nom commercial en Ontario ?",["Jamais","Dès qu'on exploite sous un autre nom que son nom personnel","Seulement après 5 ans","Seulement pour les sociétés par actions"],1],["L'enregistrement du nom commercial…",["Protège le nom comme une marque de commerce","Rend son utilisation légale mais ne le protège pas comme une marque","Est facultatif dans tous les cas","Est permanent sans renouvellement"],1],["À partir de quel seuil l'inscription à la TVH devient-elle obligatoire ?",["10 000 $","30 000 $ sur quatre trimestres consécutifs","100 000 $","Elle n'est jamais obligatoire"],1],["Que permettent les crédits de taxe sur intrants ?",["Éviter de facturer la TVH","Récupérer la taxe payée sur ses achats d'affaires","Doubler ses prix","Rien"],1],["Quelle assurance les clients commerciaux exigent-ils le plus souvent ?",["Assurance vie","Responsabilité civile générale (souvent 2 M$)","Assurance voyage","Aucune"],1],["Contre quoi le cautionnement (bonding) protège-t-il le client ?",["Les retards","Le vol commis par un employé","La pluie","Les hausses de prix"],1],["Pourquoi séparer les comptes personnels et d'affaires ?",["C'est illégal de les mélanger dans tous les cas","Simplicité comptable, protection fiscale et image professionnelle","Pour avoir plus de cartes","Aucune raison"],1],["Le contenu juridique de ce module…",["Remplace un avocat","Est informatif et ne remplace pas un conseil professionnel","Est garanti sans erreur à vie","S'applique partout dans le monde"],1],["Qu'est-ce qu'une facture professionnelle doit contenir ?",["Seulement le montant","Numéro, nom commercial, coordonnées et numéro de TVH le cas échéant","Une photo","Rien de particulier"],1],["Quelle couverture devient nécessaire dès l'embauche d'employés ?",["La WSIB","L'assurance voyage","L'assurance récolte","Aucune"],0]]},{"num":3,"title":"Le plan d'affaires et les finances de démarrage","duree":"3 heures","objectifs":["Rédiger un plan d'affaires simple et utile","Budgéter son démarrage et ses premiers mois","Mettre en place une gestion financière saine"],"chapters":[{"title":"Un plan d'affaires simple et vivant","content":["Le plan d'affaires d'un démarrage en nettoyage tient en quelques pages utiles : qui je sers (segment et territoire), ce que j'offre (services et fréquences), comment je me distingue, mes prix et mes coûts, mes objectifs à 6-12-24 mois, et mon plan pour trouver des clients. Ce n'est pas un document pour la tablette : c'est un outil de décision qu'on relit et ajuste chaque trimestre."]},{"title":"Les coûts de démarrage","content":["Un démarrage réaliste en nettoyage commercial léger se budgète généralement en quelques milliers de dollars : équipement de base et chariot, produits initiaux, assurances (premier versement), enregistrement et frais légaux, uniformes et image (logo, cartes, site simple), et un coussin pour les premiers mois. La discipline ESSOR : commencer petit, acheter usagé quand c'est sensé, et laisser les contrats financer la croissance de l'équipement."]},{"title":"Prévoir ses revenus et son point mort","content":["Le point mort est le montant de revenus mensuels qui couvre toutes les dépenses (fixes et variables) : le connaître transforme l'anxiété en objectif chiffré — « il me faut X contrats moyens pour vivre ». Les prévisions se bâtissent prudemment : scénario réaliste et scénario lent, en se rappelant que le nettoyage commercial paie souvent à 30 jours — il faut financer ce décalage."]},{"title":"Le financement du démarrage","content":["Les sources habituelles : épargne personnelle (la plus fréquente et la plus saine en nettoyage), prêts et subventions aux petites entreprises (programmes fédéraux et provinciaux, organismes d'aide aux entrepreneurs, programmes pour nouveaux arrivants), et marge de crédit d'urgence. La règle d'or : en nettoyage, on peut démarrer petit — mieux vaut un petit démarrage sans dette écrasante qu'un gros démarrage endetté."]},{"title":"La gestion financière au quotidien","content":["Les habitudes qui sauvent les entreprises : facturer immédiatement et relancer sans gêne les comptes en retard, enregistrer ses dépenses chaque semaine (application ou tableur), mettre de côté un pourcentage de chaque paiement pour les taxes et impôts, se verser un salaire réaliste, et regarder ses chiffres chaque mois — revenus, dépenses, comptes à recevoir. Une entreprise rentable peut mourir d'un simple problème de liquidités mal gérées."]}],"activity":{"label":"Atelier","title":"Mon budget de démarrage et mon point mort","steps":["À partir d'un gabarit de budget fourni, chaque participant chiffre son démarrage : équipement, assurances, frais, coussin.","Calcul du point mort personnel : dépenses mensuelles (entreprise + vie personnelle minimale) et nombre de contrats moyens nécessaires.","Présentation en binômes : chaque participant défend le réalisme de son budget, rétroaction du formateur."]},"quiz":[["À quoi sert d'abord un plan d'affaires de démarrage ?",["À décorer le bureau","À décider et à s'ajuster — c'est un outil vivant","À impressionner la famille","À rien"],1],["Quelle est la discipline ESSOR pour l'équipement de départ ?",["Tout acheter neuf à crédit","Commencer petit et laisser les contrats financer la croissance","Ne rien acheter","Louer un entrepôt"],1],["Qu'est-ce que le point mort ?",["L'heure de fermeture","Le revenu mensuel qui couvre toutes les dépenses","Le prix d'un contrat","Une pause obligatoire"],1],["Pourquoi faut-il financer un décalage de trésorerie en commercial ?",["Les clients paient souvent à 30 jours","Les banques l'exigent","Pour le plaisir","Aucune raison"],0],["Quelle est la source de financement la plus fréquente en nettoyage ?",["La bourse","L'épargne personnelle","Les casinos","Les obligations d'État"],1],["Quelle est la règle d'or du financement de démarrage en nettoyage ?",["S'endetter au maximum","Mieux vaut petit sans dette écrasante que gros endetté","Tout financer par carte de crédit","Éviter tout financement"],1],["Que faire de chaque paiement reçu ?",["Tout dépenser","Mettre de côté un pourcentage pour taxes et impôts","Le laisser dans le compte personnel","L'encaisser en argent comptant sans trace"],1],["De quoi une entreprise rentable peut-elle quand même mourir ?",["De trop de clients","D'un problème de liquidités mal gérées","De trop de qualité","De rien"],1],["À quelle fréquence relit-on et ajuste-t-on son plan d'affaires ?",["Jamais","Chaque trimestre","Tous les 10 ans","Une seule fois"],1],["Comment bâtit-on des prévisions de revenus ?",["Avec le scénario le plus optimiste seulement","Prudemment : scénario réaliste et scénario lent","En copiant un concurrent","Au hasard"],1]]},{"num":4,"title":"Trouver ses premiers clients : ventes et marketing","duree":"4 heures","objectifs":["Définir son positionnement et son territoire","Bâtir une présence professionnelle en ligne et hors ligne","Maîtriser la prospection et transformer les soumissions en contrats"],"chapters":[{"title":"Positionnement et niche","content":["« Nettoyage général pour tout le monde » ne convainc personne : les entreprises qui décollent choisissent un terrain de jeu précis — bureaux professionnels d'un secteur donné, cliniques et espaces médicaux, garderies, immeubles en copropriété, fins de chantier — et deviennent la référence locale de cette niche. La niche guide tout : le message, les preuves à bâtir, les certifications utiles (comme le parcours ESSOR) et les prix."]},{"title":"L'image professionnelle","content":["Avant d'acheter, le client commercial cherche des signaux de sérieux : nom professionnel, logo propre, uniformes, adresse courriel au nom de l'entreprise (pas une adresse générique), preuve d'assurance prête à envoyer, et certificats de formation affichés. Chaque point de contact — courriel, boîte vocale, tenue, véhicule — confirme ou détruit la confiance."]},{"title":"La présence en ligne","content":["Le minimum vital : une fiche Google Business complète (photos, services, avis clients sollicités systématiquement) et un site simple d'une page avec services, territoire, preuves et bouton de contact. Les avis Google sont le levier le plus puissant du nettoyage local : chaque client satisfait doit être invité à en laisser un — c'est le réflexe commercial numéro un."]},{"title":"La prospection directe","content":["Les premiers contrats commerciaux viennent rarement tout seuls : ils se gagnent par la prospection — visites en personne aux gestionnaires d'immeubles et commerces du territoire, appels de suivi, présence dans les réseaux d'affaires locaux, et offres de dépannage (remplacer un fournisseur qui a fait défaut est la porte d'entrée classique). La constance bat le talent : un rythme hebdomadaire de prospection, même modeste, finit toujours par produire."]},{"title":"De la visite à la soumission gagnante","content":["Tout ce que le Programme 2 a enseigné sur l'estimation s'applique ici avec un enjeu de plus : c'est votre entreprise. La visite sert aussi à vendre — écouter les frustrations, poser des questions, montrer son professionnalisme. La soumission part dans les 48 heures, est suivie d'un appel poli, et chaque refus devient une information : trop cher ? mauvais moment ? titulaire satisfait ? On note tout et on rappelle dans six mois."]},{"title":"Fidéliser et faire jouer les références","content":["Garder un client coûte dix fois moins cher que d'en trouver un nouveau : qualité constante, communication proactive et petites attentions font le travail. Les clients satisfaits sont aussi la meilleure force de vente — demander une référence ou un témoignage est normal et attendu en affaires. Un portefeuille qui grandit, c'est des contrats qu'on garde plus des contrats qu'on ajoute."]}],"activity":{"label":"Simulation","title":"Ma prospection en conditions réelles","steps":["Chaque participant définit sa niche et son territoire, puis rédige son argumentaire de 60 secondes.","Jeu de rôle : première visite chez un gestionnaire d'immeuble (joué par un pair puis par le formateur) — présentation, écoute, demande de visite des lieux.","Jeu de rôle : appel de suivi d'une soumission envoyée, avec gestion d'une objection de prix.","Rétroaction collective sur les argumentaires les plus convaincants."]},"quiz":[["Pourquoi choisir une niche plutôt que « tout le monde » ?",["Pour limiter ses revenus","Pour devenir la référence locale d'un segment précis","Parce que c'est obligatoire","Aucune raison"],1],["Quel signal détruit la confiance d'un client commercial ?",["Un uniforme propre","Une image amateur (courriel générique, pas de preuve d'assurance)","Un certificat de formation","Une soumission claire"],1],["Quel est le levier en ligne le plus puissant du nettoyage local ?",["Les publicités télé","Les avis Google","Les affiches papier","Le courrier postal"],1],["Quel est le réflexe commercial numéro un après un bon service ?",["Attendre","Inviter le client à laisser un avis Google","Augmenter le prix","Ne rien faire"],1],["Quelle est la porte d'entrée classique d'un premier contrat commercial ?",["La chance","Remplacer un fournisseur qui a fait défaut","Un héritage","La loterie"],1],["Qu'est-ce qui « bat le talent » en prospection ?",["La chance","La constance d'un rythme hebdomadaire","Les rabais","Le silence"],1],["Dans quel délai envoie-t-on la soumission après la visite ?",["Un mois","48 heures","Six mois","Quand on a le temps"],1],["Que fait-on d'un refus ?",["On abandonne ce client pour toujours","On note l'information et on rappelle dans six mois","On baisse le prix de moitié","On se fâche"],1],["Pourquoi la fidélisation est-elle si rentable ?",["Garder un client coûte bien moins cher que d'en trouver un","Elle ne l'est pas","Les nouveaux clients paient plus","Aucune raison"],0],["Demander une référence à un client satisfait est…",["Impoli","Normal et attendu en affaires","Interdit","Inutile"],1],["Que contient le minimum vital en ligne ?",["Rien","Fiche Google Business complète et site simple d'une page","Dix sites web","Un compte de jeux vidéo"],1],["La visite d'évaluation sert aussi à…",["Rien d'autre","Vendre : écouter, questionner, montrer son professionnalisme","Critiquer le fournisseur actuel","Signer sur-le-champ à tout prix"],1]]},{"num":5,"title":"Les contrats et la relation client d'affaires","duree":"3 heures","objectifs":["Structurer un contrat de service clair et protecteur","Gérer la relation client en tant que propriétaire","Protéger sa rentabilité dans la durée"],"chapters":[{"title":"Le contrat de service","content":["Le contrat écrit protège les deux parties et professionnalise la relation. Ses éléments essentiels : identification des parties, description précise des services et fréquences par zone (l'annexe de portée de travail), prix et modalités de paiement, durée et renouvellement, conditions de résiliation (préavis), responsabilités et assurances, et gestion des demandes hors contrat. Tout ce qui reste verbal finira par être contesté."]},{"title":"La portée de travail (scope)","content":["L'annexe de portée de travail est le cœur opérationnel du contrat : elle liste, zone par zone, ce qui est fait et à quelle fréquence. Une portée précise évite le glissement de tâches (« pendant que vous y êtes… ») qui gruge silencieusement la marge. Toute demande récurrente hors portée mérite un avenant écrit — et un prix."]},{"title":"Prix, indexation et renouvellement","content":["Un contrat commercial se négocie avec la durée en tête : clause d'indexation annuelle (inflation, salaire minimum), révision de prix si la portée change, et discussion de renouvellement entamée des mois avant l'échéance — jamais à la dernière minute. Les contrats hérités de prix trop bas doivent être renégociés ou, parfois, laissés partir : garder un contrat perdant use l'équipe et la trésorerie."]},{"title":"La relation client en tant que propriétaire","content":["Le propriétaire incarne l'entreprise : tournées régulières chez les clients clés, réponse rapide aux messages, transparence en cas de pépin (avertir avant que le client découvre), et documentation des échanges importants. La compétence sociale qui rapporte le plus : savoir dire non poliment — aux demandes hors contrat gratuites, aux baisses de prix non justifiées, aux conditions perdantes."]},{"title":"Quand ça se gâte : plaintes et fins de contrat","content":["Une plainte majeure se gère en propriétaire : écoute complète, excuses si l'erreur est réelle, plan de correction daté, suivi personnel. Une fin de contrat se gère en professionnel : transition ordonnée, remise des clés documentée, facturation finale propre — la réputation se construit aussi dans les départs, et le client perdu d'aujourd'hui est parfois celui qui revient dans deux ans."]}],"activity":{"label":"Étude de cas","title":"Analyser et corriger un contrat troué","steps":["Un contrat de service volontairement défaillant est fourni (portée vague, pas d'indexation, résiliation floue).","En équipes : identifier les trous, évaluer les risques concrets et rédiger les clauses corrigées.","Jeu de rôle final : annoncer à un « client » une hausse de prix justifiée à l'échéance du contrat."]},"quiz":[["Pourquoi un contrat écrit est-il essentiel ?",["Pour la décoration","Tout ce qui reste verbal finira par être contesté","C'est illégal autrement dans tous les cas","Pour utiliser du papier"],1],["Qu'est-ce que la portée de travail (scope) ?",["Le prix total","La liste précise des services et fréquences par zone","Le nom du client","La durée du contrat"],1],["Qu'est-ce que le « glissement de tâches » ?",["Une technique de nettoyage","Des tâches ajoutées hors contrat qui grugent la marge","Un type de plancher","Une prime"],1],["Que mérite une demande récurrente hors portée ?",["Un refus brutal","Un avenant écrit — et un prix","Un cadeau","Le silence"],1],["À quoi sert une clause d'indexation ?",["À rien","À ajuster le prix annuellement (inflation, salaire minimum)","À annuler le contrat","À baisser les prix"],1],["Quand entame-t-on la discussion de renouvellement ?",["À la dernière minute","Des mois avant l'échéance","Après l'échéance","Jamais"],1],["Que faire d'un contrat structurellement perdant ?",["Le garder à tout prix","Le renégocier ou le laisser partir","L'ignorer","Doubler les heures"],1],["Quelle compétence sociale rapporte le plus au propriétaire ?",["Tout accepter","Savoir dire non poliment","Parler fort","Éviter les clients"],1],["Comment gère-t-on une plainte majeure ?",["En l'ignorant","Écoute, excuses si réel, plan daté, suivi personnel","En blâmant l'employé devant le client","En résiliant"],1],["Pourquoi bien gérer une fin de contrat ?",["Aucun intérêt","La réputation se construit aussi dans les départs","Pour se venger","C'est obligatoire par la loi partout"],1]]},{"num":6,"title":"Opérations : équipement, produits et fournisseurs","duree":"3 heures","objectifs":["S'équiper intelligemment selon ses contrats","Gérer produits, stocks et fournisseurs","Décider quoi faire soi-même et quoi confier"],"chapters":[{"title":"S'équiper selon ses contrats, pas l'inverse","content":["L'erreur classique du débutant : acheter l'équipement avant les contrats. La logique saine est inverse — l'équipement de base d'abord (chariot, aspirateur commercial, microfibres, produits essentiels), puis chaque nouvel équipement majeur (autolaveuse, extracteur, polisseuse) justifié par un contrat qui le paie. Le neuf, l'usagé reconditionné et la location courte durée ont chacun leur place : la location est reine pour les besoins ponctuels."]},{"title":"Choisir et gérer ses fournisseurs","content":["Un bon fournisseur de produits d'entretien est un partenaire : prix de gros dès des volumes modestes, conseils techniques, formation sur les produits et dépannage rapide. Comparer deux ou trois fournisseurs, négocier les conditions (livraison, crédit 30 jours) et concentrer ses achats pour peser davantage : de meilleures conditions d'achat, c'est de la marge directe."]},{"title":"La gestion des stocks","content":["Le stock immobilise de l'argent et l'improvisation coûte des dépannages en urgence : la solution est un inventaire minimal avec seuils de recommande — quand il reste X unités, on commande. Un local ou un coin d'entreposage propre, ventilé et organisé (produits séparés selon compatibilité, rotation premier entré premier sorti) applique en entreprise ce que le Programme 1 enseignait en technique."]},{"title":"Standardiser pour déléguer","content":["Ce qui n'est pas standardisé ne se délègue pas : fiches de tâches par site, dilutions affichées, listes de chariot, routines d'inspection — les outils des Programmes 1 et 2 deviennent ici les procédures internes de VOTRE entreprise. Une entreprise standardisée peut croître et se vendre un jour ; une entreprise qui repose sur la mémoire du patron plafonne vite."]},{"title":"Faire, embaucher ou sous-traiter","content":["Trois façons d'exécuter un contrat : le faire soi-même (marge maximale, temps limité), embaucher (contrôle qualité, obligations d'employeur — module 7), ou sous-traiter (rapidité, marge réduite, contrôle plus difficile — et attention à la distinction légale entre employé et sous-traitant). Le bon choix dépend du contrat, de la marge et de la stratégie : l'important est de décider en connaissant les chiffres."]}],"activity":{"label":"Atelier","title":"Équiper mon premier contrat","steps":["Cas fourni : un contrat de bureaux de 5 000 pi², 3 soirs par semaine, vient d'être signé.","En équipes : établir la liste d'équipement et de produits nécessaires, avec budget neuf vs usagé vs location.","Établir les seuils de recommande des consommables et la fiche de tâches standardisée du site.","Comparaison des budgets entre équipes et rétroaction du formateur."]},"quiz":[["Quelle est l'erreur classique du débutant en équipement ?",["Acheter usagé","Acheter l'équipement avant d'avoir les contrats","Louer","Demander conseil"],1],["Quand un équipement majeur (autolaveuse, extracteur) se justifie-t-il ?",["Dès le premier jour","Quand un contrat le paie","Jamais","Quand il est en solde"],1],["Pour un besoin ponctuel, la meilleure option est souvent…",["L'achat neuf","La location courte durée","L'abandon du contrat","L'emprunt sans permission"],1],["Qu'apporte un bon fournisseur au-delà des produits ?",["Rien","Conseils, formation, dépannage et conditions négociées","Des vacances","Des clients garantis"],1],["Pourquoi concentrer ses achats chez peu de fournisseurs ?",["Par paresse","Pour peser davantage et négocier de meilleures conditions","C'est obligatoire","Aucune raison"],1],["À quoi servent les seuils de recommande ?",["À rien","À commander avant la rupture de stock, sans surstocker","À payer plus cher","À remplir le garage"],1],["Pourquoi standardiser ses procédures ?",["Pour compliquer le travail","Ce qui n'est pas standardisé ne se délègue pas","Pour impressionner","Aucune raison"],1],["Quel est le risque d'une entreprise qui repose sur la mémoire du patron ?",["Aucun","Elle plafonne vite et ne peut ni croître ni se vendre","Elle croît trop vite","Elle paie trop d'impôts"],1]]},{"num":7,"title":"Embaucher et bâtir son équipe","duree":"3 heures","objectifs":["Savoir quand et qui embaucher","Respecter ses obligations d'employeur en Ontario","Retenir ses bons employés dans un secteur à fort roulement"],"chapters":[{"title":"Quand embaucher ?","content":["Le signal classique : refuser des contrats faute de bras, ou travailler des semaines insoutenables. La première embauche est un cap — on passe d'exécutant à employeur — et se prépare : un contrat qui paie le poste, une description de tâches claire, et du temps réservé pour former et superviser (les compétences du Programme 2 deviennent ici vitales)."]},{"title":"Employé ou sous-traitant : la distinction légale","content":["Appeler quelqu'un « sous-traitant » ne suffit pas : les autorités fiscales et du travail regardent la réalité — qui contrôle le travail, qui fournit les outils, qui assume le risque financier, l'exclusivité de la relation. Mal classifier un employé en sous-traitant expose à des rappels de retenues, pénalités et cotisations rétroactives. En cas de doute : avis professionnel."]},{"title":"Les obligations de l'employeur en Ontario","content":["Embaucher en Ontario implique : respecter les normes d'emploi (salaire minimum, heures, heures supplémentaires, vacances et congés, préavis de fin d'emploi), faire les retenues à la source et les remises (impôt, RPC, AE), s'inscrire à la WSIB et payer les primes d'assurance contre les accidents du travail, et assurer la formation en santé-sécurité (dont la sensibilisation obligatoire et le SIMDUT — que vos diplômés ESSOR ont déjà !)."]},{"title":"Recruter dans le nettoyage","content":["Le recrutement en nettoyage est un défi permanent : bassin en mouvement, horaires atypiques, concurrence des autres employeurs. Ce qui marche : le bouche-à-oreille des bons employés (prime de référencement), des affichages honnêtes (horaire, salaire, lieu), une entrevue simple centrée sur la fiabilité et l'attitude — la technique s'enseigne, l'attitude beaucoup moins — et une vérification des références réellement faite."]},{"title":"Payer, motiver et retenir","content":["Dans un secteur réputé pour son roulement, la rétention est un avantage concurrentiel : salaire correct payé à temps sans exception, horaires stables et respectés, équipement qui fonctionne, respect au quotidien, reconnaissance des bons coups et perspective de progression (chef d'équipe, superviseur — le parcours ESSOR de vos employés). Remplacer un employé coûte cher en recrutement, formation et qualité perdue : retenir est presque toujours moins cher."]}],"activity":{"label":"Jeux de rôle","title":"Ma première embauche","steps":["Rédaction d'une offre d'emploi honnête et attractive pour un poste de nettoyeur de soir.","Simulation d'entrevue : chaque participant mène une entrevue de 10 minutes centrée sur la fiabilité et l'attitude.","Cas pratique : calculer le coût réel d'un employé (salaire + charges + équipement) et le comparer au revenu du contrat visé."]},"quiz":[["Quel est le signal classique qu'il faut embaucher ?",["L'ennui","Refuser des contrats faute de bras","La curiosité","Une bonne météo"],1],["Que faut-il avoir avant la première embauche ?",["Un grand bureau","Un contrat qui paie le poste et une description claire","Une flotte de véhicules","Rien"],1],["Qui décide de la vraie nature employé vs sous-traitant ?",["Le titre écrit sur le contrat","La réalité de la relation (contrôle, outils, risque)","L'employé seul","Personne"],1],["Quel est le risque d'une mauvaise classification ?",["Aucun","Rappels de retenues, pénalités et cotisations rétroactives","Une amende de stationnement","Un simple avertissement sans suite"],1],["Que doit faire l'employeur ontarien sur chaque paie ?",["Rien","Les retenues à la source et les remises (impôt, RPC, AE)","Payer en argent comptant sans trace","Attendre la fin d'année"],1],["À quoi sert la WSIB ?",["Aux vacances","L'assurance contre les accidents du travail","Au marketing","À la comptabilité"],1],["Quel critère d'embauche s'enseigne le moins ?",["La technique","L'attitude","Les produits","Les horaires"],1],["Quelle source de recrutement fonctionne le mieux ?",["Le hasard","Le bouche-à-oreille des bons employés (prime de référencement)","Aucune","Les annonces mensongères"],1],["Pourquoi la rétention est-elle un avantage concurrentiel ?",["Elle ne l'est pas","Remplacer coûte cher ; retenir est presque toujours moins cher","Les clients préfèrent le roulement","Aucune raison"],1],["Quel élément de rétention est non négociable ?",["Le café gratuit","Le salaire payé à temps, sans exception","Les fêtes","Les titres ronflants"],1],["Quelle formation obligatoire vos diplômés ESSOR ont-ils déjà ?",["Aucune","La sensibilisation santé-sécurité et le SIMDUT","Le pilotage","La plomberie"],1],["Une prime de référencement récompense…",["L'ancienneté","Un employé qui amène une bonne recrue","Les retards","Les plaintes"],1]]},{"num":8,"title":"Gérer, mesurer et faire croître son entreprise","duree":"3 heures","objectifs":["Installer des routines de gestion simples et régulières","Suivre les indicateurs qui comptent vraiment","Faire croître son entreprise sans perdre le contrôle"],"chapters":[{"title":"Les routines du propriétaire","content":["Une petite entreprise se pilote avec des routines, pas des urgences : chaque semaine — facturation, relances, paie, prospection ; chaque mois — chiffres complets (revenus, dépenses, marge), tournée des clients clés, point d'équipe ; chaque trimestre — relecture du plan, prix et contrats à revoir. Une heure de gestion planifiée épargne des journées de crises."]},{"title":"Les indicateurs qui comptent","content":["Cinq chiffres suffisent pour piloter : le revenu mensuel récurrent (la base de la sécurité), la marge par contrat (qui révèle les contrats perdants), les comptes à recevoir en retard (le tueur silencieux), le taux de rétention des clients et celui des employés. Suivis chaque mois sur une seule page, ils disent où agir bien avant que les problèmes n'explosent."]},{"title":"Croître sans se casser","content":["La croissance saine suit un ordre : d'abord remplir sa capacité actuelle, puis embaucher sur la base de contrats signés, puis ajouter des services à plus forte marge (planchers, tapis, désinfection — les spécialités du Programme 2), et seulement ensuite élargir le territoire. Grandir trop vite tue autant que ne pas grandir : chaque palier doit être digéré — qualité stable, équipe formée, trésorerie saine — avant le suivant."]},{"title":"Se développer soi-même","content":["L'entreprise ne dépasse jamais longtemps le niveau de son propriétaire : continuer à se former (gestion, vente, technique), s'entourer (mentors, autres entrepreneurs, communauté ESSOR), déléguer ce que d'autres font mieux (comptabilité !) et protéger son énergie — le propriétaire épuisé prend de mauvaises décisions. L'entrepreneuriat est un marathon : le rythme soutenable gagne."]},{"title":"La vision long terme","content":["Dès aujourd'hui, travailler À son entreprise et pas seulement DANS son entreprise : documenter les procédures, bâtir une marque qui ne dépend pas d'une seule personne, développer des revenus récurrents solides. C'est ce qui ouvre les options de demain — vivre confortablement de son entreprise, la faire diriger par d'autres, ou la vendre un jour. Et c'est la vision ESSOR : des diplômés qui deviennent employeurs et, à leur tour, font grandir leur communauté."]}],"activity":{"label":"Atelier final","title":"Mon plan de 90 jours","steps":["Chaque participant rédige son plan de lancement de 90 jours : étapes légales, budget, équipement minimal, objectif de prospection hebdomadaire et premier objectif de revenus.","Construction de son tableau de bord personnel : les 5 indicateurs et leur rythme de suivi.","Présentation devant le groupe : chaque participant s'engage sur ses trois premières actions concrètes.","Clôture du parcours : remise des attestations et intégration à la communauté d'entrepreneurs ESSOR."]},"quiz":[["Comment se pilote une petite entreprise ?",["Par les urgences","Par des routines hebdomadaires, mensuelles et trimestrielles","Par la chance","Sans aucune gestion"],1],["Quel indicateur est « le tueur silencieux » ?",["Le nombre de clients","Les comptes à recevoir en retard","Le nombre d'employés","La météo"],1],["Que révèle la marge par contrat ?",["Rien","Les contrats perdants","L'âge de l'entreprise","La taille du véhicule"],1],["Quelle est la base de la sécurité financière de l'entreprise ?",["Les contrats ponctuels","Le revenu mensuel récurrent","Les prix les plus bas","Le hasard"],1],["Quel est le bon ordre de croissance ?",["Élargir le territoire d'abord","Remplir sa capacité, embaucher sur contrats signés, ajouter des services à forte marge, puis élargir","Embaucher avant d'avoir des contrats","Tout en même temps"],1],["Que faut-il avant de passer au palier de croissance suivant ?",["Rien","Qualité stable, équipe formée, trésorerie saine","Un plus grand logo","De nouveaux uniformes"],1],["Pourquoi « grandir trop vite » est-il dangereux ?",["Ce n'est jamais dangereux","Chaque palier non digéré dégrade qualité et trésorerie","Les clients détestent la croissance","C'est illégal"],1],["Que signifie travailler « À » son entreprise ?",["Faire plus d'heures de nettoyage","Bâtir procédures, marque et revenus récurrents qui ne dépendent pas d'une personne","Déménager au bureau","Rien"],1],["Pourquoi déléguer sa comptabilité est-il souvent sage ?",["Ce n'est jamais sage","D'autres le font mieux et le temps du propriétaire vaut plus ailleurs","C'est gratuit","Pour éviter les impôts"],1],["Quelle est la vision ESSOR de l'entrepreneuriat ?",["La croissance à tout prix","Des diplômés qui deviennent employeurs et font grandir leur communauté","Le travail en solo à vie","La concurrence entre diplômés"],1]]}]},{"id":"cleaning-p3-en","lang":"en","badge":"ESSOR Cleaning Academy™ · English · Stream 2","title":"Program 3 — Starting Your Cleaning Business","desc":"The Entrepreneurship stream: business model, legal structure in Ontario, business plan, sales, contracts, hiring and growth. Prerequisite: Program 1 certificate.","duration":"24 hours","level":"Entrepreneurship","modules":[{"num":1,"title":"Cleaning Entrepreneurship: Choosing Your Business Model","duree":"2 hours","objectifs":["Understand the cleaning market and its segments","Compare the possible business models","Honestly assess your entrepreneurial profile"],"chapters":[{"title":"The Cleaning Market: A Real Opportunity","content":["Cleaning is one of the most accessible sectors for starting a business: low start-up investment, constant and recurring demand, predictable monthly revenue per contract, and growth possible at your own pace. But accessibility also attracts a lot of competition — what sets apart the companies that last is professionalism, reliability and disciplined management, exactly what the ESSOR path trains."]},{"title":"Residential or Commercial?","content":[["Residential","Fast start and immediate billing, but a more volatile clientele, less predictable revenue and strong price sensitivity. Ideal for generating your first income quickly."],["Commercial","Recurring contracts (offices, retail, buildings), stable monthly revenue and lasting business relationships, but a longer sales cycle and higher requirements (insurance, proof of seriousness). This is the heart of the ESSOR training and the most solid path to a lasting business."],["The mixed strategy","Many entrepreneurs start in residential to finance their transition to commercial: the two are not mutually exclusive, but they require different sales approaches."]]},{"title":"The Business Models","content":[["Solo (self-employed)","You do everything yourself: income limited by your hours, but minimal expenses and total control. The starting point for the majority."],["Small team","You work and supervise with 2 to 5 employees: the model that breaks the ceiling of your own hours — and the one that requires the Program 2 skills (supervision)."],["Subcontracting","You win the contracts and entrust execution to subcontractors: fast growth possible, but thinner margins and harder quality control."],["Franchise","You buy an existing brand and system: guidance provided, but permanent royalties and reduced freedom. Worth comparing seriously with an independent start."]]},{"title":"The Entrepreneur's Profile","content":["Being an excellent cleaner is not enough to succeed in business: you must also accept selling, managing numbers, living with the uncertainty of the early days and working uneven weeks. Honest self-assessment — my strengths, my gaps, my financial cushion, my family's support — is the first smart business decision. Gaps are not barriers: they indicate what you will need to learn or delegate."]}],"activity":{"label":"Workshop","title":"My Model and My Personal Game Plan","steps":["Each participant completes a self-assessment grid: technical skills, comfort with selling, risk tolerance, financial situation, available time.","Reasoned choice of a starting business model (solo, team, mixed) and a segment (residential, commercial, mixed).","Sharing in pairs and trainer feedback on the realism of each plan."]},"quiz":[["Why is cleaning an accessible sector for starting out?",["There is no competition","Low start-up investment and recurring demand","Contracts are guaranteed by the government","No skills are required"],1],["What sets apart the cleaning companies that last?",["The lowest price","Professionalism, reliability and disciplined management","Luck","The size of the vehicle"],1],["What is the main advantage of the commercial market?",["No requirements","Recurring contracts and stable revenue","A shorter sales cycle","No insurance needed"],1],["What is the main drawback of the solo model?",["Too many expenses","Income is limited by your own hours","Too many employees","No control"],1],["Which model especially requires the supervision skills of Program 2?",["Solo","The small team","The franchise","None"],1],["What is the main trade-off of a franchise?",["Guidance provided in exchange for royalties and reduced freedom","No trade-off","Guaranteed lower prices","Growth impossible"],0],["Why do many start in residential?",["It is more prestigious","To generate income quickly while preparing for commercial","Commercial is forbidden to beginners","No reason"],1],["What is the first smart business decision?",["Buying a new vehicle","An honest self-assessment of your profile","Printing business cards","Lowering your prices"],1]]},{"num":2,"title":"Legal Structure, Registration and Protections (Ontario)","duree":"3 hours","objectifs":["Choose between sole proprietorship and incorporation","Register your business and meet your tax obligations","Protect yourself with the right insurance"],"chapters":[{"title":"Sole Proprietorship or Corporation","content":[["The sole proprietorship","The simplest and cheapest form: you and the business are one. The flip side of simplicity: unlimited personal liability — your personal assets can answer for the business's debts and lawsuits."],["The corporation (incorporation)","A separate legal person: limited liability, possible tax advantages above a certain income level, increased credibility with commercial clients — but higher set-up costs and accounting obligations."],["When to incorporate?","Many start as a sole proprietorship and incorporate when revenue, risks or client requirements justify it. The decision deserves an accountant's advice — this module's content is informational and does not replace professional advice."]]},{"title":"Registering Your Business in Ontario","content":["In Ontario, operating a business under a name other than your personal name requires registering the business name with the Ontario Business Registry (under the Business Names Act). Registration is done online, must be renewed periodically, and does not protect the name like a trademark — it simply makes its use legal and transparent."]},{"title":"Taxes: HST and Tax Obligations","content":["As soon as revenue exceeds the small supplier threshold ($30,000 over four consecutive calendar quarters), HST registration becomes mandatory: you charge the tax, remit it, and recover the tax paid on your purchases (input tax credits). You must also report all business income, keep your supporting documents and set money aside for taxes — tax discipline from the first contract prevents bad surprises."]},{"title":"The Essential Insurance","content":[["Commercial general liability","THE basic protection of commercial cleaning: it covers damage caused at the client's site (breakage, water damage, injury to a third party). Most commercial clients require proof of insurance (often $2M) before even signing."],["Bonding","Protects the client against theft committed by an employee: a trust argument that has become standard in the industry."],["Other protections","Equipment insurance, commercial auto insurance for the work vehicle, and WSIB coverage as soon as you hire employees (see Module 7)."]]},{"title":"Accounts and Professional Image","content":["Separate finances from day one: a distinct business bank account, a card dedicated to business expenses, and professional invoicing (numbered, with business name, contact information and HST number where applicable). This separation simplifies bookkeeping, protects you in a tax audit and projects the seriousness commercial clients look for."]}],"activity":{"label":"Workshop","title":"My Legal Start-Up Checklist","steps":["Using a provided template, each participant builds their personalized checklist: chosen structure, name registration, HST, required insurance, bank account.","Guided research: locating the official sites (Ontario Business Registry, CRA) and the real cost of each step.","Group sharing: building the cohort's collective checklist with a typical timeline."]},"quiz":[["What is the main risk of a sole proprietorship?",["Costs that are too high","Unlimited personal liability","Too much paperwork","The impossibility of having clients"],1],["What is a key advantage of incorporation?",["No accounting obligations","Limited liability","Lifetime tax exemption","A globally protected name"],1],["When must a business name be registered in Ontario?",["Never","As soon as you operate under a name other than your personal name","Only after 5 years","Only for corporations"],1],["Registering the business name…",["Protects the name like a trademark","Makes its use legal but does not protect it like a trademark","Is optional in all cases","Is permanent without renewal"],1],["Above what threshold does HST registration become mandatory?",["$10,000","$30,000 over four consecutive quarters","$100,000","It is never mandatory"],1],["What do input tax credits allow?",["Avoiding charging HST","Recovering the tax paid on business purchases","Doubling your prices","Nothing"],1],["Which insurance do commercial clients most often require?",["Life insurance","Commercial general liability (often $2M)","Travel insurance","None"],1],["What does bonding protect the client against?",["Delays","Theft committed by an employee","Rain","Price increases"],1],["Why separate personal and business accounts?",["Mixing them is illegal in all cases","Accounting simplicity, tax protection and professional image","To have more cards","No reason"],1],["The legal content of this module…",["Replaces a lawyer","Is informational and does not replace professional advice","Is guaranteed error-free forever","Applies everywhere in the world"],1],["What must a professional invoice contain?",["Only the amount","Number, business name, contact information and HST number where applicable","A photo","Nothing in particular"],1],["Which coverage becomes necessary as soon as you hire employees?",["WSIB","Travel insurance","Crop insurance","None"],0]]},{"num":3,"title":"The Business Plan and Start-Up Finances","duree":"3 hours","objectifs":["Write a simple, useful business plan","Budget your start-up and first months","Put healthy financial management in place"],"chapters":[{"title":"A Simple, Living Business Plan","content":["The business plan for a cleaning start-up fits in a few useful pages: who I serve (segment and territory), what I offer (services and frequencies), how I stand out, my prices and costs, my 6-12-24 month goals, and my plan for finding clients. It is not a document for the shelf: it is a decision tool you re-read and adjust every quarter."]},{"title":"Start-Up Costs","content":["A realistic start in light commercial cleaning generally budgets in a few thousand dollars: basic equipment and cart, initial products, insurance (first payment), registration and legal fees, uniforms and image (logo, cards, simple website), and a cushion for the first months. The ESSOR discipline: start small, buy used when sensible, and let contracts finance equipment growth."]},{"title":"Forecasting Revenue and Your Break-Even Point","content":["The break-even point is the monthly revenue that covers all expenses (fixed and variable): knowing it turns anxiety into a numbered goal — \"I need X average contracts to live.\" Forecasts are built prudently: a realistic scenario and a slow scenario, remembering that commercial cleaning often pays at 30 days — that gap must be financed."]},{"title":"Financing the Start-Up","content":["The usual sources: personal savings (the most common and healthiest in cleaning), small business loans and grants (federal and provincial programs, entrepreneur support organizations, programs for newcomers), and an emergency line of credit. The golden rule: in cleaning you can start small — better a small start without crushing debt than a big start deep in debt."]},{"title":"Day-to-Day Financial Management","content":["The habits that save businesses: invoice immediately and follow up on late accounts without embarrassment, record expenses every week (app or spreadsheet), set aside a percentage of every payment for taxes, pay yourself a realistic salary, and look at your numbers every month — revenue, expenses, receivables. A profitable business can die of a simple, badly managed cash-flow problem."]}],"activity":{"label":"Workshop","title":"My Start-Up Budget and Break-Even Point","steps":["Using a provided budget template, each participant prices out their start-up: equipment, insurance, fees, cushion.","Calculating their personal break-even point: monthly expenses (business + minimal personal life) and the number of average contracts needed.","Presentation in pairs: each participant defends the realism of their budget, with trainer feedback."]},"quiz":[["What is a start-up business plan first for?",["Decorating the office","Deciding and adjusting — it is a living tool","Impressing the family","Nothing"],1],["What is the ESSOR discipline for starting equipment?",["Buy everything new on credit","Start small and let contracts finance growth","Buy nothing","Rent a warehouse"],1],["What is the break-even point?",["Closing time","The monthly revenue that covers all expenses","The price of one contract","A mandatory break"],1],["Why must a cash-flow gap be financed in commercial cleaning?",["Clients often pay at 30 days","Banks require it","For fun","No reason"],0],["What is the most common source of financing in cleaning?",["The stock market","Personal savings","Casinos","Government bonds"],1],["What is the golden rule of start-up financing in cleaning?",["Take on maximum debt","Better small without crushing debt than big and indebted","Finance everything by credit card","Avoid all financing"],1],["What should you do with every payment received?",["Spend it all","Set aside a percentage for taxes","Leave it in the personal account","Cash it with no record"],1],["What can a profitable business still die of?",["Too many clients","A badly managed cash-flow problem","Too much quality","Nothing"],1],["How often do you re-read and adjust your business plan?",["Never","Every quarter","Every 10 years","Only once"],1],["How are revenue forecasts built?",["With only the most optimistic scenario","Prudently: a realistic scenario and a slow scenario","By copying a competitor","Randomly"],1]]},{"num":4,"title":"Finding Your First Clients: Sales and Marketing","duree":"4 hours","objectifs":["Define your positioning and territory","Build a professional presence online and offline","Master prospecting and turn bids into contracts"],"chapters":[{"title":"Positioning and Niche","content":["\"General cleaning for everyone\" convinces no one: the businesses that take off choose a precise playing field — professional offices in a given sector, clinics and medical spaces, daycares, condominium buildings, post-construction — and become the local reference for that niche. The niche guides everything: the message, the proof to build, the useful certifications (like the ESSOR path) and the prices."]},{"title":"The Professional Image","content":["Before buying, the commercial client looks for signals of seriousness: a professional name, a clean logo, uniforms, an email address in the company's name (not a generic address), proof of insurance ready to send, and training certificates on display. Every point of contact — email, voicemail, attire, vehicle — confirms or destroys trust."]},{"title":"The Online Presence","content":["The vital minimum: a complete Google Business profile (photos, services, client reviews requested systematically) and a simple one-page website with services, territory, proof and a contact button. Google reviews are the most powerful lever in local cleaning: every satisfied client must be invited to leave one — it is the number one commercial reflex."]},{"title":"Direct Prospecting","content":["The first commercial contracts rarely come on their own: they are won through prospecting — in-person visits to property managers and businesses in the territory, follow-up calls, presence in local business networks, and rescue offers (replacing a supplier who failed is the classic way in). Consistency beats talent: a weekly prospecting rhythm, even a modest one, always ends up producing."]},{"title":"From the Visit to the Winning Bid","content":["Everything Program 2 taught about estimating applies here with one more stake: it is your business. The visit is also for selling — listening to frustrations, asking questions, showing professionalism. The bid goes out within 48 hours, is followed by a polite call, and every refusal becomes information: too expensive? bad timing? satisfied incumbent? You note everything and call back in six months."]},{"title":"Retaining Clients and Leveraging Referrals","content":["Keeping a client costs ten times less than finding a new one: consistent quality, proactive communication and small attentions do the work. Satisfied clients are also your best sales force — asking for a referral or a testimonial is normal and expected in business. A growing portfolio is contracts you keep plus contracts you add."]}],"activity":{"label":"Simulation","title":"My Prospecting Under Real Conditions","steps":["Each participant defines their niche and territory, then writes their 60-second pitch.","Role play: first visit to a property manager (played by a peer, then by the trainer) — introduction, listening, requesting a walk-through.","Role play: follow-up call on a submitted bid, handling a price objection.","Group feedback on the most convincing pitches."]},"quiz":[["Why choose a niche rather than \"everyone\"?",["To limit your income","To become the local reference for a precise segment","Because it is mandatory","No reason"],1],["Which signal destroys a commercial client's trust?",["A clean uniform","An amateur image (generic email, no proof of insurance)","A training certificate","A clear bid"],1],["What is the most powerful online lever in local cleaning?",["TV ads","Google reviews","Paper posters","Postal mail"],1],["What is the number one commercial reflex after good service?",["Waiting","Inviting the client to leave a Google review","Raising the price","Doing nothing"],1],["What is the classic way into a first commercial contract?",["Luck","Replacing a supplier who failed","An inheritance","The lottery"],1],["What \"beats talent\" in prospecting?",["Luck","The consistency of a weekly rhythm","Discounts","Silence"],1],["Within what time does the bid go out after the visit?",["A month","48 hours","Six months","Whenever there is time"],1],["What do you do with a refusal?",["Abandon that client forever","Note the information and call back in six months","Cut the price in half","Get angry"],1],["Why is client retention so profitable?",["Keeping a client costs far less than finding one","It is not","New clients pay more","No reason"],0],["Asking a satisfied client for a referral is…",["Impolite","Normal and expected in business","Forbidden","Useless"],1],["What does the vital online minimum include?",["Nothing","A complete Google Business profile and a simple one-page site","Ten websites","A gaming account"],1],["The assessment visit also serves to…",["Nothing else","Sell: listen, ask questions, show professionalism","Criticize the current supplier","Sign on the spot at any price"],1]]},{"num":5,"title":"Contracts and the Business Client Relationship","duree":"3 hours","objectifs":["Structure a clear, protective service contract","Manage the client relationship as an owner","Protect your profitability over time"],"chapters":[{"title":"The Service Contract","content":["The written contract protects both parties and professionalizes the relationship. Its essential elements: identification of the parties, precise description of services and frequencies by zone (the scope-of-work schedule), price and payment terms, duration and renewal, termination conditions (notice), responsibilities and insurance, and handling of out-of-contract requests. Everything left verbal will eventually be disputed."]},{"title":"The Scope of Work","content":["The scope-of-work schedule is the operational heart of the contract: it lists, zone by zone, what is done and at what frequency. A precise scope prevents task creep (\"while you're at it…\") that silently eats the margin. Any recurring request outside the scope deserves a written amendment — and a price."]},{"title":"Price, Indexation and Renewal","content":["A commercial contract is negotiated with duration in mind: an annual indexation clause (inflation, minimum wage), price revision if the scope changes, and a renewal discussion started months before expiry — never at the last minute. Contracts inherited at prices too low must be renegotiated or, sometimes, let go: keeping a losing contract wears out the team and the cash flow."]},{"title":"The Client Relationship as an Owner","content":["The owner embodies the company: regular walk-throughs with key clients, fast responses to messages, transparency when something goes wrong (warn before the client discovers), and documentation of important exchanges. The social skill that pays the most: knowing how to say no politely — to free out-of-contract requests, to unjustified price cuts, to losing conditions."]},{"title":"When Things Go Wrong: Complaints and Contract Endings","content":["A major complaint is handled like an owner: full listening, apologies if the error is real, a dated correction plan, personal follow-up. A contract ending is handled like a professional: an orderly transition, documented key handover, clean final invoicing — reputation is also built in departures, and today's lost client is sometimes the one who comes back in two years."]}],"activity":{"label":"Case Study","title":"Analyzing and Fixing a Leaky Contract","steps":["A deliberately flawed service contract is provided (vague scope, no indexation, unclear termination).","In teams: identify the holes, assess the concrete risks and draft the corrected clauses.","Final role play: announcing a justified price increase to a \"client\" at contract expiry."]},"quiz":[["Why is a written contract essential?",["For decoration","Everything left verbal will eventually be disputed","It is otherwise illegal in all cases","To use paper"],1],["What is the scope of work?",["The total price","The precise list of services and frequencies by zone","The client's name","The contract duration"],1],["What is \"task creep\"?",["A cleaning technique","Out-of-contract tasks added that eat the margin","A type of floor","A bonus"],1],["What does a recurring out-of-scope request deserve?",["A blunt refusal","A written amendment — and a price","A gift","Silence"],1],["What is an indexation clause for?",["Nothing","Adjusting the price annually (inflation, minimum wage)","Cancelling the contract","Lowering prices"],1],["When do you start the renewal discussion?",["At the last minute","Months before expiry","After expiry","Never"],1],["What do you do with a structurally losing contract?",["Keep it at all costs","Renegotiate it or let it go","Ignore it","Double the hours"],1],["Which social skill pays the owner the most?",["Accepting everything","Knowing how to say no politely","Speaking loudly","Avoiding clients"],1],["How is a major complaint handled?",["By ignoring it","Listening, apologies if real, dated plan, personal follow-up","By blaming the employee in front of the client","By terminating"],1],["Why handle a contract ending well?",["No point","Reputation is also built in departures","For revenge","It is legally required everywhere"],1]]},{"num":6,"title":"Operations: Equipment, Products and Suppliers","duree":"3 hours","objectifs":["Equip yourself intelligently based on your contracts","Manage products, inventory and suppliers","Decide what to do yourself and what to entrust"],"chapters":[{"title":"Equip for Your Contracts, Not the Other Way Around","content":["The classic beginner's mistake: buying equipment before contracts. The healthy logic is the reverse — basic equipment first (cart, commercial vacuum, microfibre, essential products), then every major piece of equipment (auto-scrubber, extractor, floor machine) justified by a contract that pays for it. New, refurbished used and short-term rental each have their place: rental is king for one-off needs."]},{"title":"Choosing and Managing Suppliers","content":["A good cleaning products supplier is a partner: wholesale prices from modest volumes, technical advice, product training and fast troubleshooting. Compare two or three suppliers, negotiate terms (delivery, 30-day credit) and concentrate your purchases to carry more weight: better purchasing terms are direct margin."]},{"title":"Inventory Management","content":["Inventory ties up money and improvisation costs emergency runs: the solution is a minimal inventory with reorder points — when X units remain, you order. A clean, ventilated, organized storage room or corner (products separated by compatibility, first-in-first-out rotation) applies in business what Program 1 taught in technique."]},{"title":"Standardize to Delegate","content":["What is not standardized cannot be delegated: task sheets per site, posted dilutions, cart lists, inspection routines — the tools of Programs 1 and 2 become the internal procedures of YOUR company here. A standardized business can grow and one day be sold; a business that relies on the owner's memory plateaus quickly."]},{"title":"Do It, Hire or Subcontract","content":["Three ways to execute a contract: do it yourself (maximum margin, limited time), hire (quality control, employer obligations — Module 7), or subcontract (speed, reduced margin, harder control — and beware the legal distinction between employee and subcontractor). The right choice depends on the contract, the margin and the strategy: what matters is deciding with the numbers in hand."]}],"activity":{"label":"Workshop","title":"Equipping My First Contract","steps":["Case provided: a 5,000 sq. ft. office contract, 3 evenings a week, has just been signed.","In teams: establish the list of equipment and products needed, with a new vs. used vs. rental budget.","Set the reorder points for consumables and the site's standardized task sheet.","Comparison of budgets between teams and trainer feedback."]},"quiz":[["What is the classic beginner's equipment mistake?",["Buying used","Buying equipment before having the contracts","Renting","Asking for advice"],1],["When is major equipment (auto-scrubber, extractor) justified?",["From day one","When a contract pays for it","Never","When it is on sale"],1],["For a one-off need, the best option is often…",["Buying new","Short
