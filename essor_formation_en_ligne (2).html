-term rental","Abandoning the contract","Borrowing without permission"],1],["What does a good supplier bring beyond products?",["Nothing","Advice, training, troubleshooting and negotiated terms","Vacations","Guaranteed clients"],1],["Why concentrate purchases with few suppliers?",["Out of laziness","To carry more weight and negotiate better terms","It is mandatory","No reason"],1],["What are reorder points for?",["Nothing","Ordering before running out, without overstocking","Paying more","Filling the garage"],1],["Why standardize your procedures?",["To complicate the work","What is not standardized cannot be delegated","To impress","No reason"],1],["What is the risk of a business that relies on the owner's memory?",["None","It plateaus quickly and can neither grow nor be sold","It grows too fast","It pays too much tax"],1]]},{"num":7,"title":"Hiring and Building Your Team","duree":"3 hours","objectifs":["Know when and whom to hire","Meet your employer obligations in Ontario","Retain good employees in a high-turnover sector"],"chapters":[{"title":"When to Hire?","content":["The classic signal: turning down contracts for lack of hands, or working unsustainable weeks. The first hire is a milestone — you go from worker to employer — and it is prepared: a contract that pays for the position, a clear job description, and time set aside to train and supervise (the Program 2 skills become vital here)."]},{"title":"Employee or Subcontractor: The Legal Distinction","content":["Calling someone a \"subcontractor\" is not enough: tax and labour authorities look at the reality — who controls the work, who provides the tools, who bears the financial risk, the exclusivity of the relationship. Misclassifying an employee as a subcontractor exposes you to back deductions, penalties and retroactive contributions. When in doubt: professional advice."]},{"title":"Employer Obligations in Ontario","content":["Hiring in Ontario involves: complying with employment standards (minimum wage, hours, overtime, vacation and leave, termination notice), making source deductions and remittances (income tax, CPP, EI), registering with the WSIB and paying workplace injury insurance premiums, and providing health and safety training (including mandatory awareness training and WHMIS — which your ESSOR graduates already have!)."]},{"title":"Recruiting in Cleaning","content":["Recruiting in cleaning is a permanent challenge: a shifting labour pool, atypical schedules, competition from other employers. What works: word of mouth from good employees (referral bonus), honest postings (schedule, wage, location), a simple interview centred on reliability and attitude — technique can be taught, attitude much less — and reference checks actually done."]},{"title":"Paying, Motivating and Retaining","content":["In a sector known for turnover, retention is a competitive advantage: fair wages paid on time without exception, stable and respected schedules, equipment that works, daily respect, recognition of good work and a prospect of progression (team lead, supervisor — your employees' ESSOR path). Replacing an employee costs dearly in recruiting, training and lost quality: retaining is almost always cheaper."]}],"activity":{"label":"Role Play","title":"My First Hire","steps":["Writing an honest, attractive job posting for an evening cleaner position.","Interview simulation: each participant leads a 10-minute interview centred on reliability and attitude.","Practical case: calculating the real cost of an employee (wages + charges + equipment) and comparing it to the revenue of the targeted contract."]},"quiz":[["What is the classic signal that it is time to hire?",["Boredom","Turning down contracts for lack of hands","Curiosity","Good weather"],1],["What must you have before the first hire?",["A big office","A contract that pays for the position and a clear description","A fleet of vehicles","Nothing"],1],["Who decides the true employee vs. subcontractor nature?",["The title written on the contract","The reality of the relationship (control, tools, risk)","The employee alone","No one"],1],["What is the risk of misclassification?",["None","Back deductions, penalties and retroactive contributions","A parking ticket","A simple warning with no follow-up"],1],["What must an Ontario employer do on every pay?",["Nothing","Source deductions and remittances (income tax, CPP, EI)","Pay cash with no record","Wait until year-end"],1],["What is the WSIB for?",["Vacations","Workplace injury insurance","Marketing","Bookkeeping"],1],["Which hiring criterion is hardest to teach?",["Technique","Attitude","Products","Schedules"],1],["Which recruiting source works best?",["Chance","Word of mouth from good employees (referral bonus)","None","Misleading ads"],1],["Why is retention a competitive advantage?",["It is not","Replacing costs dearly; retaining is almost always cheaper","Clients prefer turnover","No reason"],1],["Which retention element is non-negotiable?",["Free coffee","Wages paid on time, without exception","Parties","Fancy titles"],1],["Which mandatory training do your ESSOR graduates already have?",["None","Health and safety awareness and WHMIS","Piloting","Plumbing"],1],["A referral bonus rewards…",["Seniority","An employee who brings in a good recruit","Lateness","Complaints"],1]]},{"num":8,"title":"Managing, Measuring and Growing Your Business","duree":"3 hours","objectifs":["Install simple, regular management routines","Track the indicators that truly matter","Grow your business without losing control"],"chapters":[{"title":"The Owner's Routines","content":["A small business is steered with routines, not emergencies: every week — invoicing, follow-ups, payroll, prospecting; every month — full numbers (revenue, expenses, margin), key client walk-throughs, team check-in; every quarter — plan review, prices and contracts to revisit. One hour of planned management saves days of crises."]},{"title":"The Indicators That Matter","content":["Five numbers are enough to steer: monthly recurring revenue (the basis of security), margin per contract (which reveals losing contracts), overdue receivables (the silent killer), client retention rate and employee retention rate. Tracked monthly on a single page, they tell you where to act long before problems explode."]},{"title":"Growing Without Breaking","content":["Healthy growth follows an order: first fill your current capacity, then hire on the basis of signed contracts, then add higher-margin services (floors, carpets, disinfection — the Program 2 specialties), and only then expand the territory. Growing too fast kills as surely as not growing: each step must be digested — stable quality, trained team, healthy cash flow — before the next."]},{"title":"Developing Yourself","content":["The business never outgrows its owner for long: keep training (management, sales, technique), surround yourself (mentors, other entrepreneurs, the ESSOR community), delegate what others do better (bookkeeping!) and protect your energy — an exhausted owner makes bad decisions. Entrepreneurship is a marathon: the sustainable pace wins."]},{"title":"The Long-Term Vision","content":["From today, work ON your business, not only IN your business: document procedures, build a brand that does not depend on one person, develop solid recurring revenue. That is what opens tomorrow's options — living comfortably from your business, having others run it, or selling it one day. And that is the ESSOR vision: graduates who become employers and, in turn, help their community grow."]}],"activity":{"label":"Final Workshop","title":"My 90-Day Plan","steps":["Each participant writes their 90-day launch plan: legal steps, budget, minimal equipment, weekly prospecting goal and first revenue target.","Building their personal dashboard: the 5 indicators and their tracking rhythm.","Presentation to the group: each participant commits to their first three concrete actions.","Closing of the path: presentation of attestations and integration into the ESSOR entrepreneur community."]},"quiz":[["How is a small business steered?",["By emergencies","By weekly, monthly and quarterly routines","By luck","With no management at all"],1],["Which indicator is \"the silent killer\"?",["The number of clients","Overdue receivables","The number of employees","The weather"],1],["What does margin per contract reveal?",["Nothing","Losing contracts","The company's age","The size of the vehicle"],1],["What is the basis of the company's financial security?",["One-off contracts","Monthly recurring revenue","The lowest prices","Chance"],1],["What is the right order of growth?",["Expand the territory first","Fill capacity, hire on signed contracts, add high-margin services, then expand","Hire before having contracts","Everything at once"],1],["What is needed before the next growth step?",["Nothing","Stable quality, trained team, healthy cash flow","A bigger logo","New uniforms"],1],["Why is \"growing too fast\" dangerous?",["It never is","Each undigested step degrades quality and cash flow","Clients hate growth","It is illegal"],1],["What does working \"ON\" your business mean?",["Doing more cleaning hours","Building procedures, brand and recurring revenue that do not depend on one person","Moving into the office","Nothing"],1],["Why is delegating your bookkeeping often wise?",["It never is","Others do it better and the owner's time is worth more elsewhere","It is free","To avoid taxes"],1],["What is the ESSOR vision of entrepreneurship?",["Growth at any cost","Graduates who become employers and help their community grow","Solo work for life","Competition between graduates"],1]]}]},{"id":"francais-pro","lang":"fr","badge":"Essor Consulting Group","title":"Français professionnel — Communication au travail","desc":"Un cours pratique pour communiquer avec assurance en milieu de travail : se présenter, comprendre les consignes, parler aux clients et lire les documents de travail.","duration":"6 heures","level":"Débutant / Intermédiaire","modules":[{"num":1,"title":"Se présenter et accueillir en milieu de travail","duree":"1 h 30","objectifs":["Se présenter clairement en contexte professionnel","Saluer et accueillir un client ou un collègue","Utiliser les formules de politesse essentielles"],"chapters":[{"title":"Les salutations professionnelles","content":[["Saluer selon le moment","« Bonjour » s'utilise du matin jusqu'à la fin de l'après-midi ; « Bonsoir » en soirée. En contexte professionnel au Canada, « Bonjour » est la salutation la plus sûre et la plus utilisée, même en fin de journée."],["Tutoiement ou vouvoiement ?","Avec un client, un supérieur ou une personne que l'on rencontre pour la première fois, on utilise « vous » (vouvoiement). Le « tu » (tutoiement) se réserve aux collègues proches, et seulement lorsque la personne l'a proposé."],["Formules d'accueil","« Bonjour, bienvenue chez [nom de l'entreprise]. Comment puis-je vous aider ? » — cette formule simple fonctionne dans presque toutes les situations d'accueil."]]},{"title":"Se présenter en une minute","content":[["La structure de base","Nom + rôle + entreprise : « Bonjour, je m'appelle Marie Dubé. Je suis préposée à l'entretien chez ESSOR. » Court, clair, professionnel."],["Parler de son expérience","Utilisez le passé composé pour vos expériences : « J'ai travaillé deux ans dans un hôtel. » et le présent pour votre poste actuel : « Je travaille maintenant dans les bureaux commerciaux. »"],["Les questions courantes en entrevue","« Parlez-moi de vous », « Quelles sont vos disponibilités ? », « Pourquoi voulez-vous ce poste ? » — préparez une réponse simple de deux ou trois phrases pour chacune."]]}],"activity":{"label":"Exercice pratique","title":"Ma présentation en 60 secondes","steps":["Écrivez votre présentation : nom, rôle, expérience (3 à 4 phrases).","Lisez-la à voix haute trois fois.","Enregistrez-vous avec votre téléphone et réécoutez-vous.","Présentez-vous à un proche et demandez ses commentaires."]},"quiz":[["Quelle salutation convient le mieux avec un nouveau client à 15 h ?",["Salut !","Bonjour","Allô","Hé !"],1],["Avec un supérieur rencontré pour la première fois, on utilise…",["le tutoiement (tu)","le vouvoiement (vous)","aucun pronom","son prénom seulement"],1],["Quelle phrase est correcte pour parler d'une expérience passée ?",["Je travaille deux ans dans un hôtel","J'ai travaillé deux ans dans un hôtel","Je travaillerai deux ans dans un hôtel","Je travaillant deux ans dans un hôtel"],1],["La structure de base d'une présentation professionnelle est :",["Âge + adresse + salaire","Nom + rôle + entreprise","Loisirs + famille + études","Salaire + horaire + vacances"],1],["« Comment puis-je vous aider ? » est une formule…",["d'accueil","d'adieu","d'excuse","de plainte"],0]]},{"num":2,"title":"Le vocabulaire du travail et des consignes","duree":"1 h 30","objectifs":["Comprendre les consignes de travail courantes","Maîtriser le vocabulaire des lieux, des outils et des tâches","Demander une clarification poliment"],"chapters":[{"title":"Comprendre une consigne","content":[["Les verbes de consigne","Nettoyer, vider, passer (l'aspirateur), essuyer, désinfecter, ranger, vérifier, remplacer : ces verbes reviennent constamment dans les consignes de travail. À l'impératif : « Videz les poubelles », « Vérifiez les distributeurs »."],["Les mots de fréquence","Toujours, jamais, chaque jour, une fois par semaine, avant de partir, en arrivant : ces expressions précisent quand faire la tâche. « Désinfectez les poignées de porte chaque jour. »"],["Demander de répéter poliment","« Pouvez-vous répéter, s'il vous plaît ? », « Je ne suis pas sûr d'avoir compris, pouvez-vous me montrer ? » — demander une clarification est un signe de professionnalisme, jamais une faiblesse."]]},{"title":"Le vocabulaire des lieux et du matériel","content":[["Les lieux de travail","Le bureau, la salle de réunion, la cuisine, les toilettes, le hall d'entrée, l'entrepôt, le corridor, l'ascenseur, les escaliers, le stationnement."],["Le matériel courant","La vadrouille, le seau, le chiffon (en microfibre), l'aspirateur, le balai, le porte-poussière, les gants, le chariot d'entretien, le produit nettoyant, le désinfectant."],["Les indications de lieu","Sur, sous, dans, à côté de, derrière, devant, au fond de, à gauche, à droite : « Le produit est dans l'armoire, à gauche de l'évier. »"]]}],"activity":{"label":"Exercice pratique","title":"Dictée de consignes","steps":["Demandez à quelqu'un de vous lire cinq consignes de travail.","Écrivez-les, puis vérifiez l'orthographe ensemble.","Reformulez chaque consigne dans vos propres mots."]},"quiz":[["« Videz les poubelles avant de partir » signifie qu'il faut le faire…",["en arrivant le matin","à la fin du quart de travail","une fois par mois","seulement si on a le temps"],1],["Quel objet sert à laver les planchers ?",["Le chiffon","La vadrouille","Le porte-poussière","Les gants"],1],["Quelle phrase est la façon la plus professionnelle de demander une clarification ?",["Quoi ?","Répète !","Pouvez-vous répéter, s'il vous plaît ?","Je n'ai rien compris."],2],["« Le produit est dans l'armoire, à gauche de l'évier. » Où est le produit ?",["Sur l'évier","Sous l'armoire","Dans l'armoire","Derrière l'évier"],2],["« Chaque jour » est une expression de…",["lieu","fréquence","quantité","politesse"],1]]},{"num":3,"title":"Communiquer avec les clients et les collègues","duree":"1 h 30","objectifs":["Répondre poliment à une demande ou à une plainte","Signaler un problème à son superviseur","Utiliser le téléphone et les messages texte professionnels"],"chapters":[{"title":"Répondre à une demande ou à une plainte","content":[["Rester calme et poli","Face à une plainte : écouter sans interrompre, remercier la personne, proposer une solution. « Merci de me l'avoir signalé. Je m'en occupe tout de suite. »"],["Dire non poliment","Quand une demande dépasse votre rôle : « Je ne suis pas autorisé à faire cela, mais je vais transmettre votre demande à mon superviseur. » On ne dit jamais simplement « non, ce n'est pas mon travail »."],["Les phrases utiles","« Bien sûr, avec plaisir. » · « Je vérifie et je reviens vers vous. » · « Désolé pour ce désagrément. » · « C'est corrigé, merci de votre patience. »"]]},{"title":"Signaler un problème et écrire un message","content":[["Signaler un problème","Structure simple : quoi + où + quand. « Il y a une fuite d'eau dans les toilettes du 2e étage, je l'ai remarquée vers 9 h. » Toujours signaler immédiatement les bris, dégâts et situations dangereuses."],["Le message texte professionnel","Court et complet : « Bonjour M. Tremblay, le ménage du bureau 204 est terminé. La porte est verrouillée. Bonne journée. » On évite les abréviations (svp au lieu de « stp »), et on se relit avant d'envoyer."],["Le courriel simple","Objet clair + salutation + message en 2 ou 3 phrases + formule de fin (« Cordialement », « Merci et bonne journée ») + nom complet."]]}],"activity":{"label":"Simulation","title":"Jeu de rôle : la plainte d'un client","steps":["Avec un partenaire : l'un joue un client mécontent (tache oubliée sur un tapis), l'autre l'employé.","L'employé applique la méthode : écouter, remercier, proposer une solution.","Inversez les rôles, puis discutez de ce qui a bien fonctionné."]},"quiz":[["Face à une plainte d'un client, la première chose à faire est de…",["se défendre","écouter sans interrompre","appeler la police","ignorer la plainte"],1],["Quelle réponse est professionnelle quand une demande dépasse votre rôle ?",["« Non, ce n'est pas mon travail. »","« Débrouillez-vous. »","« Je vais transmettre votre demande à mon superviseur. »","« Demandez à quelqu'un d'autre. »"],2],["Pour signaler un problème, la structure recommandée est :",["quoi + où + quand","qui + combien + pourquoi","salaire + horaire + tâche","nom + âge + adresse"],0],["Dans un message texte professionnel, on doit…",["utiliser beaucoup d'abréviations","écrire court, complet, et se relire","écrire en majuscules","éviter de saluer"],1],["« Désolé pour ce désagrément » sert à…",["s'excuser auprès d'un client","demander une augmentation","refuser une tâche","commencer une réunion"],0]]},{"num":4,"title":"Lire les documents de travail et la sécurité","duree":"1 h 30","objectifs":["Lire une étiquette de produit et une affiche de sécurité","Comprendre un horaire et une feuille de tâches","Connaître le vocabulaire de la santé et sécurité"],"chapters":[{"title":"Étiquettes, pictogrammes et affiches","content":[["Les mots d'avertissement","Danger, attention, corrosif, inflammable, toxique, porter des gants, bien aérer, ne pas mélanger : ces mots sur une étiquette doivent être compris avant d'utiliser un produit."],["Les affiches courantes","« Plancher mouillé », « Sortie de secours », « Interdiction de fumer », « Port des gants obligatoire » : savoir lire ces affiches est une exigence de sécurité au travail."],["En cas de doute","Si vous ne comprenez pas une étiquette ou une consigne de sécurité, arrêtez-vous et demandez. « Je ne comprends pas cette étiquette, pouvez-vous m'expliquer ? » peut éviter un accident."]]},{"title":"Horaires, feuilles de tâches et formulaires","content":[["Lire un horaire","Lun, mar, mer, jeu, ven, sam, dim ; quart de jour, de soir, de nuit ; « de 17 h à 21 h » ; congé, remplacement, temps supplémentaire : le vocabulaire essentiel des horaires."],["La feuille de tâches","Une liste de tâches à cocher : chaque case cochée confirme que la tâche est faite. On coche seulement ce qui est réellement terminé — c'est une question d'honnêteté professionnelle."],["Remplir un formulaire simple","Nom, prénom, date (jour/mois/année), adresse, code postal, numéro de téléphone, signature : savoir remplir ces champs sans aide est un objectif clé de ce module."]]}],"activity":{"label":"Atelier","title":"Lecture d'étiquettes réelles","steps":["Prenez trois produits nettoyants de votre domicile.","Repérez sur chaque étiquette : le mot d'avertissement, les protections exigées, une interdiction.","Écrivez pour chaque produit une phrase : « Ce produit est …, il faut … et il ne faut jamais … »"]},"quiz":[["Que faire si vous ne comprenez pas une étiquette de produit ?",["Utiliser le produit quand même","Arrêter et demander une explication","Jeter le produit","Mélanger avec de l'eau pour l'adoucir"],1],["« Quart de soir » de 17 h à 21 h signifie que vous travaillez…",["le matin","l'après-midi et le soir","la nuit","la fin de semaine seulement"],1],["Sur une feuille de tâches, on coche une case quand…",["on commence la tâche","la tâche est réellement terminée","on n'a pas le temps","le superviseur regarde"],1],["Le mot « inflammable » sur une étiquette indique un produit qui…",["peut prendre feu","est sans danger","sent bon","est comestible"],0],["Quelle affiche avertit d'un risque de glissade ?",["Sortie de secours","Plancher mouillé","Interdiction de fumer","Port des gants obligatoire"],1]]}]}];

/* ---------- storage ---------- */
function loadUsers(){ try{return JSON.parse(localStorage.getItem('essor_lms_users')||'{}')}catch(e){return{}} }
function saveUsers(u){ localStorage.setItem('essor_lms_users', JSON.stringify(u)); }
function sessionEmail(){ return localStorage.getItem('essor_lms_session'); }
function currentUser(){ const e=sessionEmail(); if(!e) return null; return loadUsers()[e]||null; }
function saveUser(u){ const users=loadUsers(); users[u.email]=u; saveUsers(users); }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function courseById(id){ return COURSES.find(c=>c.id===id); }
function prog(u,cid){ u.progress=u.progress||{}; u.progress[cid]=u.progress[cid]||{read:{},scores:{}}; return u.progress[cid]; }
function chapKey(m,ci){ return 'm'+m.num+'c'+ci; }
function moduleDone(u,c,m){ const p=prog(u,c.id); const allRead=m.chapters.every((_,i)=>p.read[chapKey(m,i)]); const q=(m.quiz&&m.quiz.length)?(p.scores[m.num]!==undefined&&p.scores[m.num]>=PASS):true; return allRead&&q; }
function moduleStarted(u,c,m){ const p=prog(u,c.id); return m.chapters.some((_,i)=>p.read[chapKey(m,i)])||p.scores[m.num]!==undefined; }
function coursePct(u,c){
  let total=0,done=0;
  c.modules.forEach(m=>{ total+=m.chapters.length; const p=prog(u,c.id);
    m.chapters.forEach((_,i)=>{ if(p.read[chapKey(m,i)])done++; });
    if(m.quiz&&m.quiz.length){ total++; if(p.scores[m.num]!==undefined&&p.scores[m.num]>=PASS)done++; }
  });
  return total?Math.round(done/total*100):0;
}
function courseComplete(u,c){ return c.modules.every(m=>moduleDone(u,c,m)); }

/* ---------- router ---------- */
let view={name:'auth'};
function go(name,a,b){ view={name,a,b}; render(); window.scrollTo(0,0); }
function render(){
  const app=document.getElementById('app');
  const u=currentUser();
  document.getElementById('userbox').classList.toggle('hidden',!u);
  if(u){ document.getElementById('username').textContent=u.name; document.getElementById('avatar').textContent=(u.name||'?').trim().charAt(0).toUpperCase(); }
  if(!u){ app.innerHTML=authView(); return; }
  if(view.name==='auth') view={name:'dashboard'};
  if(view.name==='dashboard') app.innerHTML=dashView(u);
  else if(view.name==='course') app.innerHTML=courseView(u,courseById(view.a));
  else if(view.name==='module') app.innerHTML=moduleView(u,courseById(view.a),view.b);
  else if(view.name==='quiz') app.innerHTML=quizView(u,courseById(view.a),view.b);
  else if(view.name==='cert') app.innerHTML=certView(u,courseById(view.a));
}

/* ---------- auth ---------- */
let authTab='login';
function authView(){
  return `
  <div class="auth-grid">
    <div class="auth-pitch">
      <h1>Votre espace de <span>formation en ligne</span></h1>
      <p>Suivez les formations du Groupe ESSOR à votre rythme : lisez les modules, validez vos connaissances avec des quiz notés et obtenez votre certificat de réussite.</p>
      <ul>
        <li><span class="chk">✓</span> Programme 1 — Foundations of Professional Cleaning (ESSOR Cleaning Academy™), offert en français et en anglais / available in French and English</li>
        <li><span class="chk">✓</span> Français professionnel — communication au travail</li>
        <li><span class="chk">✓</span> Suivi de progression automatique et quiz de validation</li>
        <li><span class="chk">✓</span> Certificat imprimable à la fin de chaque formation</li>
      </ul>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="${authTab==='login'?'active':''}" onclick="authTab='login';render()">Connexion</button>
        <button class="${authTab==='signup'?'active':''}" onclick="authTab='signup';render()">Inscription</button>
      </div>
      <div class="auth-err" id="autherr"></div>
      ${authTab==='signup'?`
      <div class="frow"><label>Nom complet</label><input id="f-name" placeholder="Votre nom"></div>
      <div class="frow"><label>Code d'accès / Access code</label><input id="f-code" placeholder="Code fourni lors de votre inscription"></div>`:''}
      <div class="frow"><label>Courriel</label><input id="f-email" type="email" placeholder="vous@exemple.com"></div>
      <div class="frow"><label>Mot de passe</label><input id="f-pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="${authTab==='login'?'doLogin()':'doSignup()'}">${authTab==='login'?'Se connecter':'Créer mon compte'}</button>
    </div>
  </div>`;
}
function doSignup(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const pass=document.getElementById('f-pass').value;
  const code=(document.getElementById('f-code').value||'').trim().toUpperCase();
  const err=document.getElementById('autherr');
  if(!name||!email||!pass||!code){ err.textContent='Veuillez remplir tous les champs, y compris le code d\'accès.'; return; }
  if(!ACCESS_CODES.includes(btoa(code))){ err.textContent='Code d\'accès invalide. Contactez ESSOR pour obtenir votre code : essor3cons@gmail.com'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Courriel invalide.'; return; }
  if(pass.length<4){ err.textContent='Mot de passe trop court (4 caractères min.).'; return; }
  const users=loadUsers();
  if(users[email]){ err.textContent='Un compte existe déjà avec ce courriel.'; return; }
  users[email]={name,email,pw:btoa(pass),progress:{},created:new Date().toISOString()};
  saveUsers(users); localStorage.setItem('essor_lms_session',email);
  go('dashboard');
}
function doLogin(){
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const pass=document.getElementById('f-pass').value;
  const err=document.getElementById('autherr');
  const u=loadUsers()[email];
  if(!u||u.pw!==btoa(pass)){ err.textContent='Courriel ou mot de passe incorrect.'; return; }
  localStorage.setItem('essor_lms_session',email);
  go('dashboard');
}
function logout(){ localStorage.removeItem('essor_lms_session'); view={name:'auth'}; render(); }

  <div class="course-grid">
    ${COURSES.map(c=>{

      return `
      <div class="course-card">
        <div class="cc-top"><span class="cc-badge">${esc(c.badge)}</span><h3>${esc(c.title)}</h3></div>
        <div class="cc-body">
          <p>${esc(c.desc)}</p>
          <div class="cc-meta"><span>⏱ ${esc(c.duration)}</span><span>📚 ${c.modules.length} modules</span><span>🎓 ${esc(c.level)}</span></div>
          <div class="plabel"><span>${t.prog}</span><span><b>${pct}%</b></span></div>
          <div class="pbar"><div style="width:${pct}%"></div></div>
          <div class="cc-actions">
            <button class="btn btn-primary btn-sm" onclick="go('course','${c.id}')">${pct===0?t.start:full?t.review:t.cont}</button>
            ${full?`<button class="btn btn-ghost btn-sm" onclick="go('cert','${c.id}')">🎓 ${t.myCert}</button>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- course ---------- */
function courseView(u,c){
  const pct=coursePct(u,c), full=courseComplete(u,c), t=T(c);
  return `
  <div class="crumb"><a href="#" onclick="go('dashboard');return false;">← ${t.dash}</a></div>
  <div class="page-head"><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p></div>
  <div style="max-width:420px;margin-bottom:26px">
    <div class="plabel"><span>${t.globalProg}</span><span><b>${pct}%</b></span></div>
    <div class="pbar"><div style="width:${pct}%"></div></div>
  </div>
  ${full?`<div class="quiz-cta" style="margin-bottom:24px"><h4>${t.completed}</h4><p>${t.congrats}</p><button class="btn btn-primary" onclick="go('cert','${c.id}')">${t.seeCert}</button></div>`:''}
  <div class="mod-list">
    ${c.modules.map(m=>{
      const done=moduleDone(u,c,m), started=moduleStarted(u,c,m);
      const st=done?['st-done',t.done]:started?['st-prog',t.inprog]:['st-todo',t.todo];
      return `
      <div class="mod-item" onclick="go('module','${c.id}',${m.num})">
        <div class="mod-num ${done?'done':''}">${done?'✓':m.num}</div>
        <div class="mod-info"><h4>${t.module} ${m.num} — ${esc(m.title)}</h4><span>⏱ ${esc(m.duree)} · ${m.chapters.length} ${t.chapters}${m.quiz&&m.quiz.length?' · '+t.quizQ.replace('{n}',m.quiz.length):''}</span></div>
        <span class="mod-state ${st[0]}">${st[1]}</span>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- module ---------- */
let openChap=-1;
function courseModule(c,num){ return c.modules.find(m=>m.num===num); }
function moduleView(u,c,num){
  const m=courseModule(c,num); const p=prog(u,c.id); const t=T(c);
  const score=p.scores[m.num];
  return `
  <div class="crumb"><a href="#" onclick="go('dashboard');return false;">${t.dash}</a> › <a href="#" onclick="go('course','${c.id}');return false;">${esc(c.title)}</a> › ${t.module} ${m.num}</div>
  <div class="page-head"><h2>${t.module} ${m.num} — ${esc(m.title)}</h2><p>⏱ ${t.durIndic} : ${esc(m.duree)}</p></div>
  <div class="obj-box"><h4>${t.objectives}</h4><ul>${m.objectifs.map(o=>`<li><span class="chk">✓</span>${esc(o)}</li>`).join('')}</ul></div>
  ${m.chapters.map((ch,i)=>{
    const read=!!p.read[chapKey(m,i)];
    return `
    <div class="chap ${openChap===i?'open':''}" id="chap${i}">
      <div class="chap-head" onclick="toggleChap(${i})">
        <div class="chap-tick ${read?'read':''}">${read?'✓':''}</div>
        <h4>${t.chapitre} ${i+1} · ${esc(ch.title)}</h4>
        <span class="chev">▶</span>
      </div>
      <div class="chap-body">
        ${ch.content.map(item=>Array.isArray(item)?`<p><b>${esc(item[0])}</b> — ${esc(item[1])}</p>`:`<p>${esc(item)}</p>`).join('')}
        ${read?'':`<button class="btn btn-primary btn-sm" onclick="markRead('${c.id}',${m.num},${i})">${t.markRead}</button>`}
      </div>
    </div>`;
  }).join('')}
  ${m.activity?`
  <div class="act-box">
    <span class="tag">${esc(m.activity.label)}</span>
    <h4>${esc(m.activity.title)}</h4>
    <ul>${m.activity.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <div class="note">${t.actNote}</div>
  </div>`:''}
  ${m.quiz&&m.quiz.length?`
  <div class="quiz-cta">
    <h4>${t.modQuiz} ${m.num}</h4>
    <p>${m.quiz.length} ${t.passNote} : ${PASS} %${score!==undefined?'':t.retryHint}</p>
    <button class="btn btn-primary" onclick="go('quiz','${c.id}',${m.num})">${score!==undefined?t.retakeQuiz:t.startQuiz}</button>
    ${score!==undefined?`<br><span class="score-pill ${score>=PASS?'st-done':'st-prog'}" style="border:none">${t.lastScore} : ${score} % ${score>=PASS?t.passed:t.failedRetry}</span>`:''}
  </div>`:''}
  <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="go('course','${c.id}')">${t.backModules}</button>
    ${num<c.modules.length?`<button class="btn btn-primary btn-sm" onclick="openChap=-1;go('module','${c.id}',${num+1})">${t.nextModule}</button>`:''}
  </div>`;
}
function toggleChap(i){ openChap=(openChap===i?-1:i); render(); }
function markRead(cid,mnum,ci){
  const u=currentUser(); const c=courseById(cid); const m=courseModule(c,mnum);
  prog(u,cid).read[chapKey(m,ci)]=true; saveUser(u);
  openChap=(ci+1<m.chapters.length)?ci+1:-1;
  render();
}

/* ---------- quiz ---------- */
let quizState=null;
function quizView(u,c,num){
  const m=courseModule(c,num); const t=T(c);
  if(!quizState||quizState.cid!==c.id||quizState.m!==num){ quizState={cid:c.id,m:num,answers:{},submitted:false,score:0}; }
  const q=m.quiz;
  if(quizState.submitted){
    const pct=quizState.score;
    return `
    <div class="crumb"><a href="#" onclick="quizState=null;go('module','${c.id}',${num});return false;">${t.backModule} ${num}</a></div>
    <div class="quiz-result">
      <div class="big">${pct} %</div>
      <p>${pct>=PASS?t.passMsg:t.failMsg.replace('{p}',PASS)}</p>
    </div>
    ${q.map((qq,qi)=>{
      const sel=quizState.answers[qi];
      return `<div class="qcard"><h4>${qi+1}. ${esc(qq[0])}</h4>
      ${qq[1].map((opt,oi)=>{
        let cls=''; if(oi===qq[2])cls='correct'; else if(sel===oi)cls='wrong';
        return `<div class="qopt ${cls}"><span>${oi===qq[2]?'✓':(sel===oi?'✗':'•')}</span><span>${esc(opt)}</span></div>`;
      }).join('')}</div>`;
    }).join('')}
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="quizState=null;go('module','${c.id}',${num})">${t.backModule}</button>
      ${pct<PASS?`<button class="btn btn-primary btn-sm" onclick="quizState=null;go('quiz','${c.id}',${num})">${t.retry}</button>`:
        (num<c.modules.length?`<button class="btn btn-primary btn-sm" onclick="quizState=null;openChap=-1;go('module','${c.id}',${num+1})">${t.nextModule}</button>`:
        `<button class="btn btn-primary btn-sm" onclick="quizState=null;go('course','${c.id}')">${t.finish}</button>`)}
    </div>`;
  }
  return `
  <div class="crumb"><a href="#" onclick="quizState=null;go('module','${c.id}',${num});return false;">${t.backModule} ${num}</a></div>
  <div class="page-head"><h2>${t.quizTitle} ${num}</h2><p>${q.length} ${t.passNote} : ${PASS} %</p></div>
  ${q.map((qq,qi)=>`
  <div class="qcard"><h4>${qi+1}. ${esc(qq[0])}</h4>
    ${qq[1].map((opt,oi)=>`
    <label class="qopt"><input type="radio" name="q${qi}" ${quizState.answers[qi]===oi?'checked':''} onchange="quizState.answers[${qi}]=${oi}"><span>${esc(opt)}</span></label>`).join('')}
  </div>`).join('')}
  <button class="btn btn-primary" onclick="submitQuiz('${c.id}',${num})">${t.submit}</button>`;
}
function submitQuiz(cid,num){
  const c=courseById(cid); const m=courseModule(c,num); const q=m.quiz;
  const unanswered=q.findIndex((_,qi)=>quizState.answers[qi]===undefined);
  if(unanswered!==-1){ alert(T(c).answerFirst.replace('{n}',unanswered+1)); return; }
  let good=0; q.forEach((qq,qi)=>{ if(quizState.answers[qi]===qq[2])good++; });
  const pct=Math.round(good/q.length*100);
  quizState.submitted=true; quizState.score=pct;
  const u=currentUser(); const p=prog(u,cid);
  if(p.scores[num]===undefined||pct>p.scores[num]) p.scores[num]=pct;
  saveUser(u); render(); window.scrollTo(0,0);
}

/* ---------- certificate ---------- */
function certView(u,c){
  if(!courseComplete(u,c)){ go('course',c.id); return ''; }
  const t=T(c);
  const d=new Date().toLocaleDateString(t.locale,{year:'numeric',month:'long',day:'numeric'});
  return `
  <div class="crumb"><a href="#" onclick="go('course','${c.id}');return false;">${t.backCourse}</a></div>
  <div class="cert">
    <div style="margin-bottom:14px">${c.badge.includes('Cleaning')?`<img src="${LOGO_DATA}" alt="ESSOR Cleaning Academy" style="width:120px;height:auto;margin:0 auto;display:block">`:CONSULTING_MARK}</div>
    <div class="small">${esc(c.badge)}</div>
    <h2>${t.certTitle}</h2>
    <p>${t.certAward}</p>
    <div class="name">${esc(u.name)}</div>
    <p>${t.certFor}</p>
    <div class="course">${esc(c.title)}</div>
    <p>${t.certMeta.replace('{d}',esc(c.duration)).replace('{m}',c.modules.length)}</p>
    <div class="sig-row">
      <div>
        <div class="signame">Jean Marie Mabaka Lusasu</div>
        <div class="sig"><b>Jean Marie Mabaka Lusasu</b> — ${t.certDir}<br>${t.certif} CIMS-GB-060126-100</div>
      </div>
      <div class="sig">${t.certIssued} ${d}</div>
    </div>
  </div>
  <div class="cert-actions"><button class="btn btn-primary" onclick="window.print()">${t.print}</button></div>`;
}

render();
</script>
</body>
</html>
