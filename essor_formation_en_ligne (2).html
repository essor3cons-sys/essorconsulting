<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSOR Formation en ligne — Espace d'apprentissage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#001129; --navy2:#0b2340; --green:#97b425; --green-dark:#6e8a1b;
    --white:#fff; --bg:#f4f6ee; --text:#1a2233; --gray:#5a6472; --border:#e3e8da;
    --red:#c0392b; --shadow:0 10px 30px rgba(0,17,41,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
  a{text-decoration:none;color:inherit}
  button{font-family:'Poppins',sans-serif;cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:600;font-size:14.5px;border:2px solid transparent;transition:all .2s}
  .btn-primary{background:var(--green);color:var(--navy)}
  .btn-primary:hover{background:var(--green-dark);color:#fff}
  .btn-ghost{border-color:var(--navy);color:var(--navy);background:transparent}
  .btn-ghost:hover{background:var(--navy);color:#fff}
  .btn-sm{padding:8px 18px;font-size:13px}
  .hidden{display:none!important}

  /* TOPBAR */
  .topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:100}
  .topbar-in{max-width:1100px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo svg{width:34px;height:34px;flex-shrink:0}
  .logo-t{display:flex;flex-direction:column;line-height:1}
  .logo-t .l1{font-weight:800;font-size:16px;letter-spacing:1px}
  .logo-t .l2{color:var(--green);font-weight:600;font-size:9px;letter-spacing:2.5px;margin-top:3px}
  .userbox{display:flex;align-items:center;gap:12px;font-size:13.5px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .btn-logout{background:none;border:1px solid rgba(255,255,255,.35);color:#cdd6e4;border-radius:999px;padding:6px 14px;font-size:12.5px}
  .btn-logout:hover{border-color:#fff;color:#fff}

  .wrap{max-width:1100px;margin:0 auto;padding:36px 22px 70px}

  /* AUTH */
  .auth-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;min-height:70vh}
  .auth-pitch h1{color:var(--navy);font-size:36px;line-height:1.2;margin-bottom:16px}
  .auth-pitch h1 span{color:var(--green-dark)}
  .auth-pitch p{color:var(--gray);margin-bottom:22px}
  .auth-pitch ul{list-style:none}
  .auth-pitch li{display:flex;gap:10px;margin-bottom:12px;font-size:14.5px}
  .chk{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
  .auth-card{background:#fff;border-radius:20px;padding:34px;box-shadow:var(--shadow);border:1px solid var(--border)}
  .auth-tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--bg);border-radius:999px;padding:5px}
  .auth-tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:999px;font-weight:600;font-size:14px;color:var(--gray)}
  .auth-tabs button.active{background:var(--navy);color:#fff}
  .frow{margin-bottom:16px}
  .frow label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--navy)}
  .frow input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);font-family:'Poppins';font-size:14px;background:var(--bg)}
  .frow input:focus{outline:none;border-color:var(--green)}
  .auth-err{color:var(--red);font-size:13px;margin-bottom:12px;min-height:18px}
  .auth-card .btn{width:100%;justify-content:center}

  /* DASHBOARD */
  .page-head{margin-bottom:28px}
  .page-head h2{color:var(--navy);font-size:26px}
  .page-head p{color:var(--gray);font-size:15px}
  .course-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .course-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column}
  .cc-top{background:var(--navy);color:#fff;padding:24px 26px}
  .cc-badge{display:inline-block;background:rgba(151,180,37,.2);color:var(--green);font-size:11px;font-weight:700;letter-spacing:1px;padding:5px 12px;border-radius:999px;text-transform:uppercase;margin-bottom:12px}
  .cc-top h3{font-size:19px;line-height:1.3}
  .cc-body{padding:22px 26px;flex:1;display:flex;flex-direction:column;gap:14px}
  .cc-body p{color:var(--gray);font-size:14px}
  .cc-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--navy);font-weight:600}
  .cc-meta span{background:var(--bg);border:1px solid var(--border);padding:5px 12px;border-radius:999px}
  .pbar{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
  .pbar>div{height:100%;background:var(--green);border-radius:999px;transition:width .4s}
  .plabel{font-size:12.5px;color:var(--gray);display:flex;justify-content:space-between}
  .cc-actions{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}

  /* COURSE VIEW */
  .crumb{font-size:13px;color:var(--gray);margin-bottom:18px}
  .crumb a{color:var(--green-dark);font-weight:600}
  .mod-list{display:flex;flex-direction:column;gap:14px}
  .mod-item{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);padding:20px 24px;display:flex;align-items:center;gap:18px;cursor:pointer;transition:transform .15s}
  .mod-item:hover{transform:translateX(4px)}
  .mod-num{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--green);color:var(--green-dark);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
  .mod-num.done{background:var(--green);color:#fff}
  .mod-info{flex:1}
  .mod-info h4{color:var(--navy);font-size:15.5px}
  .mod-info span{font-size:12.5px;color:var(--gray)}
  .mod-state{font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;white-space:nowrap}
  .st-todo{background:var(--bg);color:var(--gray);border:1px solid var(--border)}
  .st-prog{background:#fff6e0;color:#a07400;border:1px solid #eedca8}
  .st-done{background:#eef5d8;color:var(--green-dark);border:1px solid #d5e5a5}

  /* MODULE VIEW */
  .obj-box{background:#fff;border-left:5px solid var(--green);border-radius:12px;padding:20px 24px;margin-bottom:22px;box-shadow:var(--shadow)}
  .obj-box h4{color:var(--navy);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
  .obj-box li{display:flex;gap:9px;font-size:14px;margin-bottom:7px;list-style:none}
  .chap{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  .chap-head{padding:18px 22px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .chap-head:hover{background:#fafbf6}
  .chap-head h4{color:var(--navy);font-size:15px;flex:1}
  .chap-tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
  .chap-tick.read{background:var(--green);border-color:var(--green)}
  .chev{color:var(--gray);transition:transform .2s;font-size:12px}
  .chap.open .chev{transform:rotate(90deg)}
  .chap-body{display:none;padding:0 24px 22px;border-top:1px solid var(--border)}
  .chap.open .chap-body{display:block}
  .chap-body p{font-size:14.5px;color:var(--text);margin-top:14px}
  .chap-body p b{color:var(--navy)}
  .chap-body .btn{margin-top:18px}
  .act-box{background:var(--navy);color:#fff;border-radius:14px;padding:22px 26px;margin:22px 0}
  .act-box .tag{color:var(--green);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
  .act-box h4{color:#fff;font-size:16px;margin:6px 0 10px}
  .act-box li{font-size:13.5px;color:#c3cddd;margin-bottom:6px;margin-left:18px}
  .act-box .note{font-size:12px;color:#8fa0ba;margin-top:12px;font-style:italic}
  .quiz-cta{background:#fff;border:2px dashed var(--green);border-radius:14px;padding:24px;text-align:center;margin-top:24px}
  .quiz-cta h4{color:var(--navy);margin-bottom:8px}
  .quiz-cta p{color:var(--gray);font-size:13.5px;margin-bottom:16px}
  .score-pill{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:6px 16px;border-radius:999px}

  /* QUIZ */
  .qcard{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);padding:24px;margin-bottom:18px}
  .qcard h4{color:var(--navy);font-size:15.5px;margin-bottom:14px}
  .qopt{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:9px;cursor:pointer;font-size:14px;transition:border-color .15s}
  .qopt:hover{border-color:var(--green)}
  .qopt input{margin-top:4px;accent-color:var(--green-dark)}
  .qopt.correct{border-color:var(--green);background:#eef5d8}
  .qopt.wrong{border-color:var(--red);background:#fdecea}
  .quiz-result{background:var(--navy);color:#fff;border-radius:14px;padding:26px;text-align:center;margin-bottom:20px}
  .quiz-result .big{font-size:38px;font-weight:800;color:var(--green)}
  .quiz-result p{color:#c3cddd;font-size:14px}

  /* CERTIFICATE */
  .cert{background:#fff;border:10px solid var(--navy);border-radius:6px;padding:50px 40px;text-align:center;position:relative;max-width:820px;margin:0 auto}
  .cert::after{content:"";position:absolute;inset:10px;border:2px solid var(--green);pointer-events:none}
  .cert .small{letter-spacing:3px;font-size:12px;color:var(--gray);text-transform:uppercase}
  .cert h2{color:var(--navy);font-size:30px;margin:14px 0 4px}
  .cert .name{font-size:34px;color:var(--green-dark);font-weight:800;margin:18px 0}
  .cert .course{font-size:18px;color:var(--navy);font-weight:600;margin-bottom:14px}
  .cert p{color:var(--gray);font-size:14px}
  .cert .sig-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;padding:0 30px}
  .cert .sig{border-top:1.5px solid var(--navy);padding-top:8px;font-size:12.5px;color:var(--gray);min-width:220px}
  .cert .signame{font-family:'Great Vibes',cursive;font-size:34px;color:var(--navy);line-height:1;margin-bottom:4px}
  .cert .sig b{color:var(--navy)}
  .cert-actions{text-align:center;margin-top:26px}

  footer{background:var(--navy);color:#8fa0ba;text-align:center;padding:22px;font-size:12.5px}
  footer b{color:var(--green)}

  @media(max-width:860px){
    .auth-grid,.course-grid{grid-template-columns:1fr}
    .auth-grid{min-height:auto;gap:34px;padding-top:10px}
    .cert{padding:34px 18px}
    .cert .sig-row{flex-direction:column;gap:22px;align-items:center}
  }
  @media print{
    .topbar,footer,.cert-actions,.crumb{display:none!important}
    body{background:#fff}
    .wrap{padding:0;max-width:none}
  }
</style>
</head>

  <div class="topbar-in">
    <a href="#" class="logo" onclick="go('dashboard');return false;">
      <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" stroke="#97b425" stroke-width="2"/><path d="M12 30 L18 18 L24 26 L30 14 L36 22" stroke="#97b425" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="22" r="3" fill="#97b425"/></svg>
      <span class="logo-t"><span class="l1">ESSOR</span><span class="l2">FORMATION EN LIGNE</span></span>
    </a>
    <div class="userbox hidden" id="userbox">
      <div class="avatar" id="avatar">?</div>
      <span id="username"></span>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
const COURSES = [{"id":"cleaning-p1","lang":"fr","badge":"ESSOR Cleaning Academy™ · Français","title":"Programme 1 — Foundations of Professional Cleaning","desc":"La formation complète de 2 jours (16 heures) pour débuter dans le nettoyage professionnel : industrie, produits, techniques, sécurité, service à la clientèle et certification.","duration":"16 heures","level":"Débutant","modules":[{"num":1,"title":"Bienvenue dans l'industrie du nettoyage professionnel","duree":"2 heures","objectifs":["Comprendre l'industrie du nettoyage professionnel","Connaître les différents secteurs d'activité","Identifier les qualités d'un professionnel du nettoyage","Comprendre le rôle du nettoyeur commercial"],"chapters":[{"title":"Mot du fondateur","content":[["Pourquoi ESSOR Cleaning Academy ?","ESSOR Cleaning Academy est né d'un constat simple : le nettoyage professionnel est un métier essentiel, trop souvent sous-estimé et peu valorisé, alors qu'il exige de vraies compétences techniques, de la rigueur et un grand sens du service. Notre académie a été créée pour redonner à ce métier la reconnaissance qu'il mérite, et pour offrir à chaque participant un vrai tremplin : un emploi stable, puis, pour ceux qui le souhaitent, leur propre entreprise."],["Notre mission","Former des professionnels compétents, fiers de leur métier, et outiller les entrepreneurs de demain avec les connaissances, les outils et l'accompagnement nécessaires pour réussir dans l'industrie du nettoyage commercial."],["Notre vision","Devenir la référence en formation professionnelle dans l'industrie du nettoyage au Canada, reconnue pour l'excellence de ses diplômés et la réussite des entreprises qu'elle a contribué à lancer."],["Notre philosophie","Apprendre en faisant. Chaque participant progresse à son rythme, dans un environnement pratique, bienveillant et exigeant à la fois. Aucun participant n'est laissé pour compte : la réussite de chacun contribue à la réussite collective de la communauté ESSOR."]]},{"title":"L'industrie du nettoyage au Canada","content":[["Historique","Longtemps perçu comme un travail informel et peu structuré, le nettoyage professionnel s'est transformé en une véritable industrie de services au cours des dernières décennies. L'arrivée de normes reconnues (comme les standards ISSA et CIMS), la professionnalisation des équipes et une attention accrue à l'hygiène — accélérée par la pandémie — ont fait de ce secteur un domaine en pleine croissance et de plus en plus exigeant sur le plan des compétences."],["Les chiffres du marché","Selon les estimations de l'industrie, le nettoyage commercial et résidentiel représente aujourd'hui l'un des plus importants secteurs d'emploi au sein des services aux entreprises au Canada, avec une demande constante d'entreprises et de travailleurs qualifiés. La croissance de l'immobilier commercial, le vieillissement de la population et les nouvelles exigences sanitaires continuent d'alimenter cette demande."],["Les différents employeurs","Les diplômés peuvent travailler pour des entreprises de nettoyage commercial, des sociétés de gestion immobilière, des établissements de santé, des institutions scolaires ou gouvernementales, ou encore démarrer leur propre entreprise de nettoyage en tant que travailleur autonome ou entrepreneur."],["Les perspectives de carrière","Le parcours typique mène du poste de nettoyeur à celui de superviseur d'équipe, puis de gestionnaire de contrat, avec la possibilité, à terme, de devenir propriétaire de sa propre entreprise de nettoyage commercial — exactement le parcours proposé par les filières Opérations et Entrepreneuriat d'ESSOR Cleaning Academy™."]]},{"title":"Les secteurs d'activité","content":[["Bureaux","Entretien courant des espaces de travail, salles de réunion, cuisinettes et sanitaires, généralement en dehors des heures d'ouverture."],["Immeubles résidentiels","Entretien des aires communes (halls, corridors, ascenseurs, buanderies) dans les copropriétés et immeubles à logements multiples."],["Garderies","Désinfection renforcée et produits adaptés à la présence d'enfants en bas âge, avec une attention particulière à la sécurité des produits utilisés."],["Écoles","Entretien des salles de classe, gymnases, cafétérias et sanitaires, souvent selon un horaire strict entre les périodes scolaires."],["Centres communautaires","Entretien d'espaces polyvalents à fort achalandage, nécessitant flexibilité et réactivité."],["Résidences pour personnes âgées","Normes d'hygiène élevées, sensibilité aux produits utilisés, attention et respect envers une clientèle vulnérable."],["Refuges","Environnements exigeant rigueur sanitaire, discrétion et une approche humaine et respectueuse."],["Commerces","Entretien d'espaces de vente, vitrines et aires de service à la clientèle, souvent en dehors des heures d'affaires."],["Entrepôts","Grandes surfaces, entretien des planchers industriels, gestion de la poussière et des débris."],["Industrie légère","Entretien d'espaces de production, avec des exigences particulières liées à la sécurité et parfois à des protocoles spécifiques (aires alimentaires, zones contrôlées)."]]},{"title":"Le rôle du professionnel","content":[["Responsabilités","Exécuter les tâches assignées selon les standards de qualité établis, respecter les horaires et signaler toute anomalie (bris, dommage, produit manquant)."],["Attitude","Faire preuve de rigueur, d'autonomie et d'une attitude positive, même face aux imprévus ou aux tâches répétitives."],["Présentation","Porter une tenue propre et appropriée, respecter les normes d'hygiène personnelle et représenter dignement l'entreprise chez le client."],["Communication","Échanger clairement avec les collègues, les superviseurs et les clients, et signaler rapidement tout problème rencontré."],["Travail d'équipe","Collaborer efficacement avec les autres membres de l'équipe, partager l'information utile et s'entraider pour respecter les échéanciers."],["Éthique","Faire preuve d'honnêteté, respecter le matériel et les lieux du client, et ne jamais s'approprier de biens ou d'informations rencontrés sur les lieux de travail."],["Confidentialité","Respecter la vie privée du client et de ses occupants, ne jamais divulguer ou utiliser des informations vues ou entendues durant un mandat."]]}],"activity":{"label":"Atelier","title":"Pourquoi avez-vous choisi cette profession ?","steps":["En groupe ou individuellement, chaque participant partage en 2 à 3 minutes ce qui l'a motivé à suivre cette formation.","Le formateur anime une discussion sur les motivations communes du groupe et les relie aux qualités professionnelles vues au chapitre 4.","Objectif : créer un sentiment d'appartenance dès le départ et donner du sens à l'apprentissage."]},"quiz":[["Quelle est la mission d'ESSOR Cleaning Academy™ ?",["Vendre des produits de nettoyage","Former des professionnels et outiller les entrepreneurs","Gérer des immeubles","Offrir des services de sécurité"],1],["Quel évènement récent a accéléré la professionnalisation de l'industrie du nettoyage ?",["La crise financière de 2008","La pandémie","L'automatisation","La déréglementation du travail"],1],["Lequel n'est PAS un employeur typique d'un diplômé en nettoyage professionnel ?",["Entreprise de nettoyage commercial","Établissement de santé","Agence de voyage","Institution scolaire"],2],["Quel est le parcours de carrière typique dans l'industrie ?",["Nettoyeur → superviseur → gestionnaire de contrat → entrepreneur","Superviseur → nettoyeur","Entrepreneur → nettoyeur","Aucun avancement possible"],0],["Dans quel secteur la désinfection renforcée et la sécurité des produits sont-elles particulièrement importantes ?",["Entrepôts","Garderies","Bureaux","Commerces"],1],["Quelle qualité concerne le respect de la vie privée du client ?",["Ponctualité","Confidentialité","Présentation","Travail d'équipe"],1],["Que doit faire un professionnel qui constate un bris chez un client ?",["L'ignorer","Le réparer lui-même sans le signaler","Le signaler à son superviseur","Le cacher"],2],["Quel secteur nécessite une attention particulière envers une clientèle vulnérable et âgée ?",["Résidences pour personnes âgées","Entrepôts","Industrie légère","Bureaux"],0],["Laquelle de ces attitudes est attendue d'un professionnel du nettoyage ?",["Attitude négative face aux imprévus","Autonomie et rigueur","Indifférence aux horaires","Manque de communication"],1],["Quelle est la philosophie pédagogique d'ESSOR Cleaning Academy™ ?",["Apprendre uniquement par la théorie","Apprendre en faisant","Apprentissage individuel sans accompagnement","Aucune philosophie particulière"],1]]},{"num":2,"title":"Santé, sécurité et prévention","duree":"2 heures","objectifs":["Comprendre les risques liés au métier","Prévenir les accidents de travail","Travailler en toute sécurité au quotidien"],"chapters":[{"title":"Introduction à la santé sécurité","content":["La santé et la sécurité au travail (SST) visent à protéger l'intégrité physique et psychologique des travailleurs. Dans le domaine du nettoyage, les risques sont nombreux : produits chimiques, équipement, surfaces glissantes, manutention. Chaque professionnel a la responsabilité de connaître ces risques, d'appliquer les mesures de prévention et de signaler toute situation dangereuse à son superviseur."]},{"title":"SIMDUT (WHMIS)","content":["Le Système d'information sur les matières dangereuses utilisées au travail (SIMDUT) encadre l'étiquetage et la communication des dangers liés aux produits chimiques. Chaque produit dangereux doit porter une étiquette normalisée avec pictogrammes, et être accompagné d'une fiche de données de sécurité (FDS) précisant sa composition, ses dangers et les mesures d'urgence à connaître avant toute utilisation."]},{"title":"Produits chimiques","content":["Certains produits de nettoyage peuvent être irritants, corrosifs ou toxiques s'ils sont mal utilisés ou mélangés. Il est essentiel de lire les étiquettes, de respecter les dilutions recommandées et de ne jamais mélanger deux produits sans connaître leur compatibilité, certains mélanges pouvant dégager des gaz dangereux."]},{"title":"Équipement de protection individuelle","content":["Les équipements de protection individuelle (EPI) — gants, lunettes, masques, chaussures antidérapantes — réduisent les risques d'exposition et de blessure. Le choix de l'EPI dépend de la tâche et du produit utilisé; il doit être inspecté avant chaque usage et remplacé dès qu'il est endommagé."]},{"title":"Prévention des glissades","content":["Les planchers mouillés sont une cause fréquente d'accident. Il faut toujours signaler les zones lavées à l'aide d'affiches ou de cônes, travailler par section pour laisser un passage sec, et porter des chaussures avec semelles antidérapantes."]},{"title":"Prévention des chutes","content":["Les chutes de hauteur (escabeau, escalier, surface en dénivelé) peuvent être évitées par l'utilisation d'équipement adéquat, la vérification de la stabilité avant de monter, et le respect des limites de charge et de hauteur recommandées par le fabricant."]},{"title":"Sécurité électrique","content":["L'utilisation d'équipement électrique (aspirateurs, autolaveuses) exige de vérifier l'état des fils et des prises avant chaque usage, d'éviter le contact avec l'eau, et de débrancher l'équipement avant tout entretien de la machine elle-même."]},{"title":"Manutention","content":["Le levage et le déplacement de charges (chariots, contenants, mobilier) doivent respecter des techniques sécuritaires : plier les genoux, garder le dos droit, rapprocher la charge du corps, et demander de l'aide pour les charges lourdes ou encombrantes."]},{"title":"Premiers soins","content":["En cas de blessure mineure, il est important de connaître l'emplacement de la trousse de premiers soins et la marche à suivre de base (nettoyer, protéger la plaie), tout en informant rapidement son superviseur pour toute blessure, même mineure."]},{"title":"Situations d'urgence","content":["Chaque lieu de travail possède des procédures d'urgence propres (incendie, évacuation, déversement majeur). Il est essentiel de connaître les sorties, les points de rassemblement et la personne à contacter en cas d'urgence avant de commencer un mandat."]},{"title":"Violence au travail","content":["La violence au travail peut prendre plusieurs formes : verbale, physique ou psychologique. Tout professionnel a le droit d'évoluer dans un environnement sécuritaire et doit signaler immédiatement toute situation de violence à son superviseur."]},{"title":"Harcèlement","content":["Le harcèlement, qu'il soit sexuel, psychologique ou discriminatoire, n'a pas sa place dans l'industrie. Les participants apprennent à reconnaître les comportements inacceptables et les recours disponibles pour signaler une situation de harcèlement."]},{"title":"Accessibilité (AODA)","content":["La Loi sur l'accessibilité pour les personnes handicapées de l'Ontario (AODA) impose des normes de service et d'accessibilité. Le professionnel du nettoyage doit être sensibilisé à ces normes, notamment lorsqu'il travaille dans des lieux fréquentés par des personnes en situation de handicap."]}],"activity":{"label":"Atelier","title":"Identifier les risques","steps":["À partir de photos ou de mises en situation présentées par le formateur, les participants identifient les risques présents (produit mal étiqueté, plancher mouillé non signalé, EPI manquant, etc.).","Cas pratique : en sous-groupes, les participants analysent un scénario d'accident évitable et proposent les mesures de prévention appropriées.","Retour en groupe et discussion des solutions proposées."]},"quiz":[["Que signifie SIMDUT ?",["Système d'inspection des matières dangereuses","Système d'information sur les matières dangereuses utilisées au travail","Service intégré de matériel dangereux","Aucune de ces réponses"],1],["Que doit-on trouver sur l'étiquette d'un produit dangereux ?",["Uniquement le prix","Des pictogrammes de danger normalisés","Le nom du fabricant seulement","Rien de particulier"],1],["Que faut-il vérifier avant de mélanger deux produits chimiques ?",["Leur couleur","Leur compatibilité","Leur odeur","Leur prix"],1],["Lequel de ces éléments est un équipement de protection individuelle ?",["Un chariot","Des gants","Une vadrouille","Un aspirateur"],1],["Comment doit-on signaler un plancher fraîchement lavé ?",["Ne rien faire","Avec une affiche ou un cône","En avertissant seulement à voix haute","Ce n'est pas nécessaire"],1],["Quelle est une bonne pratique avant de monter sur un escabeau ?",["Vérifier sa stabilité","L'utiliser peu importe son état","Monter rapidement","Ne rien vérifier"],0],["Avant d'utiliser un équipement électrique, il faut :",["L'utiliser immédiatement","Vérifier l'état des fils et des prises","Le mouiller","L'ignorer"],1],["Quelle est la bonne technique de levage d'une charge lourde ?",["Plier le dos, jambes droites","Plier les genoux, dos droit","Lever avec les bras seulement","Aucune technique particulière"],1],["Que doit-on faire en cas de blessure, même mineure ?",["L'ignorer","Informer son superviseur","Continuer le travail sans rien dire","Quitter sans avertir"],1],["Que doit-on connaître avant de commencer un mandat dans un nouvel édifice ?",["Les sorties et procédures d'urgence","Le nom de tous les employés","L'historique de l'entreprise","Rien de particulier"],0],["Que faire face à une situation de violence au travail ?",["Ne rien dire","La signaler immédiatement à son superviseur","Régler la situation seul avec violence","Quitter son emploi sans explication"],1],["Le harcèlement au travail peut être :",["Uniquement physique","Verbal, psychologique ou discriminatoire","Toujours sans conséquence","Acceptable si involontaire"],1],["Que signifie AODA ?",["Une norme de dilution des produits","Une loi sur l'accessibilité pour les personnes handicapées en Ontario","Un type d'équipement","Un syndicat"],1],["Quel est l'objectif principal de la santé et sécurité au travail ?",["Réduire les coûts","Protéger l'intégrité physique et psychologique des travailleurs","Augmenter la vitesse de travail","Aucun objectif particulier"],1],["Qui doit signaler une situation dangereuse observée sur les lieux de travail ?",["Uniquement le superviseur","Chaque professionnel du nettoyage","Personne","Seulement le client"],1],["Quel document accompagne un produit chimique dangereux ?",["Une facture","Une fiche de données de sécurité (FDS)","Un manuel d'utilisateur générique","Aucun document"],1],["Quel type de chaussures est recommandé pour prévenir les glissades ?",["Chaussures à talons","Chaussures avec semelles antidérapantes","Sandales","Peu importe le type"],1],["Que faut-il faire avant d'entretenir la partie électrique d'une machine ?",["La débrancher","La laisser branchée","L'utiliser sous l'eau","Rien de particulier"],0],["Quelle est une conséquence possible du non-respect des dilutions recommandées ?",["Aucun risque","Dégagement possible de gaz dangereux ou produit inefficace","Amélioration du résultat","Économie garantie"],1],["Quelle attitude est attendue si un participant est témoin de harcèlement envers un collègue ?",["Ignorer la situation","Encourager le comportement","Signaler la situation","Se moquer avec le groupe"],2]]},{"num":3,"title":"Produits de nettoyage","duree":"2 heures","objectifs":["Comprendre les différentes familles de produits","Choisir le bon produit selon la tâche","Éviter les erreurs d'utilisation et de mélange"],"chapters":[{"title":"Les différents produits","content":["Les produits de nettoyage se regroupent en grandes familles selon leur fonction : nettoyants généraux, désinfectants, dégraissants, décapants et neutralisants. Bien connaître ces familles permet de choisir le bon produit selon la surface et le résultat recherché, plutôt que d'utiliser un seul produit pour tout."]},{"title":"Le pH","content":["Le pH mesure le niveau d'acidité ou d'alcalinité d'un produit, sur une échelle de 0 à 14. Un produit acide (pH bas) est efficace contre le tartre et la rouille; un produit alcalin (pH élevé) est efficace contre la graisse. Connaître le pH permet d'éviter d'endommager certaines surfaces sensibles."]},{"title":"Les désinfectants","content":["Les désinfectants éliminent les bactéries, virus et autres micro-organismes présents sur une surface déjà nettoyée. Leur efficacité dépend du respect du temps de contact (dwell time) indiqué sur l'étiquette : appliquer, puis laisser agir le temps recommandé avant d'essuyer."]},{"title":"Les nettoyants","content":["Les nettoyants généraux retirent la saleté courante (poussière, traces, résidus légers) sans nécessairement désinfecter. Ils conviennent à l'entretien quotidien des surfaces peu à risque comme les bureaux ou les meubles."]},{"title":"Les dégraissants","content":["Les dégraissants sont conçus pour dissoudre les résidus gras, notamment en cuisine ou sur les équipements industriels. Ils sont généralement alcalins et doivent être rincés soigneusement pour éviter les résidus glissants."]},{"title":"Les décapants","content":["Les décapants retirent les couches de cire ou de finis accumulés sur un plancher avant une nouvelle application. Ce sont des produits puissants qui exigent une bonne ventilation et le port d'équipement de protection adapté."]},{"title":"Les neutralisants","content":["Les neutralisants ramènent une surface à un pH neutre après l'utilisation d'un produit acide ou alcalin puissant, ce qui protège la surface et prépare une prochaine étape (comme l'application d'un fini de plancher)."]},{"title":"Les produits écologiques","content":["Les produits écologiques réduisent l'impact environnemental et les risques pour la santé, tout en respectant des certifications reconnues (comme Ecologo ou Green Seal). Ils sont de plus en plus exigés par les clients soucieux de développement durable."]},{"title":"Les dilutions","content":["La majorité des produits professionnels sont concentrés et doivent être dilués selon un ratio précis, indiqué sur l'étiquette. Un produit trop concentré peut endommager les surfaces ou représenter un risque, tandis qu'un produit trop dilué perd son efficacité."]},{"title":"L'entreposage","content":["Les produits doivent être entreposés dans un endroit ventilé, à l'abri de la chaleur et de la lumière directe, dans leur contenant d'origine ou clairement étiqueté, et séparés selon leur compatibilité chimique."]},{"title":"Les incompatibilités","content":["Certains produits ne doivent jamais être mélangés, comme l'eau de Javel et l'ammoniaque, qui produisent un gaz toxique. Toujours vérifier la fiche de données de sécurité avant de combiner ou d'utiliser successivement deux produits différents."]}],"activity":{"label":"Laboratoire","title":"Préparer les solutions","steps":["Chaque participant apprend à lire l'étiquette d'un produit concentré et à calculer le ratio de dilution requis.","Démonstration et pratique de la préparation sécuritaire d'une solution à l'aide d'un poste de dilution ou d'une bouteille graduée.","Vérification par le formateur de chaque solution préparée."]},"quiz":[["Quelle famille de produit sert à éliminer les bactéries et virus ?",["Nettoyant","Désinfectant","Neutralisant","Décapant"],1],["Un produit avec un pH élevé est plutôt efficace contre :",["Le tartre","La rouille","La graisse","Le verre"],2],["Que signifie le « temps de contact » (dwell time) ?",["Le temps de séchage","Le temps que le produit doit rester sur la surface pour être efficace","Le temps de transport","Aucune importance"],1],["Quel produit retire les couches de cire accumulées sur un plancher ?",["Nettoyant général","Décapant","Neutralisant","Désinfectant"],1],["Pourquoi utilise-t-on un neutralisant ?",["Pour parfumer une pièce","Pour ramener une surface à un pH neutre","Pour désinfecter","Pour dégraisser"],1],["Que faut-il vérifier avant de diluer un produit concentré ?",["Sa couleur","Le ratio de dilution recommandé sur l'étiquette","Son prix","Rien de particulier"],1],["Où doivent être entreposés les produits de nettoyage ?",["N'importe où","Dans un endroit ventilé, à l'abri de la chaleur, bien étiquetés","Dans un contenant non identifié","En plein soleil"],1],["Quel mélange est dangereux et peut produire un gaz toxique ?",["Eau et nettoyant","Eau de Javel et ammoniaque","Deux désinfectants identiques","Eau et savon"],1],["Un produit écologique certifié permet de :",["Réduire l'impact environnemental et les risques pour la santé","Nettoyer plus vite dans tous les cas","Remplacer tous les équipements","Éviter toute dilution"],0],["Que risque-t-on si un produit est utilisé trop concentré ?",["Aucun risque","Endommager la surface ou représenter un risque pour la santé","Une meilleure efficacité garantie","Une économie automatique"],1]]},{"num":4,"title":"Les équipements","duree":"2 heures","objectifs":["Reconnaître les principaux équipements de nettoyage","Utiliser chaque équipement correctement et sécuritairement","Entretenir l'équipement pour en prolonger la durée de vie"],"chapters":[{"title":"Aspirateur","content":["L'aspirateur retire la poussière, les saletés sèches et les débris des planchers, tapis et tissus. Il existe des modèles à réservoir, à sac ou dorsaux; le choix du bon filtre et le vidage régulier du réservoir sont essentiels à son efficacité."]},{"title":"Autolaveuse","content":["L'autolaveuse lave, frotte et sèche les grandes surfaces de plancher en une seule passe. Elle augmente considérablement l'efficacité sur les grandes superficies (entrepôts, corridors) et nécessite un entretien régulier des réservoirs et des brosses."]},{"title":"Polisseuse","content":["La polisseuse permet de lustrer, décaper ou récurer les planchers selon le type de brosse ou de tampon utilisé. Elle demande une bonne maîtrise du geste pour éviter d'endommager la surface."]},{"title":"Extracteur","content":["L'extracteur à eau chaude est utilisé pour le nettoyage en profondeur des tapis et des tissus, en injectant une solution puis en l'extrayant avec la saleté qu'elle contient."]},{"title":"Balai","content":["Le balai reste l'outil de base pour le dépoussiérage rapide des planchers avant un lavage humide. Le choix des fibres (souples ou rigides) dépend du type de surface."]},{"title":"Vadrouille","content":["La vadrouille sert au lavage humide des planchers. Les modèles à microfibre offrent un meilleur ramassage de la saleté et nécessitent moins d'eau que les vadrouilles traditionnelles."]},{"title":"Microfibres","content":["Les chiffons et mopes en microfibre captent efficacement la poussière et les bactéries grâce à leurs fibres fines. Un code de couleur (par zone ou par usage) permet d'éviter la contamination croisée entre les différentes surfaces."]},{"title":"Chariot","content":["Le chariot de nettoyage permet de transporter de façon organisée les produits, outils et sacs à déchets nécessaires à un mandat, réduisant les déplacements inutiles et améliorant l'efficacité."]},{"title":"Outils manuels","content":["Raclettes, brosses, grattoirs et autres outils manuels complètent l'équipement motorisé pour les tâches ponctuelles ou les surfaces difficiles d'accès."]}],"activity":{"label":"Atelier","title":"Inspection quotidienne","steps":["Les participants apprennent à réaliser une inspection visuelle et fonctionnelle de chaque équipement avant son utilisation (état des fils, propreté, usure des pièces).","Remplissage d'une fiche d'inspection quotidienne type.","Démonstration du nettoyage et du rangement de l'équipement après usage."]},"quiz":[["Quel équipement lave, frotte et sèche une grande surface en une passe ?",["Balai","Autolaveuse","Extracteur","Chariot"],1],["Quel équipement sert au nettoyage en profondeur des tapis ?",["Polisseuse","Extracteur","Aspirateur","Vadrouille"],1],["Pourquoi utilise-t-on un code de couleur pour les microfibres ?",["Pour la décoration","Pour éviter la contamination croisée","Pour identifier le fabricant","Aucune raison particulière"],1],["Quel équipement permet de lustrer ou décaper un plancher selon le tampon utilisé ?",["Aspirateur","Polisseuse","Chariot","Balai"],1],["Que doit-on vérifier avant d'utiliser un aspirateur ?",["Rien","L'état du filtre et le niveau du réservoir","La couleur","Le prix"],1],["Quel est l'avantage principal d'un chariot de nettoyage bien organisé ?",["Réduire les déplacements inutiles","Aucun avantage","Ralentir le travail","Alourdir la tâche"],0],["Quel outil est utilisé pour le dépoussiérage rapide avant un lavage humide ?",["Extracteur","Balai","Autolaveuse","Polisseuse"],1],["Que doit-on faire après l'utilisation d'un équipement ?",["Le laisser sale","Le nettoyer et le ranger correctement","L'abandonner","Rien de particulier"],1],["Quel document permet de suivre l'état quotidien des équipements ?",["Une facture","Une fiche d'inspection quotidienne","Un contrat client","Aucun document nécessaire"],1],["Quel équipement complète l'équipement motorisé pour les tâches ponctuelles ?",["Les outils manuels","L'autolaveuse","L'extracteur","La polisseuse"],0]]},{"num":5,"title":"Les techniques professionnelles de nettoyage","duree":"4 heures","objectifs":["Appliquer les bonnes techniques de nettoyage selon le type de surface","Adapter sa méthode selon l'environnement","Réaliser un mandat de nettoyage complet dans les règles de l'art"],"chapters":[{"title":"Dépoussiérage","content":["Le dépoussiérage consiste à retirer la poussière des surfaces horizontales et verticales à l'aide d'un chiffon sec ou légèrement humide, en travaillant du haut vers le bas pour éviter de resalir les surfaces déjà nettoyées."]},{"title":"Aspiration","content":["L'aspiration retire la saleté sèche et les débris des planchers et tapis. Il faut adapter la puissance et l'embout selon la surface, et passer méthodiquement pour ne rien oublier."]},{"title":"Nettoyage humide","content":["Le nettoyage humide utilise une solution nettoyante pour retirer la saleté incrustée sur une surface. Il faut utiliser la bonne dilution, rincer si nécessaire et bien assécher pour éviter les traces."]},{"title":"Sanitaires","content":["Le nettoyage des sanitaires suit un protocole strict : désinfection des toilettes, lavabos, miroirs et distributeurs, en respectant le temps de contact des désinfectants et en travaillant du plus propre au plus sale."]},{"title":"Cuisine","content":["L'entretien des cuisines exige une attention particulière à l'hygiène alimentaire : dégraissage des surfaces de cuisson, désinfection des comptoirs et gestion appropriée des déchets alimentaires."]},{"title":"Vitrerie","content":["Le nettoyage des vitres et miroirs sans traces demande une technique précise : application uniforme du produit, raclage en un seul mouvement continu, puis essuyage des contours avec un chiffon sec."]},{"title":"Escaliers","content":["L'entretien des escaliers combine dépoussiérage des marches et des mains courantes, avec une attention particulière à la sécurité (surfaces glissantes, signalisation pendant le lavage)."]},{"title":"Ascenseurs","content":["Les ascenseurs, à fort achalandage, nécessitent un entretien fréquent des parois, boutons et miroirs, ainsi que du plancher, souvent plusieurs fois par jour dans les grands édifices."]},{"title":"Entrées","content":["Les entrées principales sont les premières impressions d'un édifice : elles demandent un entretien fréquent des vitres, tapis et planchers pour gérer la saleté apportée de l'extérieur."]},{"title":"Salles de réunion","content":["L'entretien des salles de réunion inclut le nettoyage des tables, chaises, équipement audiovisuel et la remise en ordre de l'espace entre deux utilisations."]},{"title":"Planchers","content":["Chaque type de plancher (céramique, vinyle, bois, tapis) demande une méthode et des produits spécifiques; utiliser la mauvaise méthode peut endommager la surface de façon permanente."]},{"title":"Surfaces sensibles","content":["Certaines surfaces (bois verni, acier inoxydable, verre, marbre) sont sensibles aux rayures ou à certains produits chimiques et exigent des précautions particulières et des produits adaptés."]}],"activity":{"label":"Laboratoire","title":"Pratique complète","steps":["Mise en place d'un espace simulant plusieurs environnements réels (bureau, sanitaire, cuisine, salle de réunion).","Les participants réalisent, en rotation, un nettoyage complet de chaque poste en appliquant les techniques du module.","Le formateur observe et corrige les gestes en temps réel, puis anime un retour collectif sur les points forts et les points à améliorer."]},"quiz":[["Dans quel ordre doit-on dépoussiérer une pièce ?",["Du bas vers le haut","Du haut vers le bas","Aléatoirement","Aucune importance"],1],["Que faut-il adapter selon la surface lors de l'aspiration ?",["Rien","La puissance et l'embout","Uniquement la couleur de l'appareil","Le prix du produit"],1],["Quelle étape est essentielle après un nettoyage humide pour éviter les traces ?",["Laisser sécher à l'air libre sans essuyer","Bien assécher la surface","Ne rien faire","Ajouter plus d'eau"],1],["Dans quel ordre doit-on nettoyer les sanitaires ?",["Du plus sale au plus propre","Du plus propre au plus sale","Aléatoirement","Peu importe"],1],["Quelle est une priorité particulière lors de l'entretien d'une cuisine ?",["L'hygiène alimentaire","La décoration","Le bruit","Aucune priorité particulière"],0],["Quelle technique permet de nettoyer une vitre sans traces ?",["Frotter dans tous les sens","Application uniforme puis raclage en un mouvement continu","Utiliser un produit non dilué en excès","Ne jamais essuyer les contours"],1],["Quelle attention particulière faut-il porter à l'entretien des escaliers ?",["Aucune","La sécurité (surfaces glissantes, signalisation)","La décoration","La vitesse uniquement"],1],["Pourquoi les ascenseurs nécessitent-ils un entretien fréquent ?",["Ils sont rarement utilisés","Ils sont à fort achalandage","Ils ne se salissent jamais","Aucune raison"],1],["Pourquoi l'entretien des entrées principales est-il important ?",["Ce sont les premières impressions d'un édifice","Ce n'est pas important","Elles ne se salissent jamais","Aucune raison"],0],["Que doit-on faire entre deux utilisations d'une salle de réunion ?",["Rien","Nettoyer et remettre l'espace en ordre","Fermer la salle définitivement","Aucune action requise"],1],["Pourquoi chaque type de plancher demande-t-il une méthode spécifique ?",["Pour compliquer la tâche","Pour éviter d'endommager la surface","Ce n'est pas nécessaire","Aucune raison"],1],["Quelles surfaces sont considérées comme sensibles ?",["Le béton brut","Le bois verni, l'acier inoxydable, le verre, le marbre","Le plancher d'entrepôt","Aucune surface n'est sensible"],1],["Quel est l'objectif principal du laboratoire « Pratique complète » ?",["Mémoriser la théorie seulement","Réaliser un nettoyage complet en appliquant les techniques apprises","Regarder une vidéo","Aucun objectif particulier"],1],["Quelle méthode de travail doit-on privilégier pour être efficace et complet ?",["Travailler au hasard","Suivre une méthode systématique et structurée","Improviser à chaque mandat","Aucune méthode nécessaire"],1],["Que doit faire un professionnel qui n'est pas certain de la méthode appropriée pour une surface ?",["Utiliser n'importe quel produit","Vérifier les recommandations ou demander à son superviseur","Ignorer la surface","Utiliser un décapant systématiquement"],1]]},{"num":6,"title":"Service à la clientèle","duree":"1 heure","objectifs":["Adopter une attitude professionnelle avec la clientèle","Communiquer efficacement dans toutes les situations","Gérer les plaintes avec professionnalisme"],"chapters":[{"title":"Communication","content":["Une communication claire, polie et respectueuse avec le client permet d'éviter les malentendus et de bâtir une relation de confiance durable."]},{"title":"Attitude","content":["Une attitude positive et proactive, même face à des demandes imprévues, contribue directement à la satisfaction du client et à la réputation de l'entreprise."]},{"title":"Ponctualité","content":["Respecter les horaires convenus démontre le sérieux et le professionnalisme du travailleur; tout retard doit être communiqué le plus tôt possible."]},{"title":"Confidentialité","content":["Le respect strict de la confidentialité des lieux, des informations et des occupants est une condition essentielle de la confiance du client."]},{"title":"Professionnalisme","content":["Le professionnalisme se manifeste dans chaque geste : qualité du travail, respect des lieux, discrétion et constance d'un mandat à l'autre."]},{"title":"Gestion des plaintes","content":["Face à une plainte, il faut écouter activement, reconnaître le problème sans se justifier excessivement, et transmettre l'information à son superviseur pour trouver une solution rapide."]},{"title":"Image personnelle","content":["L'image personnelle (tenue, hygiène, langage) reflète directement l'image de l'entreprise auprès du client et doit toujours rester soignée et professionnelle."]}],"activity":{"label":"Jeux de rôle","title":"Mises en situation avec la clientèle","steps":["Les participants sont jumelés en équipes de deux : l'un joue le client, l'autre le professionnel du nettoyage.","Plusieurs scénarios sont proposés : client mécontent, demande de dernière minute, retard imprévu.","Chaque équipe présente sa mise en situation devant le groupe, suivie d'une rétroaction constructive du formateur."]},"quiz":[["Pourquoi la communication avec le client est-elle importante ?",["Elle ne l'est pas","Pour éviter les malentendus et bâtir la confiance","Uniquement pour la forme","Aucune raison"],1],["Que faire en cas de retard ?",["Ne rien dire","Communiquer le retard le plus tôt possible","Ignorer l'horaire","Annuler sans avertir"],1],["Que représente la confidentialité dans la relation avec le client ?",["Une condition essentielle de confiance","Une option facultative","Un détail sans importance","Une contrainte inutile"],0],["Comment doit-on réagir face à une plainte d'un client ?",["Se justifier excessivement","Écouter activement et transmettre l'information au superviseur","Ignorer la plainte","Répondre avec impatience"],1],["Qu'est-ce que le professionnalisme dans ce métier ?",["Un effort ponctuel","Une constance dans la qualité, le respect et la discrétion","Un concept vague sans application","Aucune importance"],1],["L'image personnelle d'un employé reflète :",["Uniquement sa personnalité","L'image de l'entreprise auprès du client","Rien de particulier","Aucun lien avec l'entreprise"],1],["Quelle attitude favorise la satisfaction du client ?",["Une attitude négative","Une attitude positive et proactive","L'indifférence","Le désintérêt"],1],["Quel est l'objectif des jeux de rôle dans ce module ?",["Divertir seulement","Pratiquer des situations réelles de communication avec la clientèle","Remplacer la théorie","Aucun objectif particulier"],1]]},{"num":7,"title":"Qualité et inspections","duree":"2 heures","objectifs":["Comprendre l'importance du contrôle de qualité","Utiliser une checklist d'inspection efficacement","Identifier et corriger les erreurs fréquentes"],"chapters":[{"title":"Pourquoi inspecter ?","content":["L'inspection permet de vérifier que le travail effectué répond aux attentes du client avant de quitter les lieux, plutôt que d'attendre une plainte pour corriger une erreur."]},{"title":"Les checklists","content":["Une checklist structure l'inspection en listant systématiquement chaque zone et chaque tâche à vérifier, assurant qu'aucun élément important n'est oublié."]},{"title":"Le contrôle qualité","content":["Le contrôle de qualité est un processus continu qui compare le résultat obtenu aux standards établis, et qui permet d'ajuster rapidement la méthode de travail si nécessaire."]},{"title":"Les erreurs fréquentes","content":["Certaines erreurs reviennent souvent : oubli de zones peu visibles, résidus de produit non essuyés, mauvaise dilution ou temps de contact non respecté. Les reconnaître permet de les éviter."]},{"title":"Rapports","content":["Un rapport d'inspection documente les résultats constatés, les correctifs apportés et sert de preuve de la qualité du travail auprès du client comme de l'employeur."]},{"title":"Amélioration continue","content":["L'amélioration continue consiste à utiliser les résultats des inspections pour ajuster ses méthodes et progresser constamment dans la qualité de son travail."]}],"activity":{"label":"Exercice","title":"Inspection réelle","steps":["Les participants réalisent une inspection complète d'un espace nettoyé au préalable, à l'aide d'une checklist standardisée.","Ils identifient les non-conformités et proposent les correctifs appropriés.","Un rapport d'inspection est rédigé et présenté au formateur."]},"quiz":[["Pourquoi effectuer une inspection avant de quitter un mandat ?",["Ce n'est pas nécessaire","Pour vérifier que le travail répond aux attentes du client","Pour perdre du temps","Aucune raison"],1],["Que permet une checklist d'inspection ?",["Rien de particulier","Structurer l'inspection et éviter les oublis","Remplacer le travail","Décorer le rapport"],1],["Qu'est-ce que le contrôle de qualité ?",["Un processus continu de comparaison aux standards établis","Une tâche facultative","Une action ponctuelle sans suite","Aucune démarche particulière"],0],["Laquelle de ces erreurs est fréquente lors d'un nettoyage ?",["Trop bien nettoyer","Oubli de zones peu visibles","Trop de rigueur","Aucune erreur possible"],1],["À quoi sert un rapport d'inspection ?",["À documenter les résultats et les correctifs","À rien de particulier","À remplacer la checklist","À décorer le dossier client"],0],["Que signifie l'amélioration continue ?",["Ne jamais changer sa méthode","Ajuster ses méthodes selon les résultats des inspections","Ignorer les retours","Aucun lien avec la qualité"],1],["Quelle est la conséquence possible d'un mauvais respect du temps de contact d'un désinfectant ?",["Aucune conséquence","Une désinfection incomplète","Une meilleure efficacité","Un résultat plus rapide"],1],["Que doit-on faire si une non-conformité est identifiée lors d'une inspection ?",["L'ignorer","Proposer et appliquer un correctif","Ne rien signaler","Attendre la plainte du client"],1],["Quel est le lien entre qualité et satisfaction client ?",["Aucun lien","Une qualité constante favorise la satisfaction et la fidélisation du client","La qualité nuit à la satisfaction","Aucun rapport possible"],1],["Quel outil permet de s'assurer qu'aucune zone n'est oubliée lors d'une inspection ?",["Une checklist","Une facture","Un contrat","Aucun outil nécessaire"],0]]},{"num":8,"title":"Préparation au marché du travail","duree":"1 heure","objectifs":["Préparer un CV et une entrevue efficaces","Comprendre les attentes des employeurs du secteur","Planifier son développement de carrière dans l'industrie"],"chapters":[{"title":"Créer un CV","content":["Un CV efficace pour le secteur du nettoyage met en valeur les compétences pratiques, la fiabilité, l'expérience pertinente et, le cas échéant, le certificat obtenu à la fin de la formation."]},{"title":"Préparer une entrevue","content":["Se préparer à une entrevue implique de connaître l'entreprise, de préparer des exemples concrets de son expérience et de se présenter avec une tenue et une attitude professionnelles."]},{"title":"Comment répondre aux questions","content":["Les réponses aux questions d'entrevue doivent être claires, honnêtes et structurées, en mettant l'accent sur ses forces, sa motivation et sa fiabilité."]},{"title":"Les attentes des employeurs","content":["Les employeurs du secteur recherchent avant tout la ponctualité, la fiabilité, le souci du détail et une bonne capacité à travailler de façon autonome ou en équipe."]},{"title":"L'image professionnelle","content":["Dès le premier contact avec un employeur potentiel, l'image professionnelle (tenue, ponctualité, communication) influence fortement la première impression."]},{"title":"Le développement de carrière","content":["Une fois en poste, il est possible de progresser vers un rôle de superviseur, de gestionnaire de contrat, ou de se diriger vers l'entrepreneuriat en poursuivant son parcours dans les niveaux suivants d'ESSOR Cleaning Academy™."]}],"activity":{"label":"Simulation","title":"Entrevue","steps":["Chaque participant réalise une simulation d'entrevue d'embauche avec le formateur ou un pair, à partir de questions typiques du secteur.","Rétroaction individuelle sur la préparation, la posture et les réponses données.","Remise d'un aide-mémoire des questions fréquentes en entrevue dans le secteur du nettoyage."]},"quiz":[["Que doit mettre en valeur un CV dans le secteur du nettoyage ?",["Uniquement les études","Les compétences pratiques, la fiabilité et le certificat obtenu","Rien de particulier","Les loisirs uniquement"],1],["Comment doit-on se préparer avant une entrevue ?",["Ne rien préparer","Connaître l'entreprise et préparer des exemples concrets","Improviser complètement","Arriver en retard"],1],["Quelles qualités les employeurs recherchent-ils le plus dans ce secteur ?",["La ponctualité et la fiabilité","Aucune qualité particulière","Uniquement l'expérience","Uniquement le diplôme"],0],["Quel est l'impact de l'image professionnelle lors d'un premier contact avec un employeur ?",["Aucun impact","Elle influence fortement la première impression","Elle est sans importance","Elle ne compte qu'après l'embauche"],1],["Quelle est une voie de progression possible après ce programme ?",["Aucune progression possible","Superviseur, gestionnaire de contrat ou entrepreneuriat","Uniquement rester nettoyeur à vie","Changer complètement de secteur"],1],["Comment doit-on répondre aux questions d'entrevue ?",["De façon vague","De façon claire, honnête et structurée","En évitant de répondre","En improvisant sans réfléchir"],1],["Quel est l'objectif de la simulation d'entrevue ?",["Aucun objectif","Pratiquer et recevoir une rétroaction avant une vraie entrevue","Remplacer le CV","Décorer le programme"],1],["Que permet un aide-mémoire des questions fréquentes en entrevue ?",["Rien de particulier","De mieux se préparer aux entrevues futures","De remplacer le CV","D'éviter toute préparation"],1]]}]},{"id":"cleaning-p1-en","lang":"en","badge":"ESSOR Cleaning Academy™ · English","title":"Program 1 — Foundations of Professional Cleaning","desc":"The complete 2-day (16-hour) training to start in professional cleaning: industry, products, techniques, safety, customer service and certification.","duration":"16 hours","level":"Beginner","modules":[{"num":1,"title":"Welcome to the Professional Cleaning Industry","duree":"2 hours","objectifs":["Understand the professional cleaning industry","Know the different sectors of activity","Identify the qualities of a cleaning professional","Understand the role of the commercial cleaner"],"chapters":[{"title":"A Word from the Founder","content":[["Why ESSOR Cleaning Academy?","ESSOR Cleaning Academy was born from a simple observation: professional cleaning is an essential trade, too often underestimated and undervalued, even though it demands real technical skills, discipline and a strong sense of service. Our academy was created to give this profession the recognition it deserves, and to offer every participant a true springboard: a stable job first, and then, for those who wish, their own business."],["Our mission","To train competent professionals who are proud of their trade, and to equip tomorrow's entrepreneurs with the knowledge, tools and support they need to succeed in the commercial cleaning industry."],["Our vision","To become the reference in professional training for the cleaning industry in Canada, recognized for the excellence of its graduates and the success of the businesses it has helped launch."],["Our philosophy","Learning by doing. Each participant progresses at their own pace, in an environment that is practical, supportive and demanding at the same time. No participant is left behind: each person's success contributes to the collective success of the ESSOR community."]]},{"title":"The Cleaning Industry in Canada","content":[["History","Long perceived as informal, unstructured work, professional cleaning has transformed into a true service industry over the past decades. The arrival of recognized norms (such as ISSA and CIMS standards), the professionalization of teams and increased attention to hygiene — accelerated by the pandemic — have made this sector a growing field that is increasingly demanding in terms of skills."],["Market figures","According to industry estimates, commercial and residential cleaning is today one of the largest employment sectors within business services in Canada, with constant demand for qualified companies and workers. The growth of commercial real estate, the aging population and new sanitary requirements continue to fuel this demand."],["The different employers","Graduates can work for commercial cleaning companies, property management firms, healthcare facilities, schools and government institutions, or start their own cleaning business as a self-employed worker or entrepreneur."],["Career outlook","The typical path leads from cleaner to team supervisor, then contract manager, with the possibility, in time, of owning your own commercial cleaning business — exactly the path offered by the Operations and Entrepreneurship streams of ESSOR Cleaning Academy™."]]},{"title":"Sectors of Activity","content":[["Offices","Routine maintenance of workspaces, meeting rooms, kitchenettes and washrooms, generally outside business hours."],["Residential buildings","Maintenance of common areas (lobbies, corridors, elevators, laundry rooms) in condominiums and multi-unit buildings."],["Daycares","Enhanced disinfection and products adapted to the presence of young children, with particular attention to the safety of the products used."],["Schools","Maintenance of classrooms, gymnasiums, cafeterias and washrooms, often on a strict schedule between school periods."],["Community centres","Maintenance of high-traffic, multi-purpose spaces requiring flexibility and responsiveness."],["Seniors' residences","High hygiene standards, sensitivity regarding the products used, and care and respect toward a vulnerable clientele."],["Shelters","Environments requiring sanitary rigour, discretion and a humane, respectful approach."],["Retail stores","Maintenance of sales floors, display windows and customer service areas, often outside business hours."],["Warehouses","Large surfaces, industrial floor maintenance, dust and debris management."],["Light industry","Maintenance of production spaces, with specific requirements related to safety and sometimes to special protocols (food areas, controlled zones)."]]},{"title":"The Role of the Professional","content":[["Responsibilities","Carry out assigned tasks according to established quality standards, respect schedules and report any anomaly (breakage, damage, missing product)."],["Attitude","Demonstrate rigour, autonomy and a positive attitude, even when facing the unexpected or repetitive tasks."],["Presentation","Wear clean, appropriate attire, respect personal hygiene standards and represent the company with dignity at the client's site."],["Communication","Communicate clearly with colleagues, supervisors and clients, and promptly report any problem encountered."],["Teamwork","Collaborate effectively with other team members, share useful information and help each other meet deadlines."],["Ethics","Show honesty, respect the client's equipment and premises, and never take property or information encountered in the workplace."],["Confidentiality","Respect the privacy of the client and its occupants; never disclose or use information seen or heard during an assignment."]]}],"activity":{"label":"Workshop","title":"Why Did You Choose This Profession?","steps":["In a group or individually, each participant shares in 2 to 3 minutes what motivated them to take this training.","The trainer leads a discussion on the group's shared motivations and connects them to the professional qualities seen in Chapter 4.","Goal: create a sense of belonging from the start and give meaning to the learning."]},"quiz":[["What is the mission of ESSOR Cleaning Academy™?",["To sell cleaning products","To train professionals and equip entrepreneurs","To manage buildings","To offer security services"],1],["Which recent event accelerated the professionalization of the cleaning industry?",["The 2008 financial crisis","The pandemic","Automation","Labour deregulation"],1],["Which of the following is NOT a typical employer of a professional cleaning graduate?",["Commercial cleaning company","Healthcare facility","Travel agency","School institution"],2],["What is the typical career path in the industry?",["Cleaner → supervisor → contract manager → entrepreneur","Supervisor → cleaner","Entrepreneur → cleaner","No advancement possible"],0],["In which sector are enhanced disinfection and product safety particularly important?",["Warehouses","Daycares","Offices","Retail stores"],1],["Which quality relates to respecting the client's privacy?",["Punctuality","Confidentiality","Presentation","Teamwork"],1],["What should a professional do upon noticing damage at a client's site?",["Ignore it","Repair it themselves without reporting it","Report it to their supervisor","Hide it"],2],["Which sector requires particular care toward a vulnerable, elderly clientele?",["Seniors' residences","Warehouses","Light industry","Offices"],0],["Which of these attitudes is expected of a cleaning professional?",["Negative attitude toward the unexpected","Autonomy and rigour","Indifference to schedules","Lack of communication"],1],["What is the teaching philosophy of ESSOR Cleaning Academy™?",["Learning through theory only","Learning by doing","Individual learning without support","No particular philosophy"],1]]},{"num":2,"title":"Health, Safety and Prevention","duree":"2 hours","objectifs":["Understand the risks related to the trade","Prevent workplace accidents","Work safely every day"],"chapters":[{"title":"Introduction to Health and Safety","content":["Occupational health and safety (OHS) aims to protect workers' physical and psychological integrity. In the cleaning field, risks are numerous: chemical products, equipment, slippery surfaces, manual handling. Every professional has the responsibility to know these risks, apply prevention measures and report any dangerous situation to their supervisor."]},{"title":"WHMIS","content":["The Workplace Hazardous Materials Information System (WHMIS) governs the labelling and communication of hazards related to chemical products. Every hazardous product must carry a standardized label with pictograms and be accompanied by a Safety Data Sheet (SDS) specifying its composition, hazards and the emergency measures to know before any use."]},{"title":"Chemical Products","content":["Some cleaning products can be irritating, corrosive or toxic if misused or mixed. It is essential to read the labels, respect the recommended dilutions and never mix two products without knowing their compatibility, since some mixtures can release dangerous gases."]},{"title":"Personal Protective Equipment","content":["Personal protective equipment (PPE) — gloves, goggles, masks, non-slip footwear — reduces the risks of exposure and injury. The choice of PPE depends on the task and the product used; it must be inspected before each use and replaced as soon as it is damaged."]},{"title":"Slip Prevention","content":["Wet floors are a frequent cause of accidents. Always mark washed areas with signs or cones, work in sections to leave a dry path, and wear shoes with non-slip soles."]},{"title":"Fall Prevention","content":["Falls from height (stepladder, stairs, uneven surfaces) can be avoided by using appropriate equipment, checking stability before climbing, and respecting the load and height limits recommended by the manufacturer."]},{"title":"Electrical Safety","content":["Using electrical equipment (vacuums, auto-scrubbers) requires checking the condition of cords and outlets before each use, avoiding contact with water, and unplugging the equipment before any maintenance on the machine itself."]},{"title":"Manual Handling","content":["Lifting and moving loads (carts, containers, furniture) must follow safe techniques: bend the knees, keep the back straight, keep the load close to the body, and ask for help with heavy or bulky loads."]},{"title":"First Aid","content":["In case of minor injury, it is important to know the location of the first aid kit and the basic steps to follow (clean and protect the wound), while promptly informing your supervisor of any injury, even a minor one."]},{"title":"Emergency Situations","content":["Every workplace has its own emergency procedures (fire, evacuation, major spill). It is essential to know the exits, assembly points and the person to contact in an emergency before starting an assignment."]},{"title":"Workplace Violence","content":["Workplace violence can take several forms: verbal, physical or psychological. Every professional has the right to work in a safe environment and must immediately report any violent situation to their supervisor."]},{"title":"Harassment","content":["Harassment, whether sexual, psychological or discriminatory, has no place in the industry. Participants learn to recognize unacceptable behaviours and the avenues available to report a harassment situation."]},{"title":"Accessibility (AODA)","content":["The Accessibility for Ontarians with Disabilities Act (AODA) imposes service and accessibility standards. Cleaning professionals must be aware of these standards, particularly when working in places frequented by people with disabilities."]}],"activity":{"label":"Workshop","title":"Identifying Hazards","steps":["Using photos or scenarios presented by the trainer, participants identify the hazards present (mislabelled product, unmarked wet floor, missing PPE, etc.).","Case study: in small groups, participants analyze a preventable accident scenario and propose the appropriate prevention measures.","Group debrief and discussion of the proposed solutions."]},"quiz":[["What does WHMIS stand for?",["Workplace Hazard Monitoring Inspection System","Workplace Hazardous Materials Information System","Warehouse Handling of Materials Information Service","None of these answers"],1],["What must appear on the label of a hazardous product?",["Only the price","Standardized hazard pictograms","The manufacturer's name only","Nothing in particular"],1],["What must be checked before mixing two chemical products?",["Their colour","Their compatibility","Their smell","Their price"],1],["Which of these items is personal protective equipment?",["A cart","Gloves","A mop","A vacuum"],1],["How should a freshly washed floor be marked?",["Do nothing","With a sign or a cone","By warning verbally only","It is not necessary"],1],["What is a good practice before climbing a stepladder?",["Check its stability","Use it regardless of its condition","Climb quickly","Check nothing"],0],["Before using electrical equipment, you must:",["Use it immediately","Check the condition of cords and outlets","Wet it","Ignore it"],1],["What is the proper technique for lifting a heavy load?",["Bend the back, legs straight","Bend the knees, back straight","Lift with the arms only","No particular technique"],1],["What must you do in case of injury, even a minor one?",["Ignore it","Inform your supervisor","Continue working without saying anything","Leave without notice"],1],["What must you know before starting an assignment in a new building?",["The exits and emergency procedures","The names of all employees","The company's history","Nothing in particular"],0],["What should you do when facing a situation of workplace violence?",["Say nothing","Report it immediately to your supervisor","Handle the situation alone with violence","Quit your job without explanation"],1],["Workplace harassment can be:",["Physical only","Verbal, psychological or discriminatory","Always without consequence","Acceptable if unintentional"],1],["What does AODA stand for?",["A product dilution standard","The Accessibility for Ontarians with Disabilities Act","A type of equipment","A union"],1],["What is the main objective of occupational health and safety?",["Reduce costs","Protect workers' physical and psychological integrity","Increase work speed","No particular objective"],1],["Who must report a dangerous situation observed in the workplace?",["Only the supervisor","Every cleaning professional","No one","Only the client"],1],["Which document accompanies a hazardous chemical product?",["An invoice","A Safety Data Sheet (SDS)","A generic user manual","No document"],1],["What type of footwear is recommended to prevent slips?",["High-heeled shoes","Shoes with non-slip soles","Sandals","Any type"],1],["What must be done before servicing the electrical part of a machine?",["Unplug it","Leave it plugged in","Use it under water","Nothing in particular"],0],["What is a possible consequence of not respecting recommended dilutions?",["No risk","Possible release of dangerous gases or an ineffective product","Improved results","Guaranteed savings"],1],["What attitude is expected if a participant witnesses harassment of a colleague?",["Ignore the situation","Encourage the behaviour","Report the situation","Mock along with the group"],2]]},{"num":3,"title":"Cleaning Products","duree":"2 hours","objectifs":["Understand the different families of products","Choose the right product for the task","Avoid errors in use and mixing"],"chapters":[{"title":"The Different Products","content":["Cleaning products are grouped into major families according to their function: general-purpose cleaners, disinfectants, degreasers, strippers and neutralizers. Knowing these families well allows you to choose the right product for the surface and the desired result, rather than using a single product for everything."]},{"title":"pH","content":["pH measures a product's level of acidity or alkalinity, on a scale of 0 to 14. An acidic product (low pH) is effective against scale and rust; an alkaline product (high pH) is effective against grease. Knowing the pH helps you avoid damaging certain sensitive surfaces."]},{"title":"Disinfectants","content":["Disinfectants eliminate bacteria, viruses and other micro-organisms present on an already-cleaned surface. Their effectiveness depends on respecting the contact time (dwell time) indicated on the label: apply, then let the product act for the recommended time before wiping."]},{"title":"Cleaners","content":["General-purpose cleaners remove everyday dirt (dust, marks, light residue) without necessarily disinfecting. They are suitable for the daily maintenance of low-risk surfaces such as desks or furniture."]},{"title":"Degreasers","content":["Degreasers are designed to dissolve greasy residue, particularly in kitchens or on industrial equipment. They are generally alkaline and must be rinsed carefully to avoid slippery residue."]},{"title":"Strippers","content":["Strippers remove layers of wax or finish accumulated on a floor before a new application. They are powerful products that require good ventilation and the wearing of appropriate protective equipment."]},{"title":"Neutralizers","content":["Neutralizers bring a surface back to a neutral pH after the use of a strong acidic or alkaline product, which protects the surface and prepares it for the next step (such as applying a floor finish)."]},{"title":"Eco-Friendly Products","content":["Eco-friendly products reduce environmental impact and health risks while meeting recognized certifications (such as EcoLogo or Green Seal). They are increasingly required by clients committed to sustainable development."]},{"title":"Dilutions","content":["Most professional products are concentrated and must be diluted according to a precise ratio indicated on the label. A product that is too concentrated can damage surfaces or pose a risk, while a product that is too diluted loses its effectiveness."]},{"title":"Storage","content":["Products must be stored in a ventilated area, away from heat and direct light, in their original or clearly labelled container, and separated according to their chemical compatibility."]},{"title":"Incompatibilities","content":["Some products must never be mixed, such as bleach and ammonia, which produce a toxic gas. Always check the Safety Data Sheet before combining or successively using two different products."]}],"activity":{"label":"Lab","title":"Preparing Solutions","steps":["Each participant learns to read the label of a concentrated product and calculate the required dilution ratio.","Demonstration and practice of safely preparing a solution using a dilution station or a graduated bottle.","The trainer checks each prepared solution."]},"quiz":[["Which product family is used to eliminate bacteria and viruses?",["Cleaner","Disinfectant","Neutralizer","Stripper"],1],["A product with a high pH is mainly effective against:",["Scale","Rust","Grease","Glass"],2],["What does \"contact time\" (dwell time) mean?",["The drying time","The time the product must stay on the surface to be effective","The transport time","It does not matter"],1],["Which product removes layers of wax accumulated on a floor?",["General-purpose cleaner","Stripper","Neutralizer","Disinfectant"],1],["Why is a neutralizer used?",["To add fragrance to a room","To bring a surface back to a neutral pH","To disinfect","To degrease"],1],["What must be checked before diluting a concentrated product?",["Its colour","The recommended dilution ratio on the label","Its price","Nothing in particular"],1],["Where should cleaning products be stored?",["Anywhere","In a ventilated area, away from heat, clearly labelled","In an unidentified container","In direct sunlight"],1],["Which mixture is dangerous and can produce a toxic gas?",["Water and cleaner","Bleach and ammonia","Two identical disinfectants","Water and soap"],1],["A certified eco-friendly product makes it possible to:",["Reduce environmental impact and health risks","Always clean faster","Replace all equipment","Avoid any dilution"],0],["What is the risk of using a product that is too concentrated?",["No risk","Damaging the surface or posing a health risk","Guaranteed better effectiveness","Automatic savings"],1]]},{"num":4,"title":"Equipment","duree":"2 hours","objectifs":["Recognize the main cleaning equipment","Use each piece of equipment correctly and safely","Maintain equipment to extend its service life"],"chapters":[{"title":"Vacuum","content":["The vacuum removes dust, dry dirt and debris from floors, carpets and fabrics. There are canister, bag and backpack models; choosing the right filter and emptying the tank regularly are essential to its effectiveness."]},{"title":"Auto-Scrubber","content":["The auto-scrubber washes, scrubs and dries large floor areas in a single pass. It considerably increases efficiency on large surfaces (warehouses, corridors) and requires regular maintenance of the tanks and brushes."]},{"title":"Floor Machine (Buffer)","content":["The floor machine can polish, strip or scrub floors depending on the type of brush or pad used. It requires good control of the movement to avoid damaging the surface."]},{"title":"Extractor","content":["The hot water extractor is used for deep cleaning carpets and fabrics, injecting a solution and then extracting it along with the dirt it contains."]},{"title":"Broom","content":["The broom remains the basic tool for quickly dusting floors before wet mopping. The choice of fibres (soft or stiff) depends on the type of surface."]},{"title":"Mop","content":["The mop is used for wet-washing floors. Microfibre models pick up dirt better and require less water than traditional mops."]},{"title":"Microfibre","content":["Microfibre cloths and mops effectively capture dust and bacteria thanks to their fine fibres. A colour code (by zone or by use) helps prevent cross-contamination between different surfaces."]},{"title":"Cart","content":["The cleaning cart makes it possible to transport, in an organized way, the products, tools and garbage bags needed for an assignment, reducing unnecessary trips and improving efficiency."]},{"title":"Hand Tools","content":["Squeegees, brushes, scrapers and other hand tools complement motorized equipment for one-off tasks or hard-to-reach surfaces."]}],"activity":{"label":"Workshop","title":"Daily Inspection","steps":["Participants learn to perform a visual and functional inspection of each piece of equipment before use (condition of cords, cleanliness, wear of parts).","Completion of a standard daily inspection sheet.","Demonstration of cleaning and storing the equipment after use."]},"quiz":[["Which equipment washes, scrubs and dries a large area in one pass?",["Broom","Auto-scrubber","Extractor","Cart"],1],["Which equipment is used for deep cleaning carpets?",["Floor machine","Extractor","Vacuum","Mop"],1],["Why is a colour code used for microfibre cloths?",["For decoration","To prevent cross-contamination","To identify the manufacturer","No particular reason"],1],["Which equipment can polish or strip a floor depending on the pad used?",["Vacuum","Floor machine","Cart","Broom"],1],["What must be checked before using a vacuum?",["Nothing","The condition of the filter and the tank level","The colour","The price"],1],["What is the main advantage of a well-organized cleaning cart?",["Reducing unnecessary trips","No advantage","Slowing down the work","Making the task heavier"],0],["Which tool is used for quick dusting before wet mopping?",["Extractor","Broom","Auto-scrubber","Floor machine"],1],["What must be done after using a piece of equipment?",["Leave it dirty","Clean it and store it properly","Abandon it","Nothing in particular"],1],["Which document tracks the daily condition of equipment?",["An invoice","A daily inspection sheet
