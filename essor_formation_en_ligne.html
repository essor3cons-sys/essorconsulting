","A client contract","No document needed"],1],["What complements motorized equipment for one-off tasks?",["Hand tools","The auto-scrubber","The extractor","The floor machine"],0]]},{"num":5,"title":"Professional Cleaning Techniques","duree":"4 hours","objectifs":["Apply the correct cleaning techniques for each type of surface","Adapt your method to the environment","Carry out a complete cleaning assignment to professional standards"],"chapters":[{"title":"Dusting","content":["Dusting consists of removing dust from horizontal and vertical surfaces using a dry or slightly damp cloth, working from top to bottom to avoid re-soiling surfaces that have already been cleaned."]},{"title":"Vacuuming","content":["Vacuuming removes dry dirt and debris from floors and carpets. The power and attachment must be adapted to the surface, and the work must be done methodically so nothing is missed."]},{"title":"Wet Cleaning","content":["Wet cleaning uses a cleaning solution to remove ingrained dirt from a surface. You must use the correct dilution, rinse if necessary and dry thoroughly to avoid streaks."]},{"title":"Washrooms","content":["Washroom cleaning follows a strict protocol: disinfection of toilets, sinks, mirrors and dispensers, respecting the contact time of disinfectants and working from cleanest to dirtiest."]},{"title":"Kitchens","content":["Kitchen maintenance requires particular attention to food hygiene: degreasing cooking surfaces, disinfecting counters and properly managing food waste."]},{"title":"Glass and Windows","content":["Cleaning windows and mirrors without streaks requires a precise technique: uniform application of the product, squeegeeing in a single continuous motion, then wiping the edges with a dry cloth."]},{"title":"Stairs","content":["Stair maintenance combines dusting of steps and handrails, with particular attention to safety (slippery surfaces, signage during washing)."]},{"title":"Elevators","content":["Elevators, being high-traffic areas, require frequent cleaning of walls, buttons and mirrors, as well as the floor — often several times a day in large buildings."]},{"title":"Entrances","content":["Main entrances are a building's first impression: they require frequent maintenance of windows, mats and floors to manage dirt brought in from outside."]},{"title":"Meeting Rooms","content":["Meeting room maintenance includes cleaning tables, chairs and audiovisual equipment, and tidying up the space between uses."]},{"title":"Floors","content":["Each type of floor (ceramic, vinyl, wood, carpet) requires a specific method and products; using the wrong method can permanently damage the surface."]},{"title":"Sensitive Surfaces","content":["Some surfaces (varnished wood, stainless steel, glass, marble) are sensitive to scratches or to certain chemical products and require special precautions and suitable products."]}],"activity":{"label":"Lab","title":"Complete Practice","steps":["Set-up of a space simulating several real environments (office, washroom, kitchen, meeting room).","Participants, in rotation, perform a complete cleaning of each station applying the module's techniques.","The trainer observes and corrects movements in real time, then leads a group debrief on strengths and areas for improvement."]},"quiz":[["In what order should a room be dusted?",["Bottom to top","Top to bottom","Randomly","It does not matter"],1],["What must be adapted to the surface when vacuuming?",["Nothing","The power and the attachment","Only the machine's colour","The product's price"],1],["Which step is essential after wet cleaning to avoid streaks?",["Air-dry without wiping","Dry the surface thoroughly","Do nothing","Add more water"],1],["In what order should washrooms be cleaned?",["From dirtiest to cleanest","From cleanest to dirtiest","Randomly","It does not matter"],1],["What is a particular priority when maintaining a kitchen?",["Food hygiene","Decoration","Noise","No particular priority"],0],["Which technique cleans a window without streaks?",["Rub in all directions","Uniform application then squeegeeing in one continuous motion","Use an excess of undiluted product","Never wipe the edges"],1],["What particular attention is required when maintaining stairs?",["None","Safety (slippery surfaces, signage)","Decoration","Speed only"],1],["Why do elevators require frequent cleaning?",["They are rarely used","They are high-traffic areas","They never get dirty","No reason"],1],["Why is the maintenance of main entrances important?",["They are a building's first impression","It is not important","They never get dirty","No reason"],0],["What must be done between two uses of a meeting room?",["Nothing","Clean and tidy up the space","Close the room permanently","No action required"],1],["Why does each type of floor require a specific method?",["To complicate the task","To avoid damaging the surface","It is not necessary","No reason"],1],["Which surfaces are considered sensitive?",["Raw concrete","Varnished wood, stainless steel, glass, marble","Warehouse floors","No surface is sensitive"],1],["What is the main objective of the \"Complete Practice\" lab?",["Memorize theory only","Perform a complete cleaning applying the techniques learned","Watch a video","No particular objective"],1],["Which work method should be favoured to be efficient and thorough?",["Work at random","Follow a systematic, structured method","Improvise on each assignment","No method needed"],1],["What should a professional do when unsure of the appropriate method for a surface?",["Use any product","Check the recommendations or ask their supervisor","Ignore the surface","Always use a stripper"],1]]},{"num":6,"title":"Customer Service","duree":"1 hour","objectifs":["Adopt a professional attitude with clients","Communicate effectively in all situations","Handle complaints professionally"],"chapters":[{"title":"Communication","content":["Clear, polite and respectful communication with the client avoids misunderstandings and builds a lasting relationship of trust."]},{"title":"Attitude","content":["A positive, proactive attitude, even with unexpected requests, contributes directly to client satisfaction and to the company's reputation."]},{"title":"Punctuality","content":["Respecting agreed schedules demonstrates the worker's seriousness and professionalism; any delay must be communicated as early as possible."]},{"title":"Confidentiality","content":["Strict respect for the confidentiality of the premises, information and occupants is an essential condition of the client's trust."]},{"title":"Professionalism","content":["Professionalism shows in every action: quality of work, respect for the premises, discretion and consistency from one assignment to the next."]},{"title":"Handling Complaints","content":["When facing a complaint, you must listen actively, acknowledge the problem without excessive self-justification, and pass the information on to your supervisor to find a quick solution."]},{"title":"Personal Image","content":["Personal image (attire, hygiene, language) directly reflects the company's image to the client and must always remain neat and professional."]}],"activity":{"label":"Role Play","title":"Client Scenarios","steps":["Participants are paired in teams of two: one plays the client, the other the cleaning professional.","Several scenarios are proposed: dissatisfied client, last-minute request, unexpected delay.","Each team presents its scenario to the group, followed by constructive feedback from the trainer."]},"quiz":[["Why is communication with the client important?",["It is not","To avoid misunderstandings and build trust","Only for appearances","No reason"],1],["What should you do in case of a delay?",["Say nothing","Communicate the delay as early as possible","Ignore the schedule","Cancel without notice"],1],["What does confidentiality represent in the client relationship?",["An essential condition of trust","An optional extra","An unimportant detail","A useless constraint"],0],["How should you react to a client's complaint?",["Justify yourself excessively","Listen actively and pass the information to the supervisor","Ignore the complaint","Respond impatiently"],1],["What is professionalism in this trade?",["A one-time effort","Consistency in quality, respect and discretion","A vague concept with no application","Of no importance"],1],["An employee's personal image reflects:",["Only their personality","The company's image to the client","Nothing in particular","No link with the company"],1],["Which attitude promotes client satisfaction?",["A negative attitude","A positive, proactive attitude","Indifference","Disinterest"],1],["What is the objective of the role plays in this module?",["Entertainment only","Practising real client communication situations","Replacing theory","No particular objective"],1]]},{"num":7,"title":"Quality and Inspections","duree":"2 hours","objectifs":["Understand the importance of quality control","Use an inspection checklist effectively","Identify and correct frequent errors"],"chapters":[{"title":"Why Inspect?","content":["Inspection makes it possible to verify that the work performed meets the client's expectations before leaving the premises, rather than waiting for a complaint to correct an error."]},{"title":"Checklists","content":["A checklist structures the inspection by systematically listing every zone and every task to verify, ensuring that no important element is forgotten."]},{"title":"Quality Control","content":["Quality control is a continuous process that compares the result obtained against established standards, and allows the work method to be adjusted quickly if necessary."]},{"title":"Frequent Errors","content":["Some errors come up often: overlooked low-visibility areas, unwiped product residue, incorrect dilution or unrespected contact time. Recognizing them helps avoid them."]},{"title":"Reports","content":["An inspection report documents the results observed and the corrections made, and serves as proof of the quality of the work for both the client and the employer."]},{"title":"Continuous Improvement","content":["Continuous improvement means using inspection results to adjust your methods and constantly progress in the quality of your work."]}],"activity":{"label":"Exercise","title":"Real Inspection","steps":["Participants perform a complete inspection of a previously cleaned space, using a standardized checklist.","They identify non-conformities and propose the appropriate corrections.","An inspection report is written and presented to the trainer."]},"quiz":[["Why perform an inspection before leaving an assignment?",["It is not necessary","To verify that the work meets the client's expectations","To waste time","No reason"],1],["What does an inspection checklist make possible?",["Nothing in particular","Structuring the inspection and avoiding omissions","Replacing the work","Decorating the report"],1],["What is quality control?",["A continuous process of comparison against established standards","An optional task","A one-time action with no follow-up","No particular process"],0],["Which of these errors is frequent during cleaning?",["Cleaning too well","Overlooking low-visibility areas","Too much rigour","No error possible"],1],["What is an inspection report for?",["Documenting the results and corrections","Nothing in particular","Replacing the checklist","Decorating the client file"],0],["What does continuous improvement mean?",["Never changing your method","Adjusting your methods based on inspection results","Ignoring feedback","No link with quality"],1],["What is a possible consequence of not respecting a disinfectant's contact time?",["No consequence","Incomplete disinfection","Better effectiveness","A faster result"],1],["What must be done if a non-conformity is identified during an inspection?",["Ignore it","Propose and apply a correction","Report nothing","Wait for the client's complaint"],1],["What is the link between quality and client satisfaction?",["No link","Consistent quality promotes client satisfaction and loyalty","Quality harms satisfaction","No possible connection"],1],["Which tool ensures that no zone is forgotten during an inspection?",["A checklist","An invoice","A contract","No tool needed"],0]]},{"num":8,"title":"Preparing for the Job Market","duree":"1 hour","objectifs":["Prepare an effective resume and interview","Understand the expectations of employers in the sector","Plan your career development in the industry"],"chapters":[{"title":"Creating a Resume","content":["An effective resume for the cleaning sector highlights practical skills, reliability, relevant experience and, where applicable, the certificate obtained at the end of the training."]},{"title":"Preparing for an Interview","content":["Preparing for an interview means knowing the company, preparing concrete examples of your experience and presenting yourself with professional attire and attitude."]},{"title":"How to Answer Questions","content":["Answers to interview questions must be clear, honest and structured, emphasizing your strengths, motivation and reliability."]},{"title":"Employer Expectations","content":["Employers in the sector look above all for punctuality, reliability, attention to detail and a good ability to work independently or as part of a team."]},{"title":"Professional Image","content":["From the very first contact with a potential employer, professional image (attire, punctuality, communication) strongly influences the first impression."]},{"title":"Career Development","content":["Once employed, it is possible to progress to a supervisor or contract manager role, or to move toward entrepreneurship by continuing your journey in the next levels of ESSOR Cleaning Academy™."]}],"activity":{"label":"Simulation","title":"Interview","steps":["Each participant performs a job interview simulation with the trainer or a peer, based on typical questions from the sector.","Individual feedback on preparation, posture and the answers given.","Distribution of a memory aid of frequent interview questions in the cleaning sector."]},"quiz":[["What should a resume highlight in the cleaning sector?",["Education only","Practical skills, reliability and the certificate obtained","Nothing in particular","Hobbies only"],1],["How should you prepare before an interview?",["Prepare nothing","Know the company and prepare concrete examples","Improvise completely","Arrive late"],1],["Which qualities do employers look for most in this sector?",["Punctuality and reliability","No particular quality","Experience only","Diploma only"],0],["What is the impact of professional image on a first contact with an employer?",["No impact","It strongly influences the first impression","It is unimportant","It only matters after hiring"],1],["What is a possible path of progression after this program?",["No progression possible","Supervisor, contract manager or entrepreneurship","Only remaining a cleaner forever","Changing sectors completely"],1],["How should you answer interview questions?",["Vaguely","Clearly, honestly and in a structured way","By avoiding answering","By improvising without thinking"],1],["What is the objective of the interview simulation?",["No objective","Practising and receiving feedback before a real interview","Replacing the resume","Decorating the program"],1],["What does a memory aid of frequent interview questions provide?",["Nothing in particular","Better preparation for future interviews","A replacement for the resume","A way to avoid any preparation"],1]]}]},{"id":"francais-pro","lang":"fr","badge":"Essor Consulting Group","title":"Français professionnel — Communication au travail","desc":"Un cours pratique pour communiquer avec assurance en milieu de travail : se présenter, comprendre les consignes, parler aux clients et lire les documents de travail.","duration":"6 heures","level":"Débutant / Intermédiaire","modules":[{"num":1,"title":"Se présenter et accueillir en milieu de travail","duree":"1 h 30","objectifs":["Se présenter clairement en contexte professionnel","Saluer et accueillir un client ou un collègue","Utiliser les formules de politesse essentielles"],"chapters":[{"title":"Les salutations professionnelles","content":[["Saluer selon le moment","« Bonjour » s'utilise du matin jusqu'à la fin de l'après-midi ; « Bonsoir » en soirée. En contexte professionnel au Canada, « Bonjour » est la salutation la plus sûre et la plus utilisée, même en fin de journée."],["Tutoiement ou vouvoiement ?","Avec un client, un supérieur ou une personne que l'on rencontre pour la première fois, on utilise « vous » (vouvoiement). Le « tu » (tutoiement) se réserve aux collègues proches, et seulement lorsque la personne l'a proposé."],["Formules d'accueil","« Bonjour, bienvenue chez [nom de l'entreprise]. Comment puis-je vous aider ? » — cette formule simple fonctionne dans presque toutes les situations d'accueil."]]},{"title":"Se présenter en une minute","content":[["La structure de base","Nom + rôle + entreprise : « Bonjour, je m'appelle Marie Dubé. Je suis préposée à l'entretien chez ESSOR. » Court, clair, professionnel."],["Parler de son expérience","Utilisez le passé composé pour vos expériences : « J'ai travaillé deux ans dans un hôtel. » et le présent pour votre poste actuel : « Je travaille maintenant dans les bureaux commerciaux. »"],["Les questions courantes en entrevue","« Parlez-moi de vous », « Quelles sont vos disponibilités ? », « Pourquoi voulez-vous ce poste ? » — préparez une réponse simple de deux ou trois phrases pour chacune."]]}],"activity":{"label":"Exercice pratique","title":"Ma présentation en 60 secondes","steps":["Écrivez votre présentation : nom, rôle, expérience (3 à 4 phrases).","Lisez-la à voix haute trois fois.","Enregistrez-vous avec votre téléphone et réécoutez-vous.","Présentez-vous à un proche et demandez ses commentaires."]},"quiz":[["Quelle salutation convient le mieux avec un nouveau client à 15 h ?",["Salut !","Bonjour","Allô","Hé !"],1],["Avec un supérieur rencontré pour la première fois, on utilise…",["le tutoiement (tu)","le vouvoiement (vous)","aucun pronom","son prénom seulement"],1],["Quelle phrase est correcte pour parler d'une expérience passée ?",["Je travaille deux ans dans un hôtel","J'ai travaillé deux ans dans un hôtel","Je travaillerai deux ans dans un hôtel","Je travaillant deux ans dans un hôtel"],1],["La structure de base d'une présentation professionnelle est :",["Âge + adresse + salaire","Nom + rôle + entreprise","Loisirs + famille + études","Salaire + horaire + vacances"],1],["« Comment puis-je vous aider ? » est une formule…",["d'accueil","d'adieu","d'excuse","de plainte"],0]]},{"num":2,"title":"Le vocabulaire du travail et des consignes","duree":"1 h 30","objectifs":["Comprendre les consignes de travail courantes","Maîtriser le vocabulaire des lieux, des outils et des tâches","Demander une clarification poliment"],"chapters":[{"title":"Comprendre une consigne","content":[["Les verbes de consigne","Nettoyer, vider, passer (l'aspirateur), essuyer, désinfecter, ranger, vérifier, remplacer : ces verbes reviennent constamment dans les consignes de travail. À l'impératif : « Videz les poubelles », « Vérifiez les distributeurs »."],["Les mots de fréquence","Toujours, jamais, chaque jour, une fois par semaine, avant de partir, en arrivant : ces expressions précisent quand faire la tâche. « Désinfectez les poignées de porte chaque jour. »"],["Demander de répéter poliment","« Pouvez-vous répéter, s'il vous plaît ? », « Je ne suis pas sûr d'avoir compris, pouvez-vous me montrer ? » — demander une clarification est un signe de professionnalisme, jamais une faiblesse."]]},{"title":"Le vocabulaire des lieux et du matériel","content":[["Les lieux de travail","Le bureau, la salle de réunion, la cuisine, les toilettes, le hall d'entrée, l'entrepôt, le corridor, l'ascenseur, les escaliers, le stationnement."],["Le matériel courant","La vadrouille, le seau, le chiffon (en microfibre), l'aspirateur, le balai, le porte-poussière, les gants, le chariot d'entretien, le produit nettoyant, le désinfectant."],["Les indications de lieu","Sur, sous, dans, à côté de, derrière, devant, au fond de, à gauche, à droite : « Le produit est dans l'armoire, à gauche de l'évier. »"]]}],"activity":{"label":"Exercice pratique","title":"Dictée de consignes","steps":["Demandez à quelqu'un de vous lire cinq consignes de travail.","Écrivez-les, puis vérifiez l'orthographe ensemble.","Reformulez chaque consigne dans vos propres mots."]},"quiz":[["« Videz les poubelles avant de partir » signifie qu'il faut le faire…",["en arrivant le matin","à la fin du quart de travail","une fois par mois","seulement si on a le temps"],1],["Quel objet sert à laver les planchers ?",["Le chiffon","La vadrouille","Le porte-poussière","Les gants"],1],["Quelle phrase est la façon la plus professionnelle de demander une clarification ?",["Quoi ?","Répète !","Pouvez-vous répéter, s'il vous plaît ?","Je n'ai rien compris."],2],["« Le produit est dans l'armoire, à gauche de l'évier. » Où est le produit ?",["Sur l'évier","Sous l'armoire","Dans l'armoire","Derrière l'évier"],2],["« Chaque jour » est une expression de…",["lieu","fréquence","quantité","politesse"],1]]},{"num":3,"title":"Communiquer avec les clients et les collègues","duree":"1 h 30","objectifs":["Répondre poliment à une demande ou à une plainte","Signaler un problème à son superviseur","Utiliser le téléphone et les messages texte professionnels"],"chapters":[{"title":"Répondre à une demande ou à une plainte","content":[["Rester calme et poli","Face à une plainte : écouter sans interrompre, remercier la personne, proposer une solution. « Merci de me l'avoir signalé. Je m'en occupe tout de suite. »"],["Dire non poliment","Quand une demande dépasse votre rôle : « Je ne suis pas autorisé à faire cela, mais je vais transmettre votre demande à mon superviseur. » On ne dit jamais simplement « non, ce n'est pas mon trav /* ---------- storage ---------- */
function loadUsers(){ try{return JSON.parse(localStorage.getItem('essor_lms_users')||'{}')}catch(e){return{}} }
function saveUsers(u){ localStorage.setItem('essor_lms_users', JSON.stringify(u)); }
function sessionEmail(){ return localStorage.getItem('essor_lms_session'); }
function currentUser(){ const e=sessionEmail(); if(!e) return null; return loadUsers()[e]||null; }
function saveUser(u){ const users=loadUsers(); users[u.email]=u; saveUsers(users); }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function courseById(id){ return COURSES.find(c=>c.id===id); }
function prog(u,cid){ u.progress=u.progress||{}; u.progress[cid]=u.progress[cid]||{read:{},scores:{}}; return u.progress[cid]; }
function chapKey(m,ci){ return 'm'+m.num+'c'+ci; }
function moduleDone(u,c,m){ const p=prog(u,c.id); const allRead=m.chapters.every((_,i)=>p.read[chapKey(m,i)]); const q=(m.quiz&&m.quiz.length)?(p.scores[m.num]!==undefined&&p.scores[m.num]>=PASS):true; return allRead&&q; }
function moduleStarted(u,c,m){ const p=prog(u,c.id); return m.chapters.some((_,i)=>p.read[chapKey(m,i)])||p.scores[m.num]!==undefined; }
function coursePct(u,c){
  let total=0,done=0;
  c.modules.forEach(m=>{ total+=m.chapters.length; const p=prog(u,c.id);
    m.chapters.forEach((_,i)=>{ if(p.read[chapKey(m,i)])done++; });
    if(m.quiz&&m.quiz.length){ total++; if(p.scores[m.num]!==undefined&&p.scores[m.num]>=PASS)done++; }
  });
  return total?Math.round(done/total*100):0;
}
function courseComplete(u,c){ return c.modules.every(m=>moduleDone(u,c,m)); }

/* ---------- router ---------- */
let view={name:'auth'};
function go(name,a,b){ view={name,a,b}; render(); window.scrollTo(0,0); }
function render(){
  const app=document.getElementById('app');
  const u=currentUser();
  document.getElementById('userbox').classList.toggle('hidden',!u);
  if(u){ document.getElementById('username').textContent=u.name; document.getElementById('avatar').textContent=(u.name||'?').trim().charAt(0).toUpperCase(); }
  if(!u){ app.innerHTML=authView(); return; }
  if(view.name==='auth') view={name:'dashboard'};
  if(view.name==='dashboard') app.innerHTML=dashView(u);
  else if(view.name==='course') app.innerHTML=courseView(u,courseById(view.a));
  else if(view.name==='module') app.innerHTML=moduleView(u,courseById(view.a),view.b);
  else if(view.name==='quiz') app.innerHTML=quizView(u,courseById(view.a),view.b);
  else if(view.name==='cert') app.innerHTML=certView(u,courseById(view.a));
}

      <div class="frow"><label>Courriel</label><input id="f-email" type="email" placeholder="vous@exemple.com"></div>
      <div class="frow"><label>Mot de passe</label><input id="f-pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="${authTab==='login'?'doLogin()':'doSignup()'}">${authTab==='login'?'Se connecter':'Créer mon compte'}</button>
    </div>
  </div>`;
}
function doSignup(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const pass=document.getElementById('f-pass').value;
  const code=(document.getElementById('f-code').value||'').trim().toUpperCase();
  const err=document.getElementById('autherr');
  if(!name||!email||!pass||!code){ err.textContent='Veuillez remplir tous les champs, y compris le code d\'accès.'; return; }
  if(!ACCESS_CODES.includes(btoa(code))){ err.textContent='Code d\'accès invalide. Contactez ESSOR pour obtenir votre code : essor3cons@gmail.com'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Courriel invalide.'; return; }
  if(pass.length<4){ err.textContent='Mot de passe trop court (4 caractères min.).'; return; }
  const users=loadUsers();
  if(users[email]){ err.textContent='Un compte existe déjà avec ce courriel.'; return; }
  users[email]={name,email,pw:btoa(pass),progress:{},created:new Date().toISOString()};
  saveUsers(users); localStorage.setItem('essor_lms_session',email);
  go('dashboard');
}
function doLogin(){
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const pass=document.getElementById('f-pass').value;
  const err=document.getElementById('autherr');
  const u=loadUsers()[email];
  if(!u||u.pw!==btoa(pass)){ err.textContent='Courriel ou mot de passe incorrect.'; return; }
  localStorage.setItem('essor_lms_session',email);
  go('dashboard');
}
function logout(){ localStorage.removeItem('essor_lms_session'); view={name:'auth'}; render(); }

  <div class="quiz-cta">
    <h4>${t.modQuiz} ${m.num}</h4>
    <p>${m.quiz.length} ${t.passNote} : ${PASS} %${score!==undefined?'':t.retryHint}</p>
    <button class="btn btn-primary" onclick="go('quiz','${c.id}',${m.num})">${score!==undefined?t.retakeQuiz:t.startQuiz}</button>
    ${score!==undefined?`<br><span class="score-pill ${score>=PASS?'st-done':'st-prog'}" style="border:none">${t.lastScore} : ${score} % ${score>=PASS?t.passed:t.failedRetry}</span>`:''}
  </div>`:''}
  <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="go('course','${c.id}')">${t.backModules}</button>
    ${num<c.modules.length?`<button class="btn btn-primary btn-sm" onclick="openChap=-1;go('module','${c.id}',${num+1})">${t.nextModule}</button>`:''}
  </div>`;
}
function toggleChap(i){ openChap=(openChap===i?-1:i); render(); }
function markRead(cid,mnum,ci){
  const u=currentUser(); const c=courseById(cid); const m=courseModule(c,mnum);
  prog(u,cid).read[chapKey(m,ci)]=true; saveUser(u);
  openChap=(ci+1<m.chapters.length)?ci+1:-1;
  render();
}

/* ---------- quiz ---------- */
let quizState=null;
function quizView(u,c,num){
  const m=courseModule(c,num); const t=T(c);
  if(!quizState||quizState.cid!==c.id||quizState.m!==num){ quizState={cid:c.id,m:num,answers:{},submitted:false,score:0}; }
  const q=m.quiz;
  if(quizState.submitted){
    const pct=quizState.score;
    return `
    <div class="crumb"><a href="#" onclick="quizState=null;go('module','${c.id}',${num});return false;">${t.backModule} ${num}</a></div>
    <div class="quiz-result">
      <div class="big">${pct} %</div>
      <p>${pct>=PASS?t.passMsg:t.failMsg.replace('{p}',PASS)}</p>
    </div>
    ${q.map((qq,qi)=>{
      const sel=quizState.answers[qi];
      return `<div class="qcard"><h4>${qi+1}. ${esc(qq[0])}</h4>
      ${qq[1].map((opt,oi)=>{
        let cls=''; if(oi===qq[2])cls='correct'; else if(sel===oi)cls='wrong';
        return `<div class="qopt ${cls}"><span>${oi===qq[2]?'✓':(sel===oi?'✗':'•')}</span><span>${esc(opt)}</span></div>`;
      }).join('')}</div>`;
    }).join('')}
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="quizState=null;go('module','${c.id}',${num})">${t.backModule}</button>
      ${pct<PASS?`<button class="btn btn-primary btn-sm" onclick="quizState=null;go('quiz','${c.id}',${num})">${t.retry}</button>`:
        (num<c.modules.length?`<button class="btn btn-primary btn-sm" onclick="quizState=null;openChap=-1;go('module','${c.id}',${num+1})">${t.nextModule}</button>`:
        `<button class="btn btn-primary btn-sm" onclick="quizState=null;go('course','${c.id}')">${t.finish}</button>`)}
    </div>`;
  }
  return `
  <div class="crumb"><a href="#" onclick="quizState=null;go('module','${c.id}',${num});return false;">${t.backModule} ${num}</a></div>
  <div class="page-head"><h2>${t.quizTitle} ${num}</h2><p>${q.length} ${t.passNote} : ${PASS} %</p></div>
  ${q.map((qq,qi)=>`
  <div class="qcard"><h4>${qi+1}. ${esc(qq[0])}</h4>
    ${qq[1].map((opt,oi)=>`
    <label class="qopt"><input type="radio" name="q${qi}" ${quizState.answers[qi]===oi?'checked':''} onchange="quizState.answers[${qi}]=${oi}"><span>${esc(opt)}</span></label>`).join('')}
  </div>`).join('')}
  <button class="btn btn-primary" onclick="submitQuiz('${c.id}',${num})">${t.submit}</button>`;
}
function submitQuiz(cid,num){
  const c=courseById(cid); const m=courseModule(c,num); const q=m.quiz;
  const unanswered=q.findIndex((_,qi)=>quizState.answers[qi]===undefined);
  if(unanswered!==-1){ alert(T(c).answerFirst.replace('{n}',unanswered+1)); return; }
  let good=0; q.forEach((qq,qi)=>{ if(quizState.answers[qi]===qq[2])good++; });
  const pct=Math.round(good/q.length*100);
  quizState.submitted=true; quizState.score=pct;
  const u=currentUser(); const p=prog(u,cid);
  if(p.scores[num]===undefined||pct>p.scores[num]) p.scores[num]=pct;
  saveUser(u); render(); window.scrollTo(0,0);
}

/* ---------- certificate ---------- */
function certView(u,c){
  if(!courseComplete(u,c)){ go('course',c.id); return ''; }
  const t=T(c);
  const d=new Date().toLocaleDateString(t.locale,{year:'numeric',month:'long',day:'numeric'});
  return `
  <div class="crumb"><a href="#" onclick="go('course','${c.id}');return false;">${t.backCourse}</a></div>
  <div class="cert">
    <div class="small">${esc(c.badge)}</div>
    <h2>${t.certTitle}</h2>
    <p>${t.certAward}</p>
    <div class="name">${esc(u.name)}</div>
    <p>${t.certFor}</p>
    <div class="course">${esc(c.title)}</div>
    <p>${t.certMeta.replace('{d}',esc(c.duration)).replace('{m}',c.modules.length)}</p>
    <div class="sig-row">
      <div class="sig">${t.certDir}</div>
      <div class="sig">${t.certIssued} ${d}</div>
    </div>
  </div>
  <div class="cert-actions"><button class="btn btn-primary" onclick="window.print()">${t.print}</button></div>`;
}

render();
</script>
</body>
</html>
